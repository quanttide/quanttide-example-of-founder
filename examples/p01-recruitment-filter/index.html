<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘筛选 - PoC 01</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f1f5f9;--surface:#fff;--border:#d1d9e6;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--primary:#1e40af;--blue:#3b82f6;--success:#22c55e;--danger:#ef4444;--orange:#f97316;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.header{background:var(--primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600}
.header span{font-size:13px;opacity:.8}
.stats{display:flex;gap:1px;background:var(--border)}
.stats>div{flex:1;background:var(--surface);padding:12px;text-align:center}
.stats .num{font-size:22px;font-weight:700;color:var(--primary)}
.stats .lbl{font-size:12px;color:var(--text2);margin-top:2px}
.main{display:flex;height:calc(100vh - 112px)}
.inbox{width:45%;min-width:360px;background:var(--surface);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.preview{flex:1;background:var(--surface);display:flex;flex-direction:column}
.phead{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.list{flex:1;overflow-y:auto}
.email{padding:12px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .1s;position:relative}
.email:hover{background:#f8fafc}
.email.sel{background:#eff6ff;border-left:3px solid var(--blue);padding-left:13px}
.email .top{display:flex;justify-content:space-between;align-items:center}
.email .name{font-weight:600;font-size:14px}
.email .subject{font-size:12px;color:var(--text2);margin-top:2px}
.email .detect{display:inline-flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge.only{background:#fee2e2;color:#991b1b}
.badge.has{background:#dcfce7;color:#166534}
.badge.part{background:#fef3c7;color:#92400e}
.badge.attach{background:#e0e7ff;color:#1e40af}
.fold{font-size:20px;color:var(--text3);min-width:28px;text-align:center}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:8px}
.empty-state .icon{font-size:40px;opacity:.5}
.scroll{flex:1;overflow-y:auto;padding:20px 24px}
.msg-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.msg-meta>div{font-size:13px}
.msg-meta .tag{color:var(--text2)}
.msg-body{white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--text);padding:16px;background:#f8fafc;border-radius:var(--radius);min-height:80px}
.msg-body.empty{color:var(--text3);font-style:italic}
.attach-box{padding:12px 16px;margin-top:12px;background:#f8fafc;border-radius:var(--radius);display:flex;align-items:center;gap:8px;font-size:13px}
.attach-box .icon{font-size:18px}
.verdict{margin-top:16px;padding:14px 16px;border-radius:var(--radius);font-size:14px}
.virtue.pass{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.virtue.reject{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.virtue.manual{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.virtue strong{display:block;margin-bottom:4px}
.action-bar{margin-top:16px;display:flex;gap:8px}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--primary)}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-danger:hover{background:#fecaca}
.btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<div class="header">
  <h1>招聘筛选网关</h1>
  <span>PoC 01 — 只发简历的挡住</span>
</div>

<div class="stats" id="stats">
  <div><div class="num" id="s-total">0</div><div class="lbl">总邮件</div></div>
  <div><div class="num" id="s-only">0</div><div class="lbl">仅简历</div></div>
  <div><div class="num" id="s-has">0</div><div class="lbl">有正文</div></div>
  <div><div class="num" id="s-auto">0</div><div class="lbl">自动处理</div></div>
</div>

<div class="main">
  <div class="inbox">
    <div class="phead"><span>收件箱</span><span style="font-weight:400;color:var(--text2);font-size:12px" id="inbox-count"></span></div>
    <div class="list" id="inbox"></div>
  </div>
  <div class="preview">
    <div class="phead"><span>邮件详情</span></div>
    <div class="scroll" id="preview">
      <div class="empty-state" id="empty-state">
        <div class="icon">📧</div>
        <div>选择一封邮件查看</div>
      </div>
      <div id="detail-content" style="display:none">
        <div class="msg-meta" id="d-meta"></div>
        <div class="msg-body" id="d-body"></div>
        <div class="attach-box" id="d-attach">
          <span class="icon">📎</span>
          <span id="d-attach-name">简历.pdf</span>
        </div>
        <div class="virtue" id="d-verdict"></div>
        <div class="action-bar">
          <button class="btn btn-primary" id="btn-pass" onclick="mark(selectedId,'pass')">✅ 通过</button>
          <button class="btn btn-danger" id="btn-reject" onclick="mark(selectedId,'reject')">🗑 拒绝</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const EMAILS = [
  {id:1, from:'zhangming@gmail.com', name:'张明', subject:'应聘前端开发——简历', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:2, from:'lihua@163.com', name:'李华', subject:'简历-后端开发-3年', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:3, from:'wangfang@qq.com', name:'王芳', subject:'关于产品经理岗位的申请', body:'HR 你好，\n\n看到贵公司在招聘产品经理，我有 5 年电商产品经验，曾负责过 3 个从 0 到 1 的项目。简历在附件中，希望能获得面试机会。\n\n谢谢', hasCover:true, hasBody:true, hasResume:true, extra:'附简短自荐', tags:['有正文'], detected:'has'},
  {id:4, from:'zhaolei@sina.com', name:'赵雷', subject:'求职', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:5, from:'chenjing@outlook.com', name:'陈静', subject:'数据分析师应聘', body:'附件是我的简历，请查阅。', hasCover:false, hasBody:true, hasResume:true, extra:'一句话正文', tags:['有正文'], detected:'has'},
  {id:6, from:'liuyang@gmail.com', name:'刘洋', subject:'无标题', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件','无标题'], detected:'only'},
  {id:7, from:'sunli@foxmail.com', name:'孙丽', subject:'UI 设计师简历', body:'您好，\n\n关注贵公司很久了，对 UI 设计师的职位非常感兴趣。我之前在两家互联网公司做过设计，擅长 B 端产品。简历和作品集在附件中。\n\n期待回复', hasCover:true, hasBody:true, hasResume:true, extra:'附作品集', tags:['有正文','附作品集'], detected:'has'},
  {id:8, from:'zhoutao@126.com', name:'周涛', subject:'产品经理求职——行业研究背景', body:'HR 团队好，\n\n我过去 3 年在咨询公司做行业研究，转型产品经理是我的职业规划。附件是简历，正文简单说一下想法。\n\n周涛', hasCover:true, hasBody:true, hasResume:true, extra:'转型动机清晰', tags:['有正文'], detected:'has'},
  {id:9, from:'wujie@qq.com', name:'吴杰', subject:'简历-前端', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:10, from:'zhengxin@gmail.com', name:'郑鑫', subject:'Java 开发求职', body:'HR 你好，附件是简历。', hasCover:false, hasBody:true, hasResume:true, extra:'简短正文', tags:['有正文'], detected:'has'},
  {id:11, from:'huanglei@163.com', name:'黄磊', subject:'关于市场推广岗位', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:12, from:'xuting@outlook.com', name:'徐婷', subject:'运营岗位求职信', body:'HR 你好，\n\n我是一名有 4 年用户运营经验的从业者，擅长社群运营和用户增长。看了岗位描述觉得非常匹配，附件中是简历和过往案例。\n\n期待进一步沟通', hasCover:true, hasBody:true, hasResume:true, extra:'附案例', tags:['有正文','附案例'], detected:'has'},
  {id:13, from:'fanqiang@qq.com', name:'樊强', subject:'简历', body:'', hasCover:false, hasBody:false, hasResume:true, extra:'', tags:['仅附件'], detected:'only'},
  {id:14, from:'linmei@gmail.com', name:'林梅', subject:'应聘', body:'附件', hasCover:false, hasBody:false, hasResume:true, extra:'正文仅"附件"二字', tags:['仅附件','无意义正文'], detected:'only'},
  {id:15, from:'caojun@163.com', name:'曹军', subject:'简历-产品经理-5年', body:'招聘经理，\n\n附件是我的简历。简单说一下自己的情况：过去 5 年一直在做 SaaS 产品，主导过 2 款产品的从 0 到 1。对贵公司的方向很认同，希望能聊聊。\n\n曹军', hasCover:true, hasBody:true, hasResume:true, extra:'详细自荐', tags:['有正文','详细自荐'], detected:'has'}
];

let emails = [];
let selectedId = null;
let history = [];

function detect(em) {
  if (em.hasCover || (em.hasBody && em.body.length > 20)) return 'has';
  if (em.hasBody && em.body.length <= 20) return 'only';
  return 'only';
}

function initData() {
  emails = EMAILS.map(e => ({
    ...e,
    detected: detect(e),
    status: detect(e) === 'only' ? 'rejected' : 'pending'
  }));
}

function getDetectLabel(d) {
  return {has:'有正文', only:'仅简历'}[d];
}
function getDetectBadge(d) {
  return {has:'badge has', only:'badge only'}[d];
}
function getStatusLabel(s) {
  return {pending:'待处理', rejected:'已拒绝', passed:'已通过'}[s];
}

function renderInbox() {
  const el = document.getElementById('inbox');
  el.innerHTML = emails.map(e => {
    const sel = e.id === selectedId ? 'sel' : '';
    const fl = e.detected === 'only' ? '📄' : '📝';
    return `<div class="email ${sel}" onclick="select(${e.id})">
      <div class="top"><span class="name">${e.name}</span><span class="fold">${fl}</span></div>
      <div class="subject">${e.subject}</div>
      <div class="detect">
        <span class="${getDetectBadge(e.detected)}">${getDetectLabel(e.detected)}</span>
        ${e.tags.map(t => `<span class="badge attach">${t}</span>`).join('')}
        <span style="font-size:12px;color:var(--text2);margin-left:4px">${getStatusLabel(e.status)}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('inbox-count').textContent = emails.length + ' 封';
}

function renderStats() {
  const t = emails.length;
  const o = emails.filter(e => e.detected === 'only').length;
  const h = emails.filter(e => e.detected === 'has').length;
  const a = emails.filter(e => e.status !== 'pending').length;
  document.getElementById('s-total').textContent = t;
  document.getElementById('s-only').textContent = o;
  document.getElementById('s-has').textContent = h;
  document.getElementById('s-auto').textContent = a;
}

function renderDetail() {
  const empty = document.getElementById('empty-state');
  const dc = document.getElementById('detail-content');
  const e = emails.find(x => x.id === selectedId);
  if (!e) { empty.style.display = 'flex'; dc.style.display = 'none'; return; }
  empty.style.display = 'none'; dc.style.display = 'block';

  document.getElementById('d-meta').innerHTML =
    `<div><span class="tag">发件人：</span>${e.name} &lt;${e.from}&gt;</div>` +
    `<div><span class="tag">主题：</span>${e.subject}</div>`;

  const bodyEl = document.getElementById('d-body');
  if (e.body && e.body.length > 0) {
    bodyEl.textContent = e.body;
    bodyEl.className = 'msg-body';
  } else {
    bodyEl.textContent = '（无正文内容）';
    bodyEl.className = 'msg-body empty';
  }

  document.getElementById('d-attach-name').textContent = e.extra ? '简历.pdf + ' + e.extra : '简历.pdf';

  const v = document.getElementById('d-verdict');
  if (e.detected === 'only') {
    v.className = 'virtue reject';
    v.innerHTML = '<strong>🗑 自动拒绝</strong><span>仅含简历附件，无正文/自荐内容。不符合筛选条件。</span>';
  } else {
    v.className = 'virtue pass';
    v.innerHTML = '<strong>✅ 自动通过</strong><span>邮件包含正文或自荐信，进入人工流程。</span>';
  }

  document.getElementById('btn-pass').disabled = e.status === 'passed' || e.status === 'rejected';
  document.getElementById('btn-reject').disabled = e.status === 'rejected' || e.status === 'passed';
}

function render() {
  renderInbox();
  renderStats();
  renderDetail();
}

function select(id) {
  selectedId = id;
  render();
}

function mark(id, action) {
  const e = emails.find(x => x.id === id);
  if (!e) return;
  e.status = action === 'pass' ? 'passed' : 'rejected';
  if (action === 'reject') history.push({id, name:e.name, result:'拒绝'});
  else history.push({id, name:e.name, result:'通过'});
  render();
}

function init() {
  initData();
  selectedId = 1;
  render();
}
init();
</script>
</body>
</html>
