# 小说故事模型 — 从职场言情小说中抽取完整故事要素
# 实验 3.1: CLI 抽取 → 故事图谱
#
# 用法: qtadmin knowl extract --type worldbuilding \
#   --input fiction.yaml --model ontology.yaml --output out/

story:
  description: 故事 — 虚构叙事的完整合一分析，含表层要素与深层模式
  fields:
    - name: characters
      type: array
      description: 人物 — 角色的身份、性格、动机与关系
      items:
        type: object
        fields:
          - name: name
            type: string
            description: 角色名
          - name: role
            type: string
            description: 角色身份/头衔
          - name: personality
            type: string
            description: 性格特征
          - name: motivation
            type: string
            description: 核心动机
          - name: arc
            type: string
            description: 角色弧光方向

    - name: relationship
      type: array
      description: 人物关系 — 角色之间的动态与张力
      items:
        type: object
        fields:
          - name: between
            type: array
            items: string
            description: 关系双方
          - name: type
            type: string
            description: 关系类型（恋人/朋友/同事/对手）
          - name: dynamic
            type: string
            description: 关系动态描述
          - name: tension
            type: string | null
            description: 关系中的张力或未解心结

    - name: setting
      type: array
      description: 场景设定 — 故事发生的空间与环境
      items:
        type: object
        fields:
          - name: location
            type: string
            description: 地点
          - name: atmosphere
            type: string
            description: 氛围
          - name: significance
            type: string
            description: 对角色或情节的意义

    - name: emotional_geography
      type: array
      description: 情感地理 — 情感在空间中的投射，特定场景与记忆的绑定
      items:
        type: object
        fields:
          - name: place
            type: string
            description: 地点
          - name: memory
            type: string
            description: 关联的记忆
          - name: emotion
            type: string
            description: 承载的情感

    - name: timeline
      type: array
      description: 时间线 — 叙事的过去、现在与未来线索
      items:
        type: object
        fields:
          - name: period
            type: string
            description: 时间阶段
          - name: event
            type: string
            description: 关键事件
          - name: impact
            type: string
            description: 对角色/关系的影响

    - name: themes
      type: array
      description: 主题 — 作品的核心意涵与情感母题
      items:
        type: object
        fields:
          - name: theme
            type: string
            description: 主题名称
          - name: manifestation
            type: string
            description: 在文本中的具体体现

    - name: tensions
      type: array
      description: 核心张力 — 推动叙事的情感矛盾
      items:
        type: object
        fields:
          - name: axis
            type: string
            description: 张力轴
          - name: description
            type: string
            description: 张力描述
          - name: resolution
            type: string | null
            description: 现阶段解决程度

    - name: motifs
      type: array
      description: 母题 — 叙事中重复出现的模式
      items:
        type: object
        fields:
          - name: name
            type: string
            description: 母题名称
          - name: type
            type: enum
            values: [theme, image, plot, character]
            description: 母题类型
          - name: sub_type
            type: string
            description: 子类型标签
          - name: description
            type: string
            description: 母题描述
          - name: excerpt
            type: string
            description: 原文片段

    - name: style
      type: object
      description: 风格 — 文本的整体叙事风格特征
      fields:
        - name: name
          type: string
          description: 风格名称
        - name: tags
          type: array
          items: string
          description: 风格标签
