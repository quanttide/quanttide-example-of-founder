<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>前传未关闭线索</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f8f9fa;padding:40px}
h1{text-align:center;color:#333;font-size:22px}
.subtitle{text-align:center;color:#888;font-size:13px;margin:4px 0 24px}
.nav{display:flex;justify-content:center;gap:6px;margin-bottom:24px}
.nav a{padding:6px 14px;border-radius:6px;font-size:13px;text-decoration:none;color:#888;background:#eee}
.nav a.active{background:#333;color:#fff}
.chart-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 8px rgba(0,0,0,0.06);padding:24px;max-width:900px;margin:0 auto}
svg{display:block;margin:0 auto}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#666;margin-top:16px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.tooltip{position:absolute;background:rgba(0,0,0,0.85);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;z-index:100}
</style>
</head>
<body>
<h1>前传未关闭线索</h1>
<p class="subtitle">每个前传的信息是否已在故事中被双方知晓</p>
<div class="nav">
  <a href="axes.html">主题轴</a>
  <a href="techniques.html">手法</a>
  <a href="carriers.html">情感载体</a>
  <a href="prequels.html">前传</a>
  <a href="senses.html">感官</a>
  <a href="threads.html" class="active">线索</a>
</div>
<div class="chart-wrap"><div id="chart"></div><div class="legend" id="legend"></div></div>
<div class="tooltip" id="tooltip"></div>

<script>
const prequels=[
  {id:"P1",n:"毕业晚会",own:"他",desc:"他在台下看她的古典舞演出",seenBy:"她",revealed:false,scenes:"1_2, 6_2",status:"他独自知道"},
  {id:"P2",n:"公开演讲",own:"她",desc:"她在台下听他的创业演讲",seenBy:"他",revealed:false,scenes:"4_1",status:"她独自知道"},
  {id:"P3",n:"大四聚餐",own:"双方",desc:"两桌人在同一家餐厅",seenBy:"",revealed:true,scenes:"5_1",status:"双方都知道"},
  {id:"P4",n:"海边深夜",own:"她",desc:"她在身后看他写信",seenBy:"他",revealed:true,scenes:"1_1暗示, 6_2她说, 8_1他回应",status:"已完全揭示"},
  {id:"P5",n:"醉酒坦白",own:"他",desc:"对朋友说'喜欢她十年'",seenBy:"她",revealed:true,scenes:"1_1日记, 7_1当面说, 10_1信",status:"已完全揭示"},
  {id:"P6",n:"朋友圈十年",own:"双方",desc:"他在屏幕后看她，她在屏幕后看他",seenBy:"",revealed:true,scenes:"1_1, 4_2",status:"底色·不需要关闭"},
  {id:"P7",n:"读他的代码",own:"她",desc:"她看过他写的代码",seenBy:"他",revealed:false,scenes:"2_1",status:"她独自知道"},
];

const W=800,H=400,M={t:40,l:130,r:40,b:20};
const IW=W-M.l-M.r,IH=H-M.t-M.b;
const rowH=IH/prequels.length;
const svg=d3.select("#chart").append("svg").attr("width",W).attr("height",H);
const tip=d3.select("#tooltip");

// Column headers
const colHeaders=["状态","知道方→未知方","引用场景"];
const colX=[0,0.35,0.55].map(p=>M.l+p*IW);
svg.append("text").attr("x",colX[0]).attr("y",M.t-6).attr("font-size",10).attr("fill","#888").text("状态");
svg.append("text").attr("x",colX[1]).attr("y",M.t-6).attr("font-size",10).attr("fill","#888").text("知道方 → 未知方");
svg.append("text").attr("x",colX[2]).attr("y",M.t-6).attr("font-size",10).attr("fill","#888").text("引用场景");

// Separator line
svg.append("line").attr("x1",M.l).attr("y1",M.t-2).attr("x2",M.l+IW).attr("y2",M.t-2)
  .attr("stroke","#eee").attr("stroke-width",1);

prequels.forEach((p,pi)=>{
  const y=M.t+4+pi*rowH;

  // Left colored bar
  const barColor=p.revealed?(p.status.includes("底色")?"#74B9FF":"#55E6C1"):"#E17055";
  svg.append("rect").attr("x",M.l-6).attr("y",y+4).attr("width",4).attr("height",rowH-10)
    .attr("fill",barColor).attr("rx",2).attr("opacity",0.7);

  // Prequel ID + name
  svg.append("text").attr("x",M.l-12).attr("y",y+rowH/2+4).attr("text-anchor","end")
    .attr("font-size",12).attr("fill","#333").attr("font-weight","bold").text(`${p.id} ${p.n}`);

  // Description row
  svg.append("text").attr("x",M.l-12).attr("y",y+rowH/2+18).attr("text-anchor","end")
    .attr("font-size",9).attr("fill","#999").text(p.desc);

  // Status badge
  const badgeX=colX[0];
  const badgeColor=p.revealed?"#55E6C1":"#E17055";
  const badgeText=p.revealed?(p.status.includes("底色")?"底色":"已揭示"):"未关闭";
  svg.append("rect").attr("x",badgeX).attr("y",y+rowH/2-8).attr("width",36).attr("height",18)
    .attr("fill",badgeColor).attr("opacity",0.15).attr("rx",9);
  svg.append("text").attr("x",badgeX+18).attr("y",y+rowH/2+4).attr("text-anchor","middle")
    .attr("font-size",10).attr("fill",badgeColor).attr("font-weight","bold").text(badgeText);

  // Knowledge flow: known by → unknown by
  const kx=colX[1];
  if(p.own){
    svg.append("text").attr("x",kx).attr("y",y+rowH/2+4).attr("font-size",11)
      .attr("fill","#555").text(`${p.own} 知道`);
  }
  if(p.seenBy && !p.revealed){
    svg.append("text").attr("x",kx+50).attr("y",y+rowH/2+4).attr("font-size",11)
      .attr("fill","#E17055").text(`→ ${p.seenBy} 不知道`);
    // Arrow
    svg.append("text").attr("x",kx+42).attr("y",y+rowH/2+4).attr("font-size",11)
      .attr("fill","#ccc").text("→");
  } else if(p.revealed && p.seenBy){
    svg.append("text").attr("x",kx+50).attr("y",y+rowH/2+4).attr("font-size",11)
      .attr("fill","#55E6C1").text(`→ ${p.seenBy} 知道了 ✓`);
    svg.append("text").attr("x",kx+42).attr("y",y+rowH/2+4).attr("font-size",11)
      .attr("fill","#ccc").text("→");
  }

  // Scenes
  const sx=colX[2];
  svg.append("text").attr("x",sx).attr("y",y+rowH/2+4).attr("font-size",10)
    .attr("fill","#888").text(p.scenes);

  // Hover
  const statusColor=p.revealed?"#55E6C1":"#E17055";
  const statusLabel=p.revealed?"已揭示":"未关闭";
  svg.append("rect").attr("x",M.l-16).attr("y",y).attr("width",IW+12).attr("height",rowH)
    .attr("fill","transparent")
    .on("mouseenter",function(){
      tip.style("opacity",1)
        .html(`<b>${p.id} ${p.n}</b><br>${p.desc}<br>状态: <span style="color:${statusColor}">${statusLabel}</span><br>知道方: ${p.own}${p.revealed && p.seenBy ? "<br>已告知: "+p.seenBy : ""}`)
        .style("left",(d3.event.pageX+12)+"px").style("top",(d3.event.pageY-10)+"px");
    })
    .on("mouseleave",()=>tip.style("opacity",0));
});

d3.select("#legend").html(`
  <span class="legend-item"><span class="legend-dot" style="background:#E17055"></span> 未关闭（一方知道，另一方不知道）</span>
  <span class="legend-item"><span class="legend-dot" style="background:#55E6C1"></span> 已揭示（双方都知道）</span>
  <span class="legend-item"><span class="legend-dot" style="background:#74B9FF"></span> 底色型（不需要关闭）</span>
`);
</script>
</body>
</html>
