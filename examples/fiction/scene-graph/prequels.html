<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>前传纠缠深度</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, "Microsoft YaHei", sans-serif;
                background: #f8f9fa;
                padding: 40px;
            }
            h1 {
                text-align: center;
                color: #333;
                font-size: 22px;
            }
            .subtitle {
                text-align: center;
                color: #888;
                font-size: 13px;
                margin: 4px 0 24px;
            }
            .nav {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-bottom: 24px;
            }
            .nav a {
                padding: 6px 14px;
                border-radius: 6px;
                font-size: 13px;
                text-decoration: none;
                color: #888;
                background: #eee;
            }
            .nav a.active {
                background: #333;
                color: #fff;
            }
            .chart-wrap {
                background: #fff;
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
                padding: 24px;
                max-width: 1060px;
                margin: 0 auto;
            }
            svg {
                display: block;
                margin: 0 auto;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 12px;
                color: #666;
                margin-top: 16px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .legend-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }
            .tooltip {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                opacity: 0;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <h1>前传纠缠深度</h1>
        <p class="subtitle">每个前传连接哪些现在场景、纠缠深度</p>
        <div class="nav">
            <a href="axes.html">主题轴</a>
            <a href="techniques.html">手法</a>
            <a href="carriers.html">情感载体</a>
            <a href="prequels.html" class="active">前传</a>
        </div>
        <div class="chart-wrap">
            <div id="chart"></div>
            <div class="legend" id="legend"></div>
        </div>
        <div class="tooltip" id="tooltip"></div>

        <script>
            const depthColors = {
                独白式: "#A29BFE",
                延迟揭示: "#FDCB6E",
                回响式: "#E17055",
                背景式: "#74B9FF",
            };
            const depthLabels = {
                独白式: "单次引用",
                延迟揭示: "多次揭示",
                回响式: "反复回响",
                背景式: "持续底色",
            };
            const prequels = [
                { id: "P1", n: "毕业晚会", d: "独白式", t: [1, 8] },
                { id: "P2", n: "公开演讲", d: "独白式", t: [4] },
                { id: "P3", n: "大四聚餐", d: "独白式", t: [7] },
                { id: "P4", n: "海边深夜", d: "延迟揭示", t: [0, 8, 11] },
                { id: "P5", n: "醉酒坦白", d: "回响式", t: [0, 9, 12] },
                { id: "P6", n: "朋友圈十年", d: "背景式", t: [0, 5] },
                { id: "P7", n: "读他的代码", d: "独白式", t: [2] },
            ];
            const sceneIds = [
                "1_1",
                "1_2",
                "2_1",
                "2_3",
                "4_1",
                "4_2",
                "4_3",
                "5_1",
                "6_2",
                "7_1",
                "7_2",
                "8_1",
                "10_1",
                "10_2",
                "10_3",
            ];
            const sceneNames = [
                "咖啡厅重逢",
                "深夜失眠",
                "展会再遇",
                "傍晚小龙虾",
                "便利店谈心",
                "夜市约会",
                "互相问早",
                "家里吃火锅",
                "海边散步",
                "酒吧表白",
                "公园拥抱",
                "海边再散步",
                "书房陪伴",
                "客厅看剧",
                "阳台看星星",
            ];

            const W = 1000,
                H = 340,
                M = { t: 30, l: 160, r: 30, b: 20 };
            const IW = W - M.l - M.r;
            const sx = sceneIds.map(
                (_, i) => M.l + (i / (sceneIds.length - 1)) * IW,
            );

            const svg = d3
                .select("#chart")
                .append("svg")
                .attr("width", W)
                .attr("height", H);
            const tip = d3.select("#tooltip");

            sceneIds.forEach((id, i) => {
                const x = sx[i];
                svg.append("line")
                    .attr("x1", x)
                    .attr("y1", M.t - 2)
                    .attr("x2", x)
                    .attr("y2", M.t + prequels.length * 40 + 8)
                    .attr("stroke", "#f0f0f0")
                    .attr("stroke-width", 0.5);
                svg.append("text")
                    .attr("x", x)
                    .attr("y", M.t - 6)
                    .attr("text-anchor", "middle")
                    .attr("font-size", 9)
                    .attr("fill", "#999")
                    .text(id);
            });

            prequels.forEach((p, pi) => {
                const y = M.t + 14 + pi * 40,
                    c = depthColors[p.d];
                svg.append("rect")
                    .attr("x", M.l - 12)
                    .attr("y", y - 8)
                    .attr("width", 4)
                    .attr("height", 20)
                    .attr("fill", c)
                    .attr("rx", 2);
                svg.append("text")
                    .attr("x", M.l - 18)
                    .attr("y", y + 4)
                    .attr("text-anchor", "end")
                    .attr("font-size", 12)
                    .attr("fill", "#333")
                    .attr("font-weight", "bold")
                    .text(`${p.id} ${p.n}`);
                svg.append("text")
                    .attr("x", M.l - 18)
                    .attr("y", y + 18)
                    .attr("text-anchor", "end")
                    .attr("font-size", 9)
                    .attr("fill", "#aaa")
                    .text(depthLabels[p.d]);
                p.t.forEach((ti) => {
                    const x = sx[ti];
                    svg.append("line")
                        .attr("x1", M.l - 8)
                        .attr("y1", y)
                        .attr("x2", x)
                        .attr("y2", y)
                        .attr("stroke", c)
                        .attr("stroke-width", 1.5)
                        .attr("stroke-dasharray", "4,3")
                        .attr("opacity", 0.4);
                    svg.append("circle")
                        .attr("cx", x)
                        .attr("cy", y)
                        .attr("r", 4)
                        .attr("fill", c)
                        .attr("opacity", 0.6);
                });
                const ft = p.t[0];
                if (ft !== undefined)
                    svg.append("text")
                        .attr("x", sx[ft] + 8)
                        .attr("y", y + 4)
                        .attr("font-size", 10)
                        .attr("fill", c)
                        .text(sceneNames[ft]);
                svg.append("rect")
                    .attr("x", M.l - 20)
                    .attr("y", y - 10)
                    .attr("width", IW + 10)
                    .attr("height", 24)
                    .attr("fill", "transparent")
                    .on("mouseenter", () => {
                        const ts = p.t.map((t) => sceneIds[t]).join(", ");
                        tip.style("opacity", 1)
                            .html(
                                `<b>${p.id} ${p.n}</b><br>${depthLabels[p.d]}<br>出现在：${ts}`,
                            )
                            .style("left", d3.event.pageX + 12 + "px")
                            .style("top", d3.event.pageY - 10 + "px");
                    })
                    .on("mouseleave", () => tip.style("opacity", 0));
            });

            d3.select("#legend").html(
                Object.entries(depthLabels)
                    .map(
                        ([k, v]) =>
                            `<span class="legend-item"><span class="legend-dot" style="background:${depthColors[k]}"></span>${k}（${v}）</span>`,
                    )
                    .join(""),
            );
        </script>
    </body>
</html>
