<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职能拆分解耦 · PoC 03</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px;line-height:1.5}
#app{max-width:1200px;margin:0 auto;padding:16px 20px}
header{border-bottom:2px solid #3b82f6;padding-bottom:12px;margin-bottom:20px}
header h1{font-size:22px;font-weight:700;color:#0f172a}
header small{font-size:13px;color:#64748b;margin-left:8px}
section{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px 20px;margin-bottom:16px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-header h2{font-size:16px;font-weight:600;color:#0f172a}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;color:#475569;font-weight:600;position:sticky;top:0}
tr:hover{background:#f8fafc}
tr.selected{background:#eff6ff}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff}
.badge-course{background:#3b82f6}
.badge-consulting{background:#10b981}
.badge-product{background:#8b5cf6}
.badge-operation{background:#f59e0b}
.dep-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:#e2e8f0;color:#475569;margin:0 2px}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:#64748b;padding:4px 8px}
.btn-ghost:hover{background:#f1f5f9}
.btn-sm{font-size:12px;padding:4px 10px}
.btn-outline{background:transparent;border:1px solid #e2e8f0;color:#475569}
.btn-outline:hover{background:#f8fafc}
.form-row{display:flex;gap:16px;margin-bottom:12px}
.form-row .form-group{flex:1}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.form-group textarea{resize:vertical;min-height:48px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.checkbox-group label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;cursor:pointer}
.form-actions{display:flex;gap:8px;padding-top:4px}
.editor-empty{color:#94a3b8;font-size:13px;padding:8px 0}
.section-columns{display:flex;gap:20px}
.column-graph{flex:1.4;min-width:0}
.column-panels{flex:1;min-width:280px;max-width:380px}
#graph-wrap{position:relative;background:#fafbfc;border:1px solid #e2e8f0;border-radius:8px;overflow:auto;min-height:380px}
#graph-nodes{position:relative;min-height:380px}
.graph-node{position:absolute;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;border:2px solid;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:2;transition:transform .15s,box-shadow .15s,opacity .3s}
.graph-node:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.graph-node-id{font-size:10px;font-weight:700;opacity:.6;margin-bottom:2px}
.graph-node-name{font-weight:600;font-size:12px;text-align:center;padding:0 4px;line-height:1.3}
.graph-node.type-course{border-color:#3b82f6;color:#1e40af}
.graph-node.type-consulting{border-color:#10b981;color:#065f46}
.graph-node.type-product{border-color:#8b5cf6;color:#5b21b6}
.graph-node.type-operation{border-color:#f59e0b;color:#92400e}
.graph-node.highlighted{border-color:#f59e0b!important;box-shadow:0 0 0 3px rgba(245,158,11,.3),0 3px 8px rgba(0,0,0,.15)!important;z-index:3}
.graph-node.dimmed{opacity:.25}
#graph-edges{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:12px}
.tab-btn{padding:8px 14px;border:none;background:none;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;position:relative;transition:color .15s}
.tab-btn:hover{color:#334155}
.tab-btn.active{color:#3b82f6}
.tab-btn.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:#3b82f6}
.tab-pane{display:none;font-size:13px}
.tab-pane.active{display:block}
.flow-card{padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.flow-card:hover{border-color:#3b82f6;background:#f8faff}
.flow-card.active{border-color:#f59e0b;background:#fffbeb}
.flow-card-title{font-weight:600;margin-bottom:4px}
.flow-card-desc{color:#64748b;font-size:12px}
.flow-card .badge{margin:0 1px;font-size:10px;padding:1px 5px}
.analysis-result{list-style:none}
.analysis-result li{padding:6px 0;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:6px;font-size:13px}
.analysis-result .icon{font-size:14px}
.icon-pass{color:#10b981}
.icon-fail{color:#ef4444}
.icon-warn{color:#f59e0b}
.result-pass{color:#10b981}
.result-fail{color:#ef4444}
.ortho-table{width:100%;font-size:12px;border-collapse:collapse}
.ortho-table th,.ortho-table td{padding:5px 6px;text-align:center;border:1px solid #f1f5f9;font-size:11px}
.ortho-table th{background:#f8fafc;font-weight:600;color:#475569}
.ortho-table .cell-pass{color:#10b981;font-weight:600}
.ortho-table .cell-fail{color:#ef4444;font-weight:600}
.error-msg{color:#ef4444;font-size:12px;padding:4px 0}
.empty-state{color:#94a3b8;font-size:13px;padding:20px 0;text-align:center}
@media(max-width:860px){.section-columns{flex-direction:column}.column-panels{max-width:none}.form-row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>职能拆分解耦 <small>PoC 03</small></h1>
  </header>

  <!-- Section 1: Function List -->
  <section id="section-list">
    <div class="section-header">
      <h2>职能列表</h2>
      <button class="btn btn-primary" id="btn-add">+ 新增职能</button>
    </div>
    <div style="overflow-x:auto">
      <table id="func-table">
        <thead>
          <tr><th>ID</th><th>名称</th><th>类型</th><th>输入</th><th>输出</th><th>前置依赖</th><th>操作</th></tr>
        </thead>
        <tbody id="func-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Section 2: Function Editor -->
  <section id="section-editor" style="display:none">
    <div class="section-header">
      <h2 id="editor-title">新增职能</h2>
    </div>
    <form id="editor-form">
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label>职能名称</label>
          <input type="text" id="edit-name" placeholder="例: 课程研发">
        </div>
        <div class="form-group">
          <label>职能类型</label>
          <select id="edit-type">
            <option value="course">课程 (course)</option>
            <option value="consulting">咨询 (consulting)</option>
            <option value="product">产品 (product)</option>
            <option value="operation">运营 (operation)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>输入（多个用逗号分隔）</label>
          <textarea id="edit-input" rows="2" placeholder="课程大纲, 客户需求, ..."></textarea>
        </div>
        <div class="form-group">
          <label>输出（多个用逗号分隔）</label>
          <textarea id="edit-output" rows="2" placeholder="课件/教材, 习题, ..."></textarea>
        </div>
      </div>
      <div class="form-group">
        <label>前置依赖</label>
        <div id="edit-deps" class="checkbox-group"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="btn-save">保存</button>
        <button type="button" class="btn btn-outline" id="btn-cancel">取消</button>
      </div>
    </form>
  </section>

  <!-- Section 3: DAG + Analysis -->
  <section id="section-analysis">
    <div class="section-columns">
      <div class="column-graph">
        <div class="section-header" style="margin-bottom:8px">
          <h2>依赖图（DAG）</h2>
        </div>
        <div id="graph-wrap">
          <div id="graph-nodes"></div>
          <svg id="graph-edges"></svg>
        </div>
      </div>
      <div class="column-panels">
        <div class="section-header" style="margin-bottom:0">
          <h2>分析面板</h2>
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="flows">组合规则</button>
          <button class="tab-btn" data-tab="deps">依赖分析</button>
          <button class="tab-btn" data-tab="ortho">正交性检查</button>
        </div>
        <div id="tab-flows" class="tab-pane active"></div>
        <div id="tab-deps" class="tab-pane"></div>
        <div id="tab-ortho" class="tab-pane"></div>
      </div>
    </div>
  </section>
</div>

<script>
const TYPE_COLORS = {course:'#3b82f6',consulting:'#10b981',product:'#8b5cf6',operation:'#f59e0b'};
const TYPE_LABELS = {course:'课程',consulting:'咨询',product:'产品',operation:'运营'};

const DEFAULT_FUNCTIONS = [
  {id:'F01',name:'课程研发',type:'course',input:'课程大纲',output:'课件/教材/习题',deps:[]},
  {id:'F02',name:'咨询服务',type:'consulting',input:'客户需求',output:'咨询方案/报告',deps:[]},
  {id:'F03',name:'产品开发',type:'product',input:'产品需求',output:'MVP/文档',deps:['F05']},
  {id:'F04',name:'市场推广',type:'operation',input:'产品/课程',output:'获客线索',deps:['F01','F02','F03']},
  {id:'F05',name:'技术支持',type:'operation',input:'技术需求',output:'平台/工具',deps:[]}
];

const DEFAULT_FLOWS = [
  {id:'flow1',name:'企业培训方案',funcs:['F01','F04']},
  {id:'flow2',name:'数字化转型咨询',funcs:['F02','F05']},
  {id:'flow3',name:'SaaS产品交付',funcs:['F03','F05','F04']}
];

let state = {
  functions: JSON.parse(JSON.stringify(DEFAULT_FUNCTIONS)),
  flows: JSON.parse(JSON.stringify(DEFAULT_FLOWS)),
  editingId: null,
  selectedFlow: null
};

function genId() {
  let max = 0;
  state.functions.forEach(f => { const n = parseInt(f.id.slice(1),10); if (n>max) max=n; });
  return 'F'+String(max+1).padStart(2,'0');
}

function getFunc(id) { return state.functions.find(f=>f.id===id); }

function splitItems(text) {
  return text.split(/[,，、\/\n]+/).map(s=>s.trim()).filter(Boolean);
}

function renderFunctionList() {
  const tbody = document.getElementById('func-tbody');
  if (!state.functions.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无职能定义，点击"新增职能"开始</td></tr>';
    return;
  }
  tbody.innerHTML = state.functions.map(f => {
    const depsHtml = f.deps.length ? f.deps.map(d => `<span class="dep-tag">${d}</span>`).join('') : '<span style="color:#94a3b8;font-size:12px">—</span>';
    return `<tr data-id="${f.id}" class="${state.editingId===f.id?'selected':''}">
      <td><strong>${f.id}</strong></td>
      <td>${f.name}</td>
      <td><span class="badge badge-${f.type}">${TYPE_LABELS[f.type]||f.type}</span></td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.input}">${f.input||'—'}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.output}">${f.output||'—'}</td>
      <td>${depsHtml}</td>
      <td>
        <button class="btn btn-ghost btn-sm btn-edit" data-id="${f.id}">编辑</button>
        <button class="btn btn-ghost btn-sm btn-delete" data-id="${f.id}" style="color:#ef4444">删除</button>
      </td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.btn-edit').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); startEdit(el.dataset.id); });
  });
  document.querySelectorAll('.btn-delete').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); deleteFunc(el.dataset.id); });
  });
  document.querySelectorAll('#func-tbody tr').forEach(el => {
    el.addEventListener('click', () => startEdit(el.dataset.id));
  });
}

function renderDepsCheckboxes(excludeId) {
  const container = document.getElementById('edit-deps');
  const current = state.functions.filter(f => f.id !== excludeId);
  if (!current.length) {
    container.innerHTML = '<span style="color:#94a3b8;font-size:12px">暂无可选依赖</span>';
    return;
  }
  const editing = state.editingId ? getFunc(state.editingId) : null;
  const checked = editing ? editing.deps : [];
  container.innerHTML = current.map(f => {
    const chk = checked.includes(f.id) ? 'checked' : '';
    return `<label><input type="checkbox" value="${f.id}" ${chk}> ${f.id} ${f.name}</label>`;
  }).join('');
}

function renderEditor() {
  const section = document.getElementById('section-editor');
  const title = document.getElementById('editor-title');
  const idField = document.getElementById('edit-id');
  const nameField = document.getElementById('edit-name');
  const typeField = document.getElementById('edit-type');
  const inputField = document.getElementById('edit-input');
  const outputField = document.getElementById('edit-output');

  if (!state.editingId) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  const editing = getFunc(state.editingId);
  if (editing) {
    title.textContent = '编辑职能 — ' + editing.id;
    idField.value = editing.id;
    nameField.value = editing.name;
    typeField.value = editing.type;
    inputField.value = editing.input;
    outputField.value = editing.output;
  } else {
    title.textContent = '新增职能';
    idField.value = '';
    nameField.value = '';
    typeField.value = 'course';
    inputField.value = '';
    outputField.value = '';
  }
  renderDepsCheckboxes(state.editingId);
}

function startEdit(id) {
  state.editingId = id;
  renderEditor();
  renderFunctionList();
}

function cancelEdit() {
  state.editingId = null;
  document.getElementById('section-editor').style.display = 'none';
  renderFunctionList();
}

function deleteFunc(id) {
  const f = getFunc(id);
  if (!f) return;
  const dependents = state.functions.filter(other => other.deps.includes(id));
  if (dependents.length) {
    const names = dependents.map(d => `${d.id}(${d.name})`).join('、');
    if (!confirm(`「${f.id} ${f.name}」被以下职能依赖：\n${names}\n\n确定删除吗？`)) return;
  } else {
    if (!confirm(`确定删除「${f.id} ${f.name}」吗？`)) return;
  }
  state.functions = state.functions.filter(fn => fn.id !== id);
  state.functions.forEach(fn => {
    fn.deps = fn.deps.filter(d => d !== id);
  });
  if (state.editingId === id) cancelEdit();
  else { renderFunctionList(); renderEditor(); renderGraphAndTabs(); }
}

function saveFunction() {
  const name = document.getElementById('edit-name').value.trim();
  const type = document.getElementById('edit-type').value;
  const input = document.getElementById('edit-input').value.trim();
  const output = document.getElementById('edit-output').value.trim();
  const deps = Array.from(document.querySelectorAll('#edit-deps input:checked')).map(el => el.value);

  if (!name) { alert('请输入职能名称'); return; }

  if (state.editingId && getFunc(state.editingId)) {
    const f = getFunc(state.editingId);
    f.name = name;
    f.type = type;
    f.input = input;
    f.output = output;
    f.deps = deps;
  } else {
    const id = genId();
    state.functions.push({id, name, type, input, output, deps});
  }
  state.editingId = null;
  document.getElementById('section-editor').style.display = 'none';
  renderAll();
}

function renderGraphAndTabs() {
  renderGraph();
  renderFlowsTab();
  renderDepsTab();
  renderOrthoTab();
}

function computeLayout(containerWidth) {
  const NODE_W = 130, NODE_H = 46, H_GAP = 40, V_GAP = 70, PAD = 24;
  const funcMap = {};
  state.functions.forEach(f => { funcMap[f.id] = f; });

  const depths = {};
  function getDepth(id, visited) {
    if (depths[id] !== undefined) return depths[id];
    if (visited.has(id)) { depths[id] = 0; return 0; }
    visited.add(id);
    const f = funcMap[id];
    if (!f || !f.deps || !f.deps.length) { depths[id] = 0; }
    else {
      let maxD = 0;
      f.deps.forEach(d => {
        if (funcMap[d]) maxD = Math.max(maxD, getDepth(d, new Set(visited))+1);
      });
      depths[id] = maxD;
    }
    return depths[id];
  }
  state.functions.forEach(f => getDepth(f.id, new Set()));

  const levels = {};
  let maxDepth = 0;
  Object.keys(depths).forEach(id => {
    const d = depths[id];
    if (!levels[d]) levels[d] = [];
    levels[d].push(id);
    if (d > maxDepth) maxDepth = d;
  });

  const layout = {};
  const cw = containerWidth || 800;
  for (let d = 0; d <= maxDepth; d++) {
    const ids = levels[d] || [];
    const totalW = ids.length * NODE_W + (ids.length - 1) * H_GAP;
    const startX = Math.max(PAD, (cw - totalW) / 2);
    ids.forEach((id, i) => {
      layout[id] = {
        x: startX + i * (NODE_W + H_GAP),
        y: PAD + d * (NODE_H + V_GAP),
        w: NODE_W, h: NODE_H
      };
    });
  }
  return { layout, maxDepth, NODE_W, NODE_H, H_GAP, V_GAP, PAD };
}

function renderGraph() {
  const wrap = document.getElementById('graph-wrap');
  const container = document.getElementById('graph-nodes');
  const svg = document.getElementById('graph-edges');

  if (!state.functions.length) {
    container.innerHTML = '<div class="empty-state" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">暂无职能，请先添加</div>';
    svg.innerHTML = '';
    return;
  }

  const cw = wrap.clientWidth || 800;
  const { layout, maxDepth, NODE_W, NODE_H, V_GAP, PAD } = computeLayout(cw);
  state._layout = layout;

  const hlFlow = state.selectedFlow ? state.flows.find(f => f.id === state.selectedFlow) : null;
  const hlSet = hlFlow ? new Set(hlFlow.funcs) : null;

  container.innerHTML = state.functions.map(f => {
    const pos = layout[f.id];
    if (!pos) return '';
    const hl = hlSet && hlSet.has(f.id);
    return `<div class="graph-node type-${f.type} ${hl?'highlighted':(hlSet?'dimmed':'')}" data-id="${f.id}" style="left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;height:${pos.h}px">
      <div class="graph-node-id">${f.id}</div>
      <div class="graph-node-name">${f.name}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('#graph-nodes .graph-node').forEach(el => {
    el.addEventListener('click', () => startEdit(el.dataset.id));
  });

  const totalH = PAD + (maxDepth + 1) * (NODE_H + V_GAP);
  container.style.minHeight = totalH + 'px';

  svg.setAttribute('viewBox', `0 0 ${cw} ${totalH}`);

  const edges = [];
  state.functions.forEach(f => {
    f.deps.forEach(dep => {
      const from = layout[dep], to = layout[f.id];
      if (from && to) {
        const highlighted = hlSet && hlSet.has(f.id) && hlSet.has(dep);
        edges.push({
          x1: from.x + from.w/2, y1: from.y + from.h,
          x2: to.x + to.w/2, y2: to.y,
          highlighted
        });
      }
    });
  });

  const defs = `<defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
    <marker id="ah-hl" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f59e0b"/></marker>
  </defs>`;

  svg.innerHTML = defs + edges.map(e => {
    const cls = e.highlighted ? 'edge-hl' : '';
    const marker = e.highlighted ? 'url(#ah-hl)' : 'url(#ah)';
    const color = e.highlighted ? '#f59e0b' : '#94a3b8';
    const width = e.highlighted ? 2.5 : 1.5;
    return `<line class="${cls}" x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${color}" stroke-width="${width}" marker-end="${marker}" opacity="${hlSet&&!e.highlighted?0.15:1}"/>`;
  }).join('');
}

function renderFlowsTab() {
  const tab = document.getElementById('tab-flows');

          return func ? `<span class="badge badge-${func.type}">${func.id}</span>` : `<span class="badge" style="background:#94a3b8">${id}</span>`;
        }).join(' ')}</div>

    }).join('') +

  document.querySelectorAll('#tab-flows .flow-card').forEach(el => {

      renderGraph();

    });

}

function detectCycles() {
  const WHITE = 0, GRAY = 1, BLACK = 2;
  const color = {}, parent = {};
  state.functions.forEach(f => { color[f.id] = WHITE; parent[f.id] = null; });

  const cycles = [];
  function dfs(u) {
    color[u] = GRAY;
    const f = getFunc(u);
    if (f) {
      for (const v of f.deps) {
        if (!getFunc(v) && !state._depWarn) continue;
        if (color[v] === GRAY) {
          const path = [v];
          let cur = u;
          while (cur !== v) { path.push(cur); cur = parent[cur]; }
          path.push(v);
          cycles.push(path.reverse());
          return true;
        }
        if (color[v] === WHITE) {
          parent[v] = u;
          if (dfs(v)) return true;
        }
      }
    }
    color[u] = BLACK;
    return false;
  }

  for (const f of state.functions) {
    if (color[f.id] === WHITE) { if (dfs(f.id)) break; }
  }
  return cycles;
}

function detectMissingDeps() {
  const missing = [];
  state.functions.forEach(f => {
    f.deps.forEach(d => {
      if (!getFunc(d)) missing.push({ func: f.id, dep: d });
    });
  });
  return missing;
}

function renderDepsTab() {
  const tab = document.getElementById('tab-deps');
  tab.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-outline btn-sm" id="btn-cycle">检测循环依赖</button>
      <button class="btn btn-outline btn-sm" id="btn-missing">检测缺失依赖</button>
    </div>
    <div id="deps-result"></div>
  `;

  document.getElementById('btn-cycle').addEventListener('click', () => {
    const cycles = detectCycles();
    const result = document.getElementById('deps-result');
    if (cycles.length) {
      let html = '<ul class="analysis-result">';
      cycles.forEach((cycle, idx) => {
        html += `<li><span class="icon icon-fail">&#x2716;</span> 循环依赖 #${idx+1}: ${cycle.join(' → ')}</li>`;
      });
      html += '</ul>';
      result.innerHTML = html;
    } else {
      result.innerHTML = '<ul class="analysis-result"><li><span class="icon icon-pass">&#x2714;</span> 未检测到循环依赖</li></ul>';
    }
  });

  document.getElementById('btn-missing').addEventListener('click', () => {
    const missing = detectMissingDeps();
    const result = document.getElementById('deps-result');
    if (missing.length) {
      let html = '<ul class="analysis-result">';
      missing.forEach(m => {
        html += `<li><span class="icon icon-fail">&#x2716;</span> ${m.func} 依赖的 ${m.dep} 不存在</li>`;
      });
      html += '</ul>';
      result.innerHTML = html;
    } else {
      result.innerHTML = '<ul class="analysis-result"><li><span class="icon icon-pass">&#x2714;</span> 所有依赖均存在</li></ul>';
    }
  });
}

function jaccard(a, b) {
  const union = new Set([...a, ...b]);
  if (!union.size) return 0;
  const inter = new Set([...a].filter(x => b.has(x)));
  return inter.size / union.size;
}

function checkOrthogonality() {
  const results = [];
  const funcs = state.functions;
  for (let i = 0; i < funcs.length; i++) {
    for (let j = i + 1; j < funcs.length; j++) {
      const a = funcs[i], b = funcs[j];
      const inA = new Set(splitItems(a.input));
      const inB = new Set(splitItems(b.input));
      const outA = new Set(splitItems(a.output));
      const outB = new Set(splitItems(b.output));

      const inputSim = jaccard(inA, inB);
      const inputPass = inputSim < 0.3;

      const outContainA = outA.size && [...outA].every(o => outB.has(o));
      const outContainB = outB.size && [...outB].every(o => outA.has(o));
      const outputPass = !outContainA && !outContainB;

      const kwA = new Set(splitItems(a.name + ' ' + a.input + ' ' + a.output));
      const kwB = new Set(splitItems(b.name + ' ' + b.input + ' ' + b.output));
      const kwSim = jaccard(kwA, kwB);
      const kwPass = kwSim < 0.5;

      results.push({
        a: a.id, b: b.id,
        inputSim, inputPass,
        outputPass,
        kwSim, kwPass,
        orthogonal: inputPass && outputPass && kwPass
      });
    }
  }
  return results;
}

function renderOrthoTab() {
  const tab = document.getElementById('tab-ortho');
  const results = checkOrthogonality();
  if (!results.length) {
    tab.innerHTML = '<div class="empty-state">至少需要两个职能才能进行正交性检查</div>';
    return;
  }
  const passCount = results.filter(r => r.orthogonal).length;
  const total = results.length;
  let html = `<div style="margin-bottom:8px;font-size:12px;color:#475569">
    正交率：<strong style="color:${passCount===total?'#10b981':'#f59e0b'}">${passCount}/${total}</strong>
    （${total?Math.round(passCount/total*100):0}%）
  </div>`;
  html += `<table class="ortho-table"><thead><tr><th>对比</th><th>输入重叠</th><th>输出包含</th><th>关键词重叠</th><th>正交</th></tr></thead><tbody>`;
  results.forEach(r => {
    html += `<tr>
      <td><strong>${r.a}</strong> vs <strong>${r.b}</strong></td>
      <td class="${r.inputPass?'cell-pass':'cell-fail'}">${(r.inputSim*100).toFixed(0)}%</td>
      <td class="${r.outputPass?'cell-pass':'cell-fail'}">${r.outputPass?'无包含':'有包含'}</td>
      <td class="${r.kwPass?'cell-pass':'cell-fail'}">${(r.kwSim*100).toFixed(0)}%</td>
      <td class="${r.orthogonal?'cell-pass':'cell-fail'}">${r.orthogonal?'&#x2714; 通过':'&#x2716; 不通过'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  html += '<div style="margin-top:8px;font-size:11px;color:#94a3b8">规则：输入重叠&lt;30% 且 输出无完全包含 且 关键词重叠&lt;50% 则正交</div>';
  tab.innerHTML = html;
}

    if (btn.dataset.tab === 'deps') renderDepsTab();
  });
});
