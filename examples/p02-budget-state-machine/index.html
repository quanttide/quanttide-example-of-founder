<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务预算状态机 - PoC 02</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}

.header{margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;color:#1a202c;letter-spacing:.5px}
.header p{font-size:13px;color:#718096;margin-top:4px}

.section-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden}
.section-title{font-size:14px;font-weight:600;color:#4a5568;padding:16px 20px 12px;border-bottom:1px solid #edf2f7;display:flex;align-items:center;gap:8px}
.section-body{padding:20px}

#stateDiagram{width:100%;display:block}
.state-label{font-size:13px;font-weight:500}
.state-label.active-label{font-weight:700}
.transition-label{font-size:11px;fill:#718096;font-weight:500}
.state-node rect{transition:fill .35s ease,stroke .35s ease,stroke-width .35s ease}
.state-node.pulse rect{animation:pulseGlow .8s ease}
@keyframes pulseGlow{0%{filter:drop-shadow(0 0 0 rgba(59,130,246,0))}30%{filter:drop-shadow(0 0 10px rgba(59,130,246,.45))}100%{filter:drop-shadow(0 0 0 rgba(59,130,246,0))}}
transition-path{transition:stroke .3s}

.table-wrap{overflow-x:auto}
.budget-table{width:100%;border-collapse:collapse;font-size:14px}
.budget-table th{text-align:left;padding:10px 16px;font-weight:600;color:#718096;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #edf2f7;background:#fafbfc}
.budget-table td{padding:10px 16px;border-bottom:1px solid #f0f4f8;color:#2d3748;transition:background .2s}
.budget-table tbody tr{cursor:pointer;transition:background .15s}
.budget-table tbody tr:hover td{background:#f7fafc}
.budget-table tbody tr.selected td{background:#ebf4ff;border-left:3px solid #3b82f6;padding-left:13px}
.budget-table tbody tr.selected td:first-child{border-left:3px solid #3b82f6}

.state-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:500;color:#fff}
.state-badge.s-draft{background:#9ca3af}
.state-badge.s-pending_approval{background:#f59e0b}
.state-badge.s-approved{background:#10b981}
.state-badge.s-executing{background:#3b82f6}
.state-badge.s-overrun{background:#ef4444}
.state-badge.s-closing{background:#14b8a6}
.state-badge.s-closed{background:#4a5568}

.amount-text{font-variant-numeric:tabular-nums;font-weight:500}

.bottom-grid{display:grid;grid-template-columns:1fr 360px;gap:20px}

.controls-section .section-body{padding:20px;min-height:120px}
.control-info{margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.control-info .selected-name{font-weight:600;font-size:15px;color:#2d3748}
.control-info .sep{color:#cbd5e0}
.control-info .current-state-label{font-size:13px;color:#718096}
.control-info .no-selection{color:#a0aec0;font-size:14px;padding:8px 0}
.event-buttons{display:flex;flex-wrap:wrap;gap:8px}
.event-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:1px solid;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;background:#fff}
.event-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.event-btn:active:not(:disabled){transform:translateY(0)}
.event-btn:disabled{opacity:.4;cursor:not-allowed;background:#f7fafc;border-color:#e2e8f0;color:#a0aec0}
.event-btn .event-arrow{font-size:11px;opacity:.7}

.event-btn.etype-submit{border-color:#3b82f6;color:#3b82f6}
.event-btn.etype-submit:hover:not(:disabled){background:#3b82f6;color:#fff}
.event-btn.etype-approve{border-color:#10b981;color:#10b981}
.event-btn.etype-approve:hover:not(:disabled){background:#10b981;color:#fff}
.event-btn.etype-reject{border-color:#ef4444;color:#ef4444}
.event-btn.etype-reject:hover:not(:disabled){background:#ef4444;color:#fff}
.event-btn.etype-adjust{border-color:#f59e0b;color:#f59e0b}
.event-btn.etype-adjust:hover:not(:disabled){background:#f59e0b;color:#fff}
.event-btn.etype-execute{border-color:#3b82f6;color:#3b82f6}
.event-btn.etype-execute:hover:not(:disabled){background:#3b82f6;color:#fff}
.event-btn.etype-overrun{border-color:#ef4444;color:#ef4444}
.event-btn.etype-overrun:hover:not(:disabled){background:#ef4444;color:#fff}
.event-btn.etype-close{border-color:#14b8a6;color:#14b8a6}
.event-btn.etype-close:hover:not(:disabled){background:#14b8a6;color:#fff}
.event-btn.etype-archive{border-color:#4a5568;color:#4a5568}
.event-btn.etype-archive:hover:not(:disabled){background:#4a5568;color:#fff}

.history-section .section-body{padding:12px 20px 16px;max-height:260px;overflow-y:auto}
.history-section .section-body::-webkit-scrollbar{width:4px}
.history-section .section-body::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.history-list{list-style:none;padding:0}
.history-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f7fafc;font-size:13px;line-height:1.5}
.history-item:last-child{border-bottom:none}
.history-item .h-time{color:#a0aec0;font-size:11px;white-space:nowrap;padding-top:2px;min-width:60px}
.history-item .h-name{font-weight:500;color:#4a5568;min-width:56px}
.history-item .h-trans{color:#718096}
.history-item .h-arrow{color:#cbd5e0;padding:0 4px}
.history-item .h-from{color:#a0aec0}
.history-item .h-to{font-weight:500}
.history-empty{color:#a0aec0;font-size:13px;text-align:center;padding:20px 0}

.alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:100}
.alert-overlay.show{opacity:1;pointer-events:auto}
.alert-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);background:#fff;border-radius:16px;padding:32px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(239,68,68,.2);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.22,1,.36,1);z-index:101}
.alert-panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.alert-icon{width:56px;height:56px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.alert-icon svg{width:28px;height:28px;color:#ef4444}
.alert-title{text-align:center;font-size:18px;font-weight:700;color:#b91c1c;margin-bottom:8px}
.alert-msg{text-align:center;font-size:14px;color:#4a5568;margin-bottom:6px}
.alert-amount{text-align:center;font-size:28px;font-weight:700;color:#dc2626;margin:12px 0 20px}
.alert-btn-wrap{text-align:center}
.alert-dismiss{padding:10px 32px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.alert-dismiss:hover{background:#dc2626}

@media(max-width:860px){.bottom-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>财务预算状态机 <span style="font-weight:400;color:#718096;font-size:16px">PoC 02</span></h1>
    <p>点击表格行选择预算项目，通过事件按钮驱动状态流转</p>
  </div>

  <div class="section-card">
    <div class="section-title">
      <span>状态图</span>
      <span id="activeStateLabel" style="font-weight:400;font-size:12px;color:#a0aec0;margin-left:auto">未选中项目</span>
    </div>
    <div class="section-body" style="padding:12px 20px 8px;overflow-x:auto">
      <svg id="stateDiagram" viewBox="0 0 1050 250" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">预算项目</div>
    <div class="section-body" style="padding:0">
      <div class="table-wrap">
        <table class="budget-table" id="budgetTable">
          <thead>
            <tr><th>名称</th><th>类型</th><th>金额</th><th>当前状态</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="bottom-grid">
    <div class="section-card controls-section">
      <div class="section-title">操作面板</div>
      <div class="section-body" id="controlPanel">
        <div class="control-info">
          <span class="no-selection">请从表格中选择一个预算项目</span>
        </div>
        <div class="event-buttons" id="eventButtons"></div>
      </div>
    </div>

    <div class="section-card history-section">
      <div class="section-title">变更历史</div>
      <div class="section-body" id="historyPanel">
        <ul class="history-list" id="historyList">
          <li class="history-empty">暂无变更记录</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div class="alert-overlay" id="alertOverlay"></div>
<div class="alert-panel" id="alertPanel">
  <div class="alert-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <div class="alert-title">超支告警</div>
  <div class="alert-msg">执行中预算已超限</div>
  <div class="alert-amount" id="alertAmount">¥0</div>
  <div class="alert-btn-wrap"><button class="alert-dismiss" onclick="dismissAlert()">关闭</button></div>
</div>

<script>
const STATE = {
  draft:            { label: '草稿',          color: '#9ca3af', bg: '#9ca3af' },
  pending_approval: { label: '待审批',        color: '#f59e0b', bg: '#f59e0b' },
  approved:         { label: '已通过',        color: '#10b981', bg: '#10b981' },
  executing:        { label: '执行中',        color: '#3b82f6', bg: '#3b82f6' },
  overrun:          { label: '超支告警',      color: '#ef4444', bg: '#ef4444' },
  closing:          { label: '结案中',        color: '#14b8a6', bg: '#14b8a6' },
  closed:           { label: '已结案',        color: '#4a5568', bg: '#4a5568' }
};

const STATE_ORDER = ['draft','pending_approval','approved','executing','closing','closed','overrun'];

const EVENTS = {
  submit:  { label: '提交',  target: 'pending_approval' },
  approve: { label: '批准',  target: 'approved' },
  reject:  { label: '驳回',  target: 'draft' },
  adjust:  { label: '调整',  target: 'pending_approval' },
  execute: { label: '执行',  target: 'executing' },
  overrun: { label: '超支',  target: 'overrun' },
  close:   { label: '结案',  target: 'closing' },
  archive: { label: '归档',  target: 'closed' }
};

const TRANSITIONS = {
  draft:            { submit: 'pending_approval' },
  pending_approval: { approve: 'approved', reject: 'draft' },
  approved:         { execute: 'executing', adjust: 'pending_approval' },
  executing:        { close: 'closing', overrun: 'overrun' },
  overrun:          {},
  closing:          { archive: 'closed' },
  closed:          {}
};

const SBOX_W = 110, SBOX_H = 44;
const SP = {
  draft:            { x: 60,  y: 70 },
  pending_approval: { x: 220, y: 70 },
  approved:         { x: 380, y: 70 },
  executing:        { x: 540, y: 70 },
  overrun:          { x: 540, y: 175 },
  closing:          { x: 700, y: 70 },
  closed:           { x: 860, y: 70 }
};

const TRANS_PATH = {
  submit:  { d: 'M 170 92 L 220 92',       lx: 195, ly: 82 },
  approve: { d: 'M 330 92 L 380 92',       lx: 355, ly: 82 },
  reject:  { d: 'M 275 70 L 275 25 L 115 25 L 115 70', lx: 195, ly: 18 },
  execute: { d: 'M 490 92 L 540 92',       lx: 515, ly: 82 },
  adjust:  { d: 'M 435 114 L 435 150 L 275 150 L 275 114', lx: 355, ly: 145 },
  overrun: { d: 'M 595 114 L 595 175',     lx: 610, ly: 147 },
  close:   { d: 'M 650 92 L 700 92',       lx: 675, ly: 82 },
  archive: { d: 'M 810 92 L 860 92',       lx: 835, ly: 82 }
};

let items = [
  { id:1, name:'招聘费用',   type:'运营', amount:50000,  state:'draft' },
  { id:2, name:'服务器采购', type:'IT',   amount:200000, state:'approved' },
  { id:3, name:'咨询项目',   type:'项目', amount:500000, state:'executing' },
  { id:4, name:'日常办公',   type:'运营', amount:10000,  state:'pending_approval' },
  { id:5, name:'年度培训',   type:'项目', amount:300000, state:'closing' }
];

let selectedId = null;
let historyLog = [];

function fmt(n) {
  return '¥' + Number(n).toLocaleString('zh-CN');
}

function fmtTime(d) {
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

function getValidEvents(state) {
  return Object.keys(TRANSITIONS[state] || {});
}

function renderDiagram(currentState) {
  const svg = document.getElementById('stateDiagram');
  const hasSel = currentState && items.some(i => i.id === selectedId);
  const active = hasSel ? currentState : null;

  let defs = `<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>`;
  defs += `<marker id="ah-active" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/></marker></defs>`;

  let boxes = '';
  for (const s of STATE_ORDER) {
    if (s === 'overrun') continue;
    const p = SP[s];
    const info = STATE[s];
    const isActive = s === active;
    const fill = isActive ? info.color : '#fff';
    const txtFill = isActive ? '#fff' : info.color;
    const sw = isActive ? 3 : 1.5;
    boxes += `<g class="state-node${isActive ? ' active' : ''}">`;
    boxes += `<rect x="${p.x}" y="${p.y}" width="${SBOX_W}" height="${SBOX_H}" rx="10" fill="${fill}" stroke="${info.color}" stroke-width="${sw}"/>`;
    boxes += `<text x="${p.x + SBOX_W / 2}" y="${p.y + SBOX_H / 2 + 1}" text-anchor="middle" dominant-baseline="central" class="state-label${isActive ? ' active-label' : ''}" fill="${txtFill}">${info.label}</text>`;
    boxes += '</g>';
  }
  const ov = SP.overrun;
  const ovInfo = STATE.overrun;
  const ovActive = active === 'overrun';
  const ovFill = ovActive ? ovInfo.color : '#fff';
  const ovTxt = ovActive ? '#fff' : ovInfo.color;
  boxes += `<g class="state-node${ovActive ? ' active' : ''}">`;
  boxes += `<rect x="${ov.x}" y="${ov.y}" width="${SBOX_W}" height="${SBOX_H}" rx="10" fill="${ovFill}" stroke="${ovInfo.color}" stroke-width="${ovActive ? 3 : 1.5}"/>`;
  boxes += `<text x="${ov.x + SBOX_W / 2}" y="${ov.y + SBOX_H / 2 + 1}" text-anchor="middle" dominant-baseline="central" class="state-label${ovActive ? ' active-label' : ''}" fill="${ovTxt}">${ovInfo.label}</text>`;
  boxes += '</g>';

  let arrows = '';
  for (const [ev, tp] of Object.entries(TRANS_PATH)) {
    const tgt = TRANSITIONS[Object.keys(TRANSITIONS).find(s => TRANSITIONS[s][ev] !== undefined)? Object.keys(TRANSITIONS).find(s => TRANSITIONS[s][ev] !== undefined) : ''];
    const targetState = TRANSITIONS[Object.keys(TRANSITIONS).find(s => TRANSITIONS[s][ev] !== undefined)]?.[ev];
    const isActiveTrans = active && targetState === active;
    arrows += `<path d="${tp.d}" fill="none" stroke="${isActiveTrans ? '#3b82f6' : '#94a3b8'}" stroke-width="2" marker-end="${isActiveTrans ? 'url(#ah-active)' : 'url(#ah)'}" style="transition:stroke .3s"/>`;
    arrows += `<text x="${tp.lx}" y="${tp.ly}" text-anchor="middle" class="transition-label" fill="${isActiveTrans ? '#3b82f6' : '#94a3b8'}" style="transition:fill .3s">${EVENTS[ev].label}</text>`;
  }

  svg.innerHTML = defs + boxes + arrows;

  if (active) {
    setTimeout(() => {
      const el = svg.querySelector('.state-node.active');
      if (el) { el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 900); }
    }, 50);
  }

  document.getElementById('activeStateLabel').textContent = active ? `当前: ${STATE[active].label}` : '未选中项目';
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = items.map(i => {
    const sel = i.id === selectedId ? ' selected' : '';
    const st = STATE[i.state];
    return `<tr class="${sel}" data-id="${i.id}">
      <td>${i.name}</td>
      <td>${i.type}</td>
      <td class="amount-text">${fmt(i.amount)}</td>
      <td><span class="state-badge s-${i.state}">${st.label}</span></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => selectItem(parseInt(tr.dataset.id)));
  });
}

function selectItem(id) {
  selectedId = id;
  const item = items.find(i => i.id === id);
  renderTable();
  renderDiagram(item.state);
  renderControls(item);
}

function renderControls(item) {
  const info = document.querySelector('.control-info');
  const btnWrap = document.getElementById('eventButtons');

  if (!item) {
    info.innerHTML = `<span class="no-selection">请从表格中选择一个预算项目</span>`;
    btnWrap.innerHTML = '';
    return;
  }

  const st = STATE[item.state];
  info.innerHTML = `
    <span class="selected-name">${item.name}</span>
    <span class="sep">|</span>
    <span class="current-state-label">当前状态：<span class="state-badge s-${item.state}">${st.label}</span></span>
    <span class="sep">|</span>
    <span class="amount-text" style="color:#718096;font-size:13px">${fmt(item.amount)}</span>`;

  const valid = getValidEvents(item.state);
  if (valid.length === 0) {
    btnWrap.innerHTML = `<span style="color:#a0aec0;font-size:13px">无可用操作</span>`;
    return;
  }

  btnWrap.innerHTML = valid.map(ev => {
    const info = EVENTS[ev];
    return `<button class="event-btn etype-${ev}" onclick="triggerEvent(${item.id},'${ev}')">
      ${info.label} <span class="event-arrow">→ ${STATE[info.target].label}</span>
    </button>`;
  }).join('');
}

function triggerEvent(id, eventName) {
  const item = items.find(i => i.id === id);
  if (!item) return;

  const targets = TRANSITIONS[item.state];
  if (!targets || !targets[eventName]) return;

  const fromState = item.state;
  const toState = targets[eventName];
  item.state = toState;

  historyLog.unshift({
    id,
    name: item.name,
    from: fromState,
    to: toState,
    event: eventName,
    time: new Date()
  });

  renderTable();
  renderDiagram(item.state);
  renderControls(item);
  renderHistory();

  if (eventName === 'overrun') {
    const overAmount = Math.round(item.amount * 0.235);
    showAlert(overAmount);
  }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (historyLog.length === 0) {
    list.innerHTML = `<li class="history-empty">暂无变更记录</li>`;
    return;
  }
  list.innerHTML = historyLog.map(h => {
    const fromLabel = STATE[h.from].label;
    const toLabel = STATE[h.to].label;
    return `<li class="history-item">
      <span class="h-time">${fmtTime(h.time)}</span>
      <span class="h-name">${h.name}</span>
      <span class="h-trans">
        <span class="h-from">${fromLabel}</span>
        <span class="h-arrow">→</span>
        <span class="h-to" style="color:${STATE[h.to].color}">${toLabel}</span>
      </span>
    </li>`;
  }).join('');
}

function showAlert(amount) {
  document.getElementById('alertAmount').textContent = fmt(amount);
  document.getElementById('alertOverlay').classList.add('show');
  document.getElementById('alertPanel').classList.add('show');
}

function dismissAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
  document.getElementById('alertPanel').classList.remove('show');
}

document.getElementById('alertOverlay').addEventListener('click', dismissAlert);

renderTable();
renderDiagram(null);
renderHistory();
</script>
</body>
</html>
