<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 2: 空隙 gutter 标记</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b1e;--surface:#25262b;--border:#373a40;--text:#c1c2c5;--text-dim:#909296;--accent:#7c9bff;--accent3:#ffd43b;--red:#ff6b6b}
body{font:14px/1.6 -apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#header{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;user-select:none}
#header .logo{font-weight:700;color:var(--accent)}
#header .spacer{flex:1}
#header .count{font-size:12px;color:var(--text-dim)}
#header .count strong{color:var(--text)}
#main{flex:1;display:flex;overflow:hidden}
#gutter{width:24px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:relative;overflow:hidden}
.gdot{position:absolute;left:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:2;transition:transform .1s}
.gdot:hover{transform:translate(-50%,-50%) scale(1.5);z-index:3}
.gdot.s3{background:var(--accent)}
.gdot.s2{background:var(--accent3)}
.gdot.s1{background:var(--red)}
.gline{position:absolute;left:50%;width:2px;transform:translateX(-50%);z-index:1;background:var(--border)}
textarea{flex:1;padding:16px 20px;border:none;outline:none;font-size:15px;line-height:1.8;resize:none;background:var(--bg);color:var(--text);font-family:inherit}
#tip{display:none;position:fixed;max-width:300px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;background:var(--surface);border:1px solid var(--border);z-index:100;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#tip.show{display:block}
#tip .tt{font-weight:600;margin-bottom:2px}
#status{display:flex;align-items:center;gap:16px;padding:0 16px;height:28px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="logo">✎ 写作云 <small style="font-weight:400;color:var(--text-dim);font-size:11px">PoC: gutter 标记</small></span>
    <span class="spacer"></span>
    <span class="count">空隙 <strong id="gapCount">0</strong></span>
  </div>
  <div id="main">
    <div id="gutter"></div>
    <textarea id="editor" placeholder="输入文本，点击下方按钮加载测试数据..." onscroll="syncGutter()" oninput="onEdit()"></textarea>
    <div id="tip"></div>
  </div>
  <div id="status">
    <span>行号 <strong id="lineInfo">—</strong></span>
    <span>点击 gutter 圆点跳转到对应行</span>
  </div>
</div>
<script>
// 模拟的空隙数据：线号 → { 类型, 说明, 颜色分 }
const DEMO_GAPS = {
  3:  [{type:'时间跳跃', detail:'"第二天"这段时间未被写', score:3}],
  7:  [{type:'动作间空隙', detail:'两个连续动作之间缺少过渡', score:3}],
  11: [{type:'对话间隙', detail:'对白之间缺少动作描写', score:2}],
  15: [{type:'视角切换', detail:'从他到她缺少重叠瞬间', score:3}],
  19: [{type:'过渡压缩', detail:'"回过神来"暗示时间被压缩', score:2}],
};
const GAP_TEXT = `春天的一个工作日的下午，咖啡店外下着淅淅沥沥的小雨。

他愣神看着窗外的雨水沿着屋檐滑落到地面上。

第二天清晨，他醒来时发现她已经走了。

他打开手机相册，翻到了她的那张照片。

那是他存了十年的照片。

"你来了。"
"嗯。"

他看着她湿漉漉的头发。

她低着头，拉着自己的头发，用毛巾擦了几遍。

不知不觉间，他的手已经伸了出去。

擦了两下，他回过神来。

"你喝焦糖玛奇朵吗？"
她点点头。

他忘不了，也不想忘。`;

const LINE_H = 1.8 * 15; // line-height * font-size
const PAD_TOP = 16;
let gapData = {};

function renderGutter(gaps) {
  const g = document.getElementById('gutter');
  g.innerHTML = '';
  document.getElementById('gapCount').textContent = Object.keys(gaps).length;
  gapData = gaps;

  for (const line in gaps) {
    const items = gaps[line];
    const best = Math.max(...items.map(i => i.score));
    const dot = document.createElement('div');
    dot.className = 'gdot s' + best;
    dot.style.top = (PAD_TOP + (parseInt(line) - 1) * LINE_H + 4) + 'px';
    dot.dataset.line = line;

    dot.addEventListener('mouseenter', e => {
      const tip = document.getElementById('tip');
      tip.innerHTML = items.map(i => `<div class="tt" style="color:${i.score===3?'var(--accent)':i.score===2?'var(--accent3)':'var(--red)'}">${i.type}</div><div>L${line}: ${i.detail}</div>`).join('');
      const r = e.target.getBoundingClientRect();
      tip.style.left = (r.right + 10) + 'px';
      tip.style.top = Math.max(10, r.top - 10) + 'px';
      tip.classList.add('show');
    });
    dot.addEventListener('mouseleave', () => document.getElementById('tip').classList.remove('show'));
    dot.addEventListener('click', () => {
      const ta = document.getElementById('editor');
      const lines = ta.value.split('\n');
      let pos = 0;
      for (let i = 0; i < Math.min(parseInt(line) - 1, lines.length); i++) pos += lines[i].length + 1;
      ta.focus();
      ta.setSelectionRange(pos, pos);
      ta.scrollTop = (parseInt(line) - 1) * LINE_H - 60;
    });
    g.appendChild(dot);

    // 连接线
    const lineEl = document.createElement('div');
    lineEl.className = 'gline';
    lineEl.style.top = (PAD_TOP + (parseInt(line) - 1) * LINE_H) + 'px';
    lineEl.style.height = LINE_H + 'px';
    g.appendChild(lineEl);
  }
}

function syncGutter() {
  // 空操作：PoC 用固定数据显示同步机制
}

function onEdit() {
  document.getElementById('lineInfo').textContent = document.getElementById('editor').value.split('\n').length + '行';
}

function loadDemo() {
  document.getElementById('editor').value = GAP_TEXT;
  onEdit();
  renderGutter(DEMO_GAPS);
}

document.addEventListener('DOMContentLoaded', loadDemo);
</script>
</body>
</html>
