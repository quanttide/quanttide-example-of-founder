<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 1: 三栏布局</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b1e;--surface:#25262b;--border:#373a40;--text:#c1c2c5;--text-dim:#909296;--accent:#7c9bff}
body{font:14px/1.6 -apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:grid;grid-template-rows:40px 1fr 28px;height:100vh}
#header{display:flex;align-items:center;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);user-select:none;font-size:13px}
#header .logo{font-weight:700;color:var(--accent)}
#header .spacer{flex:1}
#header .info{color:var(--text-dim);font-size:12px}
#main{display:grid;grid-template-columns:200px 1fr 300px}
.panel{overflow:hidden}
#left{background:var(--surface);padding:12px;font-size:13px}
#left h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px}
#left .item{padding:4px 0;display:flex;align-items:center;gap:6px}
#center{background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:15px}
#right{background:var(--surface);padding:12px;font-size:13px}
#right h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px}
.handle{width:4px;cursor:col-resize;background:var(--border);flex-shrink:0;transition:background .15s}
.handle:hover,.handle.active{background:var(--accent)}
#status{display:flex;align-items:center;padding:0 16px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}
#status strong{color:var(--text);margin-left:4px}
#status .spacer{flex:1}
.demo-data{font-size:13px;padding:8px;background:var(--surface);border-radius:4px;margin-top:8px}
.demo-data .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="logo">✎ 写作云 <small style="font-weight:400;color:var(--text-dim);font-size:11px;margin-left:6px">PoC: 三栏布局</small></span>
    <span class="spacer"></span>
    <span class="info">拖动手柄调整面板宽度</span>
  </div>
  <div id="main">
    <div class="panel" id="left">
      <h3>📄 底稿</h3>
      <div class="item">✎ 当前文稿</div>
      <div class="item" style="color:var(--text-dim)">📁 归档</div>
      <div class="item" style="color:var(--text-dim)">🕐 历史</div>
      <div style="margin-top:12px;height:1px;background:var(--border)"></div>
      <h3 style="margin-top:12px">🔄 3R 记录</h3>
      <div class="demo-data">
        <div class="row"><span>第1轮</span><span>—</span></div>
        <div class="row"><span>第2轮</span><span>—</span></div>
      </div>
    </div>
    <div class="handle" id="handleL"></div>
    <div class="panel" id="center">
      编辑器区域（自适应宽度，min 400px）
    </div>
    <div class="handle" id="handleR"></div>
    <div class="panel" id="right">
      <h3>🎯 创作情境</h3>
      <div id="demoSitu" style="font-size:13px;padding:8px;background:#2c2e33;border-radius:4px;border-left:3px solid var(--accent);line-height:1.7">
        在 L7 附近，文本跳过了「第二天清晨」这段时间。房间里有什么声音？光线有变化吗？
      </div>
      <div style="margin-top:12px;height:1px;background:var(--border)"></div>
      <h3 style="margin-top:12px">🔄 3R 仪表盘</h3>
      <div class="demo-data">
        <div class="row"><span>阶段</span><span style="color:var(--accent)">Review</span></div>
        <div class="row"><span>轮次</span><span>1</span></div>
        <div class="row"><span>评分</span><span style="color:var(--accent)">79/100</span></div>
      </div>
    </div>
  </div>
  <div id="status">
    <span>字数 <strong>0</strong></span>
    <span style="margin-left:16px">空隙 <strong>0</strong></span>
    <span class="spacer"></span>
    <span>上个手柄调整相邻面板宽度</span>
  </div>
</div>
<script>
// 只做一件事：拖拽手柄调整面板宽度
function initResize(handleId, leftId, rightId) {
  const h = document.getElementById(handleId);
  const left = document.getElementById(leftId);
  const right = document.getElementById(rightId);
  h.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX;
    const startLW = left.offsetWidth;
    const startRW = right.offsetWidth;
    h.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const grid = document.getElementById('main');
    function move(ev) {
      const dx = ev.clientX - startX;
      const newLW = Math.max(100, Math.min(400, startLW + dx));
      const newRW = Math.max(150, Math.min(500, startRW - dx));
      left.style.width = newLW + 'px';
      right.style.width = newRW + 'px';
    }
    function up() {
      h.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
initResize('handleL', 'left', 'right');
initResize('handleR', 'right', 'left');
</script>
</body>
</html>
