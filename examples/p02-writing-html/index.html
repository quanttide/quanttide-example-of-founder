<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作云 — 合成工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b1e;--surface:#25262b;--surface2:#2c2e33;--border:#373a40;--text:#c1c2c5;--text-dim:#909296;--accent:#7c9bff;--accent2:#69db7c;--accent3:#ffd43b;--red:#ff6b6b;--panel-min:120px;--situ-min:180px}
body{font:14px/1.6 -apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
/* header */
#header{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;user-select:none;flex-shrink:0}
#header .logo{font-weight:700;color:var(--accent)}
#header .logo small{font-weight:400;color:var(--text-dim);font-size:11px;margin-left:6px}
#header .spacer{flex:1}
#header button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px}
#header button:hover{background:var(--border)}
#header button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#header .phase-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;background:var(--surface2)}
#header .phase-badge.review{background:#2b3a5e;color:var(--accent)}
/* main: flex 三栏 */
#main{flex:1;display:flex;overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden}
/* 左栏 */
#left{width:180px;background:var(--surface);padding:10px 12px;flex-shrink:0;overflow-y:auto}
#left h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:6px}
#left .item{font-size:12px;padding:3px 0;color:var(--text-dim);display:flex;align-items:center;gap:4px}
#left .item.active{color:var(--accent)}
#left .sample-btn{width:100%;margin-top:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:4px;cursor:pointer;font-size:11px}
/* 中栏 */
#center{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#editor-toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#editor-toolbar .gap-count{font-size:11px;color:var(--text-dim)}
#editor-toolbar .spacer{flex:1}
#editor-area{flex:1;display:flex;overflow:hidden}
#gap-markers{width:18px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:relative}
.gap-dot{position:absolute;left:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.gap-dot:hover{transform:translate(-50%,-50%) scale(1.4);z-index:3}
.gap-dot.s3{background:var(--accent)}
.gap-dot.s2{background:var(--accent3)}
.gap-dot.s1{background:var(--red)}
#editor{flex:1;padding:14px 16px;border:none;outline:none;font-size:14px;line-height:1.8;resize:none;background:var(--bg);color:var(--text);font-family:inherit}
/* 右栏 */
#right{width:280px;background:var(--surface);flex-shrink:0;overflow-y:auto;padding:10px 12px}
#right h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:6px;margin-top:12px}
#right h3:first-child{margin-top:0}
.situation-text{font-size:12px;line-height:1.6;color:var(--text);padding:8px 10px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent);white-space:pre-wrap;margin-bottom:6px}
.gap-item{font-size:11px;padding:3px 4px;display:flex;align-items:flex-start;gap:4px;border-radius:3px;cursor:pointer}
.gap-item:hover{background:var(--surface2)}
.gap-item .l{color:var(--text-dim)}
.score-row{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 0}
.score-row .bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.score-row .bar .fill{height:100%;border-radius:3px}
.score-row .bar .fill.good{background:var(--accent2)}
.score-row .bar .fill.ok{background:var(--accent3)}
.score-row .bar .fill.bad{background:var(--red)}
.score-row .v{color:var(--text-dim);min-width:24px;text-align:right}
.dash-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0}
.dash-row .l{color:var(--text-dim)}
.dash-row .v{font-weight:600}
#phase-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:6px}
#phase-grid .p{text-align:center;padding:4px;border-radius:4px;font-size:10px;font-weight:600;background:var(--surface2);color:var(--text-dim)}
#phase-grid .p.active{background:var(--accent);color:#fff}
/* status */
#status{display:flex;align-items:center;gap:12px;padding:0 12px;height:26px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0}
#status strong{color:var(--text)}
#status .spacer{flex:1}
/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="logo">✎ 写作云 <small>合成工作台</small></span>
    <span class="spacer"></span>
    <span class="phase-badge review" id="phaseBadge">Review</span>
    <button class="primary" onclick="runReview()">▶ 评审</button>
    <button onclick="loadSample()">加载样本</button>
  </div>
  <div id="main">
    <!-- 左栏 -->
    <div class="panel" id="left">
      <h3>📄 底稿</h3>
      <div class="item active">✎ 当前文稿</div>
      <h3 style="margin-top:16px">🔄 3R 记录</h3>
      <div id="historyLog" style="font-size:11px;color:var(--text-dim)"><span style="opacity:.5">暂无</span></div>
      <button class="sample-btn" onclick="loadSample()">加载测试底稿</button>
    </div>
    <!-- 中栏 -->
    <div class="panel" id="center">
      <div id="editor-toolbar">
        <span class="gap-count">空隙 <strong id="gapCount">0</strong></span>
        <span class="spacer"></span>
      </div>
      <div id="editor-area">
        <div id="gap-markers"></div>
        <textarea id="editor" placeholder="粘贴或输入文本..." oninput="onEdit()" spellcheck="false"></textarea>
      </div>
    </div>
    <!-- 右栏 -->
    <div class="panel" id="right">
      <h3>🎯 创作情境</h3>
      <div class="situation-text" id="situationText">点击「评审」查看情境引导。</div>
      <h3>📋 评审</h3>
      <div id="reviewContent"><div style="font-size:11px;color:var(--text-dim);opacity:.5">等待评审...</div></div>
      <h3>🔄 3R</h3>
      <div id="phase-grid">
        <div class="p active" data-p="review">Review</div>
        <div class="p" data-p="reflect">Reflect</div>
        <div class="p" data-p="rewrite">Rewrite</div>
      </div>
      <div class="dash-row"><span class="l">轮次</span><span class="v" id="dashCycle">1</span></div>
      <div class="dash-row"><span class="l">评分</span><span class="v" id="dashScore">—</span></div>
    </div>
  </div>
  <div id="status">
    <span>字数 <strong id="statWords">0</strong></span>
    <span>空隙 <strong id="statGaps">0</strong></span>
    <span class="spacer"></span>
    <span id="statSave">就绪</span>
  </div>
</div>
<script>
// ═══════════════════════════
//  简版 3R 引擎（仅合成演示）
// ═══════════════════════════

const SAMPLE = `# 咖啡厅重逢

春天的一个工作日的下午，咖啡店外下着淅淅沥沥的小雨。

他愣神看着窗外的雨水沿着屋檐滑落到地面上。

他又想起了她了。

自从毕业以后，他们的交集渐渐地少了。

他打开手机相册里那个常打开的星标相簿，又翻到了她的那张照片。

那是他存了十年的照片。

他打开了手机日记本，随手写下几句话：

> 她更成熟了，更好看了。

他看着窗外时下时停的雨。透过去，他看到了十年前自己在雨中见过的她的背影。

她拉着行李箱走出车站，抬头望了望头上忽晴忽阴的天空。

她看到前面有家咖啡厅，似乎是在院落里。

她想要推门地手顿住了。真的是他，

滑轮的声音摩擦着地面。她轻轻推开了咖啡店的门。

听到门口的声响，他本能地转过头。

看到眼前窈窕的身影，他愣住了。

不是梦。

他看了看她湿漉漉的头发，从书包里掏出刚在超市买的毛巾。

不知不觉间，他的手已经伸了出去，轻轻地擦了擦她的头发。

擦了两下，他回过神来。赶忙停下来，把毛巾递给她。

她也不舍地回过神，慢慢伸手接过毛巾。

窗外的雨停了又下，下了又停。

他忘不了，也不想忘。`;

const RE_TIME = /第二天|过了一会儿|不久之后|次日/;
const RE_DIALOG = /["「『]/;
const RE_DIALOG_C = /[」』"]/;
const RE_TRANSITION = /(不知不觉|恍然|猛然|突然).{0,6}(间|地)|回过神来/;
const RE_ACTION = /推开|走进|走出|坐下|站起|转身|拿起|放下|打开|关上|递|接|碰|触|擦|抹|伸|拉|走|站|坐/;

function analyze(text) {
  const lines = text.split('\n');
  const gaps = [];
  let actionLines = 0, dialogLines = 0;

  for (let i = 0; i < lines.length; i++) {
    const s = lines[i].trim();
    if (!s) continue;
    const ln = i + 1;

    if (RE_TIME.test(s)) gaps.push({ type:'时间跳跃', line:ln, detail:'这段时间未被写', score:3 });
    if (RE_DIALOG.test(s)) {
      dialogLines++;
      for (let j = i - 1; j >= Math.max(0, i - 6); j--) {
        const p = lines[j].trim();
        if (!p) continue;
        if (RE_DIALOG_C.test(p) && !RE_ACTION.test(s)) gaps.push({ type:'对话间隙', line:ln, detail:'对白之间缺少动作', score:2 });
        break;
      }
    }
    if (RE_ACTION.test(s)) {
      actionLines++;
      for (let j = i - 1; j >= Math.max(0, i - 6); j--) {
        const p = lines[j].trim();
        if (!p) continue;
        if (RE_ACTION.test(p)) gaps.push({ type:'动作空隙', line:ln, detail:'连续动作间缺少过渡', score:3 });
        break;
      }
    }
    if (RE_TRANSITION.test(s)) gaps.push({ type:'过渡压缩', line:ln, detail:'时间被压缩', score:2 });
  }

  const total = lines.filter(l => l.trim()).length;
  const actPct = total ? Math.round((actionLines / total) * 100) : 0;
  const styles = [
    { name:'对话→动作', score:Math.min(100, actPct * 2), tip:'用动作替代对话' },
    { name:'状态句结尾', score:/忘不了|还没|不$|…/.test(lines.slice(-3).join('')) ? 100 : 30, tip:'停在紧张时刻' },
    { name:'半秒钟密度', score:Math.min(100, gaps.length * 20), tip:'发现动作空隙' },
  ];
  const avg = Math.round(styles.reduce((s,st) => s+st.score, 0) / styles.length);
  return { gaps, styles, avgScore:avg, stats:{actionLines, dialogLines, emotionTotal:0} };
}

function generateSituations(gaps) {
  const T = {
    timeJump: (g) => `在 L${g.line} 跳过了这段时间。房间里有什么声音？光线有变化吗？`,
    dialogGap: (g) => `L${g.line} 的对白之间有一段沉默。说话的人开口前做了什么？吞咽了一下？`,
    actionGap: (g) => `L${g.line} 的两个动作之间缺少过渡。角色的手在哪？呼吸节奏怎样？`,
    transitionGap: (g) => `L${g.line} 的时间被压缩了。把它展开，让读者体验每一秒。`,
  };
  return gaps.filter(g => g.score >= 2).slice(0, 3).map(g => (T[g.type] || (()=>''))(g)).filter(Boolean);
}

// ═══════════════════════════
//  UI
// ═══════════════════════════

const $ = id => document.getElementById(id);
const LINE_H = 1.8 * 14;
const PAD = 14;

function onEdit() {
  const text = $('editor').value;
  $('statWords').textContent = text.length;
  updateGapMarkers([]);
}

function updateGapMarkers(gaps) {
  const container = $('gap-markers');
  container.innerHTML = '';
  if (!gaps.length) return;
  const byLine = {};
  for (const g of gaps) {
    if (!byLine[g.line]) byLine[g.line] = { line:g.line, best:g.score, items:[] };
    byLine[g.line].items.push(g);
    if (g.score > byLine[g.line].best) byLine[g.line].best = g.score;
  }
  for (const k in byLine) {
    const e = byLine[k];
    const dot = document.createElement('div');
    dot.className = 'gap-dot s' + e.best;
    dot.style.top = (PAD + (e.line - 1) * LINE_H + 4) + 'px';
    dot.title = e.items.map(i => `[${i.type}] ${i.detail}`).join('\n');
    dot.addEventListener('click', () => {
      const ta = $('editor');
      const lines = ta.value.split('\n');
      let pos = 0;
      for (let i = 0; i < Math.min(e.line - 1, lines.length); i++) pos += lines[i].length + 1;
      ta.focus(); ta.setSelectionRange(pos, pos); ta.scrollTop = (e.line - 1) * LINE_H - 60;
    });
    container.appendChild(dot);
  }
}

function runReview() {
  const text = $('editor').value;
  if (!text.trim()) return;
  const result = analyze(text);
  $('statGaps').textContent = result.gaps.length;
  $('dashScore').textContent = result.avgScore + '/100';

  updateGapMarkers(result.gaps);

  // 右栏评审
  let html = '';
  if (result.gaps.length) {
    html += '<div style="font-size:11px;font-weight:600;margin-bottom:4px">空隙</div>';
    for (const g of result.gaps.slice(0, 8)) {
      html += `<div class="gap-item"><span>${g.score===3?'🟢':g.score===2?'🟡':'🔴'}</span><span>L${g.line} <span class="l">${g.type}</span></span></div>`;
    }
  }
  html += '<div style="font-size:11px;font-weight:600;margin:8px 0 4px">风格</div>';
  for (const s of result.styles) {
    const cls = s.score >= 70 ? 'good' : s.score >= 40 ? 'ok' : 'bad';
    html += `<div class="score-row"><span style="min-width:80px">${s.name}</span><div class="bar"><div class="fill ${cls}" style="width:${s.score}%"></div></div><span class="v">${s.score}%</span></div>`;
  }
  html += `<div style="font-size:12px;font-weight:600;margin-top:6px">综合 ${result.avgScore}/100</div>`;
  $('reviewContent').innerHTML = html;

  // 情境引导
  const sits = generateSituations(result.gaps);
  $('situationText').innerHTML = sits.length ? sits.map((s,i) => `#${i+1}\n${s}`).join('\n\n——\n\n') : '当前未检测到引导。';
}

function loadSample() {
  $('editor').value = SAMPLE;
  onEdit();
  runReview();
}

document.addEventListener('DOMContentLoaded', loadSample);
</script>
</body>
</html>
