<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作云 HTML PoC</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --panel-w:200px;--situ-w:300px;
  --bg:#1a1b1e;--surface:#25262b;--surface2:#2c2e33;
  --border:#373a40;--text:#c1c2c5;--text-dim:#909296;
  --accent:#7c9bff;--accent2:#69db7c;--accent3:#ffd43b;
  --red:#ff6b6b;--gutter:4px;
}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:grid;grid-template-rows:40px 1fr 28px;height:100vh}

/* header */
#header{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;user-select:none}
#header .logo{font-weight:700;color:var(--accent);letter-spacing:.5px}
#header .logo small{font-weight:400;color:var(--text-dim);font-size:11px;margin-left:6px}
#header .spacer{flex:1}
#header .phase-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;background:var(--surface2)}
#header .phase-badge.review{background:#2b3a5e;color:var(--accent)}
#header .phase-badge.reflect{background:#2b4a2e;color:var(--accent2)}
#header .phase-badge.rewrite{background:#4a442b;color:var(--accent3)}
#header .phase-badge .cycle{color:var(--text-dim);font-weight:400}
#header button{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px}
#header button:hover{background:var(--border)}
#header button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#header button.primary:hover{opacity:.85}
#header .btn-done{background:var(--accent2);color:#fff;border-color:var(--accent2);opacity:.4!important}
#header .btn-done:disabled{cursor:default}

/* main grid — column widths set in JS for consistency */
#main{display:grid;overflow:hidden}

/* resize handles */
.handle{width:var(--gutter);cursor:col-resize;background:var(--border);flex-shrink:0}
.handle:hover,.handle.active{background:var(--accent)}

/* left panel */
#project-panel{background:var(--surface);overflow-y:auto}
#project-panel .section{padding:10px 12px}
#project-panel .section+.section{border-top:1px solid var(--border)}
#project-panel h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px}
#project-panel .file-list{list-style:none}
#project-panel .file-list li{padding:4px 0;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
#project-panel .file-list li:hover{color:var(--accent)}
#project-panel .file-list li.active{color:var(--accent);font-weight:600}
#project-panel .sample-btn{margin-top:8px;width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:4px;cursor:pointer;font-size:12px}
#project-panel .sample-btn:hover{background:var(--border)}

/* editor */
#editor-panel{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
#editor-panel .toolbar{display:flex;gap:4px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#editor-panel .toolbar button{background:none;border:none;color:var(--text-dim);padding:2px 6px;cursor:pointer;font-size:12px;border-radius:3px}
#editor-panel .toolbar button:hover{background:var(--surface2);color:var(--text)}
#editor-panel .toolbar button.active{color:var(--accent);background:var(--surface2)}
#editor-panel .toolbar .spacer{flex:1}
#editor-area{flex:1;display:flex;overflow:hidden;position:relative}
#editor-area textarea{flex:1;padding:16px 20px;border:none;outline:none;font-size:15px;line-height:1.8;overflow-y:auto;background:var(--bg);color:var(--text);resize:none;font-family:inherit}
#editor-area textarea::placeholder{color:var(--text-dim);opacity:.4}

/* gap gutter markers */
#gutter{width:20px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:relative;overflow:hidden}
#gutter .gutter-dot{position:absolute;left:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
#gutter .gutter-dot:hover{transform:translate(-50%,-50%) scale(1.4);z-index:3}
#gutter .gutter-dot.g3{background:var(--accent)}
#gutter .gutter-dot.g2{background:var(--accent3)}
#gutter .gutter-dot.g1{background:var(--red)}
#gutter .gutter-dot.active{box-shadow:0 0 6px 2px var(--accent)}
#gutter .gutter-line{position:absolute;left:50%;width:2px;transform:translateX(-50%);z-index:1}

/* preview overlay in editor area */
#preview{display:none;position:absolute;top:0;left:0;right:0;bottom:0;padding:16px 20px;overflow-y:auto;background:var(--bg);z-index:10}
#preview.visible{display:block}
#preview h1,#preview h2{color:#fff;margin:16px 0 8px}
#preview h1{font-size:22px}
#preview h2{font-size:18px}
#preview h3{font-size:16px;color:#fff;margin:12px 0 6px}
#preview h4{font-size:14px;color:var(--text);margin:10px 0 4px}
#preview p{margin:8px 0}
#preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-dim);margin:8px 0}
#preview blockquote p{margin:4px 0}
#preview em{font-style:italic;color:var(--accent3)}
#preview strong{color:#fff}
#preview hr{border:none;border-top:1px solid var(--border);margin:16px 0}
#preview ul,#preview ol{padding-left:20px;margin:8px 0}
#preview li{margin:2px 0}

/* right panel */
#situation-panel{background:var(--surface);overflow-y:auto}
#situation-panel .section{padding:12px}
#situation-panel .section+.section{border-top:1px solid var(--border)}
#situation-panel h3{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
#situation-panel .situation-text{font-size:13px;line-height:1.7;color:var(--text);padding:10px 12px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent);margin-bottom:8px;white-space:pre-wrap}
#situation-panel .gap-item{font-size:12px;padding:4px 6px;display:flex;align-items:flex-start;gap:6px;border-radius:3px;cursor:pointer}
#situation-panel .gap-item:hover{background:var(--surface2)}
#situation-panel .gap-item .dot{flex-shrink:0;margin-top:2px}
#situation-panel .gap-item .label{color:var(--text-dim)}
#situation-panel .gap-item .gap-detail{font-size:11px;color:var(--text-dim);margin-top:1px}
#situation-panel .score-bar{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
#situation-panel .score-bar .bar-wrap{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
#situation-panel .score-bar .bar-fill{height:100%;border-radius:3px;transition:width .3s}
#situation-panel .score-bar .bar-fill.good{background:var(--accent2)}
#situation-panel .score-bar .bar-fill.ok{background:var(--accent3)}
#situation-panel .score-bar .bar-fill.bad{background:var(--red)}
#situation-panel .score-bar .score-val{color:var(--text-dim);min-width:28px;text-align:right}

/* 3R dashboard */
#dashboard{display:flex;flex-direction:column;gap:6px}
#dashboard .dash-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
#dashboard .dash-row .label{color:var(--text-dim)}
#dashboard .dash-row .value{font-weight:600}
#dashboard .phase-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
#dashboard .phase-grid .phase-item{text-align:center;padding:6px 4px;border-radius:4px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text-dim)}
#dashboard .phase-grid .phase-item.active{background:var(--accent);color:#fff}
#dashboard .phase-grid .phase-item.done{background:var(--accent2);color:#fff}

/* status bar */
#status-bar{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);user-select:none}
#status-bar .stat{display:flex;align-items:center;gap:4px}
#status-bar .stat strong{color:var(--text);font-weight:600}
#status-bar .spacer{flex:1}

/* scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:13px;gap:8px;padding:20px;text-align:center}
.empty-state .icon{font-size:32px;opacity:.3}

/* floating tooltip for gap overlay */
#gap-tooltip{display:none;position:fixed;max-width:320px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;background:#1a1b1e;color:var(--text);border:1px solid var(--border);z-index:100;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#gap-tooltip.visible{display:block}
#gap-tooltip .tip-type{font-weight:600;margin-bottom:2px}
#gap-tooltip .tip-type.g3{color:var(--accent)}
#gap-tooltip .tip-type.g2{color:var(--accent3)}
#gap-tooltip .tip-type.g1{color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <span class="logo">✎ 写作云 <small>HTML PoC</small></span>
    <span class="spacer"></span>
    <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text-dim)" title="声明的交替双视角不扣分">
      <input type="checkbox" id="chkDualPov"> 双视角
    </label>
    <span class="phase-badge review" id="phaseBadge"><span id="phaseLabel">Review</span><span class="cycle" id="cycleLabel">—</span></span>
    <button id="btnReview" class="primary" onclick="doPhase('review')">▶ 评审</button>
    <button id="btnReflect" onclick="doPhase('reflect')">▶ 反思</button>
    <button id="btnNextCycle" onclick="doPhase('rewrite')" disabled>下一轮 ➜</button>
  </div>
  <div id="main">
    <div id="project-panel" class="panel">
      <div class="section">
        <h3>📄 底稿</h3>
        <ul class="file-list">
          <li class="active"><span>✎</span> 当前文稿</li>
        </ul>
        <button class="sample-btn" onclick="loadSample()">加载测试底稿</button>
      </div>
      <div class="section">
        <h3>🕐 3R 记录</h3>
        <div id="historyLog" style="font-size:12px;color:var(--text-dim)"><span style="opacity:.5">暂无记录</span></div>
      </div>
    </div>
    <div class="handle" id="handleLeft"></div>
    <div id="editor-panel" class="panel">
      <div class="toolbar">
        <span id="gapIndicator" style="font-size:12px;color:var(--text-dim)">空隙: <strong id="headerGapCount">0</strong></span>
        <span class="spacer"></span>
        <button class="active" id="btnEdit" onclick="setMode('edit')">✎ 编辑</button>
        <button id="btnPreview" onclick="setMode('preview')">👁 预览</button>
        <button onclick="clearText()">🗑 清空</button>
      </div>
      <div id="editor-area">
        <div id="gutter"></div>
        <textarea id="editor" placeholder="在此输入文本..." oninput="onEdit()" spellcheck="false"></textarea>
        <div id="preview"></div>
      </div>
    </div>
    <div class="handle" id="handleRight"></div>
    <div id="situation-panel" class="panel">
      <div class="section" id="situationSection">
        <h3>🎯 创作情境</h3>
        <div class="situation-text" id="situationText">输入文本并点击「评审」查看情境引导。</div>
      </div>
      <div class="section" id="reviewSection">
        <h3>📋 评审报告</h3>
        <div id="reviewContent"><div class="empty-state"><div class="icon">📊</div><span>等待评审...</span></div></div>
      </div>
      <div class="section">
        <h3>🔄 3R 仪表盘</h3>
        <div id="dashboard">
          <div class="phase-grid" id="phaseGrid">
            <div class="phase-item active" data-phase="review">Review</div>
            <div class="phase-item" data-phase="reflect">Reflect</div>
            <div class="phase-item" data-phase="rewrite">Rewrite</div>
          </div>
          <div class="dash-row"><span class="label">轮次</span><span class="value" id="dashCycle">1</span></div>
          <div class="dash-row"><span class="label">周期时长</span><span class="value" id="dashDuration">—</span></div>
          <div class="dash-row"><span class="label">风格评分</span><span class="value" id="dashScore">—</span></div>
        </div>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <span class="stat">字数 <strong id="statWords">0</strong></span>
    <span class="stat">行数 <strong id="statLines">0</strong></span>
    <span class="stat">空隙 <strong id="statGaps">0</strong></span>
    <span class="spacer"></span>
    <span class="stat" id="statSave">就绪</span>
  </div>
</div>
<div id="gap-tooltip"></div>
<script>
// ══════════════════════════════════════════════════════════
//  写作云 3R 引擎 — HTML 版
// ══════════════════════════════════════════════════════════

// ─── 3R 阶段机 ─────────────────────────────────────────
const PHASES = { REVIEW:'review', REFLECT:'reflect', REWRITE:'rewrite' };
const PHASE_ORDER = [PHASES.REVIEW, PHASES.REFLECT, PHASES.REWRITE];

let state = {
  text: '', gaps: [], styles: [], score: null,
  cycle: 0, phase: PHASES.REVIEW, phaseStart: null,
  history: [],
};

// ─── 测试底稿（已校对 POV 一致性） ──────────────────────
const SAMPLE = `# 咖啡厅重逢

春天的一个工作日的下午，咖啡店外下着淅淅沥沥的小雨。

他愣神看着窗外的雨水沿着屋檐滑落到地面上。

这是一家坐落在小院子里的咖啡店，屋里只有零星的几张桌子。

他又想起了她了。

自从毕业以后，他们的交集渐渐地少了。偶尔，他能在朋友圈里看到她的好友晒和她的合影。

她的生活、事业似乎都依然是那么精彩，不像他那样枯燥。他想。

他打开手机相册里那个常打开的星标相簿，又翻到了她的那张照片。

那是他存了十年的照片。

他把新得到的照片放到星标相簿里。

他打开了手机日记本，随手写下几句话：

> 她更成熟了，更好看了。
> 更渴望她了。
> 好想和她在一起。
> 什么时候能再遇见她呢。
> 从没有人知道过我喜欢她。我就这样孤独地遥望了她十年。
> 如果上天赐予我重新遇见她的机会，我希望这次可以勇敢地告诉她，我的心意一直没变。

哦不对。上次说漏嘴了一次。

他删掉了"从没有人"，换成了"少有人"。

他看着窗外时下时停的雨。透过去，他看到了十年前自己在雨中见过的她的背影。

她拉着行李箱走出车站，抬头望了望头上忽晴忽阴的天空。

耳机里放着周董的音乐：

"雨纷纷，旧故里草木深。我听闻，你仍守着孤城。"

她又看了看前两天闺蜜发给自己的消息：

"我老公说，他又打听你的近况了。他这些年一直单着。"
"你说他是不是一直喜欢你啊。"
"正好你也要回去，要不要正式认识一下他。"
"你说你顶着这么漂亮的一张脸搞暗恋也太可惜了吧。"

是啊，太可惜了。

这一次，让我鼓起勇气奔向你。

想到这里，她的心咚咚咚地敲着她。她突然觉得有点胆怯。

"他会不会喜欢我。"女主轻轻的问自己。

想到这里，她的心里沉重地像吞了一个铅块。

她没带雨伞，身上已经有点微微淋湿。

"找个地方避避雨吧。"她心想。

她看到前面有家咖啡厅，似乎是在院落里。

"就这吧！"她快步地拉着行李箱走过去。

透过窗户，她看到了一个熟悉的身影在屋内。

她想要推门地手顿住了。真的是他，

滑轮的声音摩擦着地面。她轻轻推开了咖啡店的门。

听到门口的声响，他本能地转过头。

看到眼前窈窕的身影，他愣住了。

是梦吗？

不是梦。

他看了看她湿漉漉的头发，从书包里掏出刚在超市买的毛巾。

看着她带电的大眼睛和微红的脸颊，他的渐渐失了神。

他的喉咙发痒，舌头微微动了动。心跳加速，浑身燥热。

不知不觉间，他的手已经伸了出去，轻轻地擦了擦她的头发。

擦了两下，他回过神来。赶忙停下来，把毛巾递给她。

她也不舍地回过神，慢慢伸手接过毛巾。

手指不经意间碰到他修长的手指，她的心弦被狠狠地拨动了一下。

她的手真好看啊。

她低着头，拉着自己的头发，用毛巾擦了几遍。

新拆封的毛巾还带着一些涩涩的味道。

她不敢抬头，怕眼神暴露了内心的羞怯。

她想把毛巾还给他。

"你拿着吧，我等会再买一条。"他笑着摆了摆手，"你喝焦糖玛奇朵吗？"

她点点头。

"老板，再加一杯焦糖玛奇朵。"他对着柜台轻轻喊了一声，一边帮她把行李箱拉到了他的桌子旁。

"你的咖啡。"店员小姐姐很快端了一杯新的焦糖玛奇朵过来。

他看着她纤细的手端过咖啡杯，轻轻地抿了一小口。

优雅地像一副画一样。

"我最近很爱喝焦糖玛奇朵。"他尝试着打破尴尬，"这家咖啡店是我的摸鱼圣地，今天在这坐了一下午。"

哎呀，我怎么突然不会说话了。她尴尬地想。

窗外的雨停了又下，下了又停。

咖啡机的轰鸣声时响时停。

林远亭面前的焦糖玛奇朵还有一点凉透的残余。

陆知微五分钟前刚拖着行李箱离开。

林远亭低头看了看自己的手。二十分钟前，这双手第一次触碰了她。

触感是湿漉又温热的。

他忘不了，也不想忘。`;

// ══════════════════════════════════════════════════════════
//  评审引擎
// ══════════════════════════════════════════════════════════

const W = {
  identityLabelPenalty:20, emotionLabelPenalty:15, parallelNarrativePenalty:25,
  flashbackBlockPenalty:20, actionConversionMultiplier:2, perspectiveShiftsPer100:3, gapDensityMultiplier:20,
};

const BODY_WORDS = '头发,指尖,手,脚,皮肤,呼吸,心跳,湿,涩,热,冷,疼,眼睑,睫毛,嘴唇,下颌,颈,锁骨,肩膀,脊背,胸口,腰,手腕,掌心,指节,膝,脚踝,脉搏,体温,汗,痒,麻,酸,胀,闷,哽咽,吞咽,喉咙,脸颊,眼眶,视线'.split(',');

const ACTION_VERBS = new Set('推开,走进,走出,坐下,站起,转身,拿起,放下,打开,关上,递,接,碰,触,擦,抹,伸,拉,走,站,坐,推,停,低,挡,抓,握,敲,放,抬,探,揽,搂,牵,拽,扶,撑,趴,蹲,跪,躺,靠,贴,退,躲,闪,侧,偏,仰,俯,闭,睁,眯,眨,盯,瞥,抿,舔,咬,吸,呼,叹,颤,抖,拎,挎,披,裹,卷,拧,掰,勾'.split(','));

// 预编译正则
const RE = {
  timeJump: /第二天(清晨|上午|中午|下午|晚上|深夜)?|过了一会儿|过了[一会儿很久一段时间]|[那这]天(晚上|深夜)|[几好]个小时后|不久之后|次日|翌日|一周(后|之后)|一个月(后|之后)/,
  dialogOpen: /["「『「「]/,
  dialogClose: /[」』"」」]/,
  transition: /(不知不觉|不知不|恍然|猛然|突然).{0,6}(间|地)|回过神来|过了一会(儿|)/,
  perspective: /(他|她|我|你)(突然|终于|还是|又|也|就|已经)?\s*(感觉|觉得|想|认为|知道|明白|意识到|发现|看到|听到|心想|想起|忘不了)/,
  namedEmotion: /(感到|觉得)\s*.{0,10}(不安|焦虑|紧张|害怕|开心|难过|沉重|孤单|温暖|幸福|痛苦|矛盾|坚定|犹豫|惊喜|失落|满足|疲惫|煎熬|慌乱)/,
  emotionLabel: /(欣喜|悲伤|愤怒|尴尬|开心|难过|激动|焦虑|平静|紧张|兴奋|失望|沮丧|羞怯|沉重|胆怯|燥热)地/,
  identityLabel: /(作为|身为|以.{0,20}的身份).{0,20}(创业者|投资人|校友|老板|员工|父亲|母亲|儿子|女儿)/,
  actionExtra: /沉默|停顿|低头|抬头|深呼吸/,
  flashback: /^\s*[他她]还记得|回想|记忆|那时|曾经/,
  parallel: /也|同样|各自/,
};

function analyze(text, dualPov) {
  const lines = text.split('\n');
  const n = lines.length;
  const gaps = [];
  const res = { dialogLines:0, actionLines:0, identityLabels:0, emotionTotal:0, perspectiveShifts:0, timeJumps:0, stateEndings:0, plotEndings:0 };

  // 收集视角标记行用于检测切换
  const perspectiveLines = [];

  for (let i = 0; i < n; i++) {
    const s = lines[i].trim();
    if (!s) continue;

    // 时间跳跃
    const tm = s.match(RE.timeJump);
    if (tm) {
      gaps.push({ type:'timeJump', line:i+1, text:s.slice(0,50), detail:`"${tm[0]}"——这段时间未被写`, score:3 });
      res.timeJumps++;
    }

    // 对话检测（用于统计）
    const hasDialog = RE.dialogOpen.test(s);
    if (hasDialog) res.dialogLines++;

    // 对话间隙：上一行也是对话且本行无动作
    if (hasDialog && i > 0) {
      for (let j = i - 1; j >= Math.max(0, i - 8); j--) {
        const p = lines[j].trim();
        if (!p) continue;
        if (RE.dialogClose.test(p) && !isAction(s)) {
          gaps.push({ type:'dialogGap', line:i+1, text:s.slice(0,50), detail:'对白之间缺少动作或心理描写', score:2 });
        }
        break;
      }
    }

    // 动作行统计
    if (isAction(s)) {
      res.actionLines++;
    }

    // 动作间空隙：上一个非空行也是动作行
    if (isAction(s)) {
      for (let j = i - 1; j >= Math.max(0, i - 8); j--) {
        const p = lines[j].trim();
        if (!p) continue;
        if (isAction(p)) {
          gaps.push({ type:'actionGap', line:i+1, text:s.slice(0,50), detail:'两个连续动作之间缺少过渡', score:3 });
        }
        break;
      }
    }

    // 过渡压缩
    const tr = s.match(RE.transition);
    if (tr) {
      gaps.push({ type:'transitionGap', line:i+1, text:s.slice(0,50), detail:`"${tr[0]}"暗示时间被压缩`, score:2 });
    }

    // 视角切换
    const pm = s.match(RE.perspective);
    if (pm) {
      res.perspectiveShifts++;
      perspectiveLines.push({ line:i+1, pronoun:pm[1] });
      // 与上一个视角不同的切换
      if (perspectiveLines.length >= 2) {
        const prev = perspectiveLines[perspectiveLines.length - 2];
        if (prev.pronoun !== pm[1]) {
          // 只记一次不重复
          if (!gaps.some(g => g.type === 'povGap' && Math.abs(g.line - (i+1)) <= 2)) {
            gaps.push({ type:'povGap', line:i+1, text:s.slice(0,50), detail:`从${prev.pronoun}到${pm[1]}缺少重叠瞬间`, score:3 });
          }
        }
      }
    }
  }

  // ── 风格检查 ──
  const styles = [];
  const totalContent = lines.filter(l => l.trim()).length;

  // 1. 对话 → 动作
  const actionPct = totalContent ? (res.actionLines / totalContent) * 100 : 0;
  const dialogPct = totalContent ? (res.dialogLines / totalContent) * 100 : 0;
  styles.push({ name:'对话 → 动作', score:Math.min(100, Math.round(actionPct * W.actionConversionMultiplier)), detail:`对话${Math.round(dialogPct)}% / 动作${Math.round(actionPct)}%`, tip:'用身体动作替代对话' });

  // 2. 身份标签 → 身体感知
  const idMatches = (text.match(RE.identityLabel) || []).length;
  res.identityLabels = idMatches;
  const bodyCount = BODY_WORDS.reduce((s, w) => {
    let idx = -1, c = 0;
    while ((idx = text.indexOf(w, idx + 1)) !== -1) c++;
    return s + c;
  }, 0);
  styles.push({ name:'身份标签 → 身体感知', score:idMatches > 0 ? Math.max(0, 100 - idMatches * W.identityLabelPenalty) : 100, detail:`身份标签${idMatches}处 / 身体词汇${bodyCount}处`, tip:'通过物与身体的接触传递情绪' });

  // 3. 命名情绪 → 隐藏情绪
  const emMatches = (text.match(RE.emotionLabel) || []).length;
  const naMatches = (text.match(RE.namedEmotion) || []).length;
  res.emotionTotal = emMatches + naMatches;
  styles.push({ name:'命名情绪 → 隐藏情绪', score:Math.max(0, 100 - (emMatches + naMatches) * W.emotionLabelPenalty), detail:`"地"字${emMatches}处 + 感到/觉得${naMatches}处`, tip:'让读者自己命名情绪' });

  // 4. 有限第三人称紧贴
  if (!dualPov) {
    const per100 = n / 100;
    const expect = Math.max(W.perspectiveShiftsPer100 * per100, 1);
    const over = res.perspectiveShifts - expect;
    styles.push({ name:'有限第三人称紧贴', score:over > 0 ? Math.max(0, Math.round(100 - (over / expect) * 100)) : 100, detail:`视角切换点${res.perspectiveShifts}处`, tip:'每个场景锁定一个角色内部视角' });
  }

  // 5. 状态句结尾
  const lastFew = lines.slice(-5).filter(l => l.trim());
  const stateMarks = ['突然','感觉','—','……','?','？','不'];
  const plotMarks = ['加了','约定','安排','决定','告诉'];
  if (lastFew.some(l => stateMarks.some(m => l.includes(m)))) res.stateEndings++;
  if (lastFew.some(l => plotMarks.some(m => l.includes(m)))) res.plotEndings++;
  styles.push({ name:'状态句结尾', score:res.stateEndings > res.plotEndings ? 100 : 30, detail:`状态句${res.stateEndings}处 / 情节句${res.plotEndings}处`, tip:'停在最紧张的时刻，不化解冲突' });

  // 6. 对称叙事 → 交错叙事
  const parallel = lines.filter(l => l.includes('他') && l.includes('她') && RE.parallel.test(l)).length;
  styles.push({ name:'对称叙事 → 交错叙事', score:Math.max(0, 100 - parallel * W.parallelNarrativePenalty), detail:`对称模式${parallel}处`, tip:'从各写一段内心到动作触发反应' });

  // 7. 半秒钟密度
  styles.push({ name:'半秒钟发现密度', score:Math.min(100, gaps.length * W.gapDensityMultiplier), detail:`空隙${gaps.length}处 / ${n}行`, tip:'在已有文本中发现两个动作之间的空隙' });

  // 8. 过去闪回
  let fb = 0, inFb = false;
  for (const l of lines) {
    if (RE.flashback.test(l)) { if (!inFb) { fb++; inFb = true; } } else inFb = false;
  }
  styles.push({ name:'过去闪回 → 碎片插入', score:Math.max(0, 100 - fb * W.flashbackBlockPenalty), detail:`整段闪回块${fb}处`, tip:'过去只用足以解释现在的长度' });

  const avg = styles.length ? Math.round(styles.reduce((s,st) => s+st.score, 0) / styles.length) : 0;
  return { gaps, styles, stats:res, avgScore:avg };
}

function isAction(s) {
  for (let i = 0; i < ACTION_VERBS.size; i++) { }
  // faster: check against set via manual iteration or any char match
  for (const v of ACTION_VERBS) if (s.includes(v)) return true;
  return false;
}

// ══════════════════════════════════════════════════════════
//  情境引导
// ══════════════════════════════════════════════════════════

const SITUATION_TEMPLATES = {
  timeJump: (g) => `在 L${g.line} 附近跳过了"${g.text.slice(0,24)}"这段时间。这段时间里——房间里有什么声音？光线有变化吗？角色即使只是坐着，也有一具身体在时间里。`,
  dialogGap: (g) => `L${g.line} 的对白之间有一段沉默未被写。说话的人在开口前做了什么？吞咽了一下？看向了别处？沉默不是空白——它是角色处理情绪的物理时间。`,
  actionGap: (g) => `L${g.line} 的两个动作之间缺少过渡。第一个动作结束时，角色的手在哪？呼吸节奏怎样？半秒钟——够一个人改变主意，也够一个人下定决心。`,
  povGap: (g) => `L${g.line} 附近发生了视角切换。切换前的最后一个瞬间——那个角色看到了什么？感受到了什么？视角切换不是剪辑，是接力。`,
  transitionGap: (g) => `L${g.line} ${g.detail}。这段被压缩的时间里发生了什么？把它展开，让读者体验每一秒。`,
};

function generateSituations(gaps) {
  const seen = new Set();
  return gaps.filter(g => g.score >= 2 && !seen.has(g.type + '|' + g.line) && seen.add(g.type + '|' + g.line))
    .slice(0, 4)
    .map(g => {
      const fn = SITUATION_TEMPLATES[g.type];
      return fn ? fn(g) : null;
    })
    .filter(Boolean);
}

// ══════════════════════════════════════════════════════════
//  渲染工具
// ══════════════════════════════════════════════════════════

function renderMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = html.split('\n');
  const out = [];
  let inBlock = false;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let handled = false;
    // block-level
    const m6 = l.match(/^###### (.+)/);
    if (m6) { out.push('<h6>'+m6[1]+'</h6>'); continue; }
    const m5 = l.match(/^##### (.+)/);
    if (m5) { out.push('<h5>'+m5[1]+'</h5>'); continue; }
    const m4 = l.match(/^#### (.+)/);
    if (m4) { out.push('<h4>'+m4[1]+'</h4>'); continue; }
    const m3 = l.match(/^### (.+)/);
    if (m3) { out.push('<h3>'+m3[1]+'</h3>'); continue; }
    const m2 = l.match(/^## (.+)/);
    if (m2) { out.push('<h2>'+m2[1]+'</h2>'); continue; }
    const m1 = l.match(/^# (.+)/);
    if (m1) { out.push('<h1>'+m1[1]+'</h1>'); continue; }
    const bq = l.match(/^> (.+)/);
    if (bq) {
      if (!inBlock) { out.push('<blockquote>'); inBlock = true; }
      out.push('<p>'+inlineMd(bq[1])+'</p>');
      continue;
    }
    if (inBlock) { out.push('</blockquote>'); inBlock = false; }
    const hr = l.match(/^---+$/);
    if (hr) { out.push('<hr>'); continue; }
    if (l.trim() === '') { out.push(''); continue; }
    out.push('<p>'+inlineMd(l)+'</p>');
  }
  if (inBlock) out.push('</blockquote>');
  return out.join('\n');
}

function inlineMd(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

//  UI
// ══════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);

function onEdit() {
  const text = $('editor').value;
  state.text = text;
  updateStats(text);
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(() => {
    localStorage.setItem('write_poc_text', text);
    $('statSave').textContent = '已保存';
  }, 500);
  // 清除旧的 gutter 标记（分析由 doPhase 触发）
  renderGutter([]);
}

function updateStats(text) {
  $('statWords').textContent = text.length;
  $('statLines').textContent = text.split('\n').length;
}

// ─── 3R 阶段推进 ──────────────────────────────────────

function doPhase(phase) {
  const text = $('editor').value;
  if (!text.trim()) { alert('请先输入文本'); return; }

  const dualPov = $('chkDualPov').checked;
  const result = analyze(text, dualPov);
  state.text = text;
  state.gaps = result.gaps;
  state.styles = result.styles;
  state.score = result.avgScore;
  state.phase = phase;

  if (phase === PHASES.REVIEW) {
    if (!state.cycle) state.cycle = 1;
    state.phaseStart = Date.now();
    // 完成评审 → 启用反思
    $('btnReflect').disabled = false;
    $('btnReflect').style.opacity = '1';
    $('btnReview').classList.add('btn-done');
    localStorage.setItem('write_poc_text', text);
    $('statSave').textContent = '已保存';
  }

  if (phase === PHASES.REFLECT) {
    // 完成反思 → 启用下一轮
    $('btnNextCycle').disabled = false;
    $('btnNextCycle').style.opacity = '1';
    $('btnReflect').classList.add('btn-done');
  }

  if (phase === PHASES.REWRITE) {
    state.cycle++;
    const dur = state.phaseStart ? Math.round((Date.now() - state.phaseStart) / 1000) + 's' : '—';
    state.history.push({ cycle:state.cycle, score:result.avgScore, gaps:result.gaps.length, duration:dur });
    state.phaseStart = Date.now();
    $('btnNextCycle').disabled = true;
    $('btnNextCycle').style.opacity = '.4';
    $('btnReview').classList.remove('btn-done');
    $('btnReflect').classList.remove('btn-done');
    updateHistory();
    localStorage.setItem('write_poc_text', text);
    $('statSave').textContent = '已保存';
  }

  renderGutter(result.gaps);
  renderReview(result);
  renderSituations(result.gaps);
  renderDashboard();
}

// ─── gutter 渲染 ───────────────────────────────────────

function renderGutter(gaps) {
  const gutter = $('gutter');
  gutter.innerHTML = '';
  $('headerGapCount').textContent = gaps.length;

  if (!gaps.length) return;

  const lineH = 1.8 * 15; // line-height * font-size
  const lineStart = 16;   // padding-top

  // 按行合并
  const byLine = {};
  for (const g of gaps) {
    if (!byLine[g.line]) byLine[g.line] = { line:g.line, best:g.score, items:[] };
    byLine[g.line].items.push(g);
    if (g.score > byLine[g.line].best) byLine[g.line].best = g.score;
  }

  for (const key in byLine) {
    const entry = byLine[key];
    const dot = document.createElement('div');
    dot.className = 'gutter-dot g' + entry.best;
    dot.dataset.line = entry.line;
    dot.title = entry.items.map(g => `[${g.type}] ${g.detail}`).join('\n');
    dot.style.top = (lineStart + (entry.line - 1) * lineH + 4) + 'px';

    dot.addEventListener('click', () => {
      // 滚动编辑区到对应行
      const textarea = $('editor');
      const lines = textarea.value.split('\n');
      let targetPos = 0;
      for (let i = 0; i < Math.min(entry.line - 1, lines.length); i++) {
        targetPos += lines[i].length + 1;
      }
      textarea.focus();
      textarea.setSelectionRange(targetPos, targetPos);
      textarea.scrollTop = (entry.line - 1) * lineH - 60;
    });

    // 悬停 tooltip
    dot.addEventListener('mouseenter', (e) => {
      const tip = $('gap-tooltip');
      const typeLabels = { timeJump:'时间跳跃', dialogGap:'对话间隙', actionGap:'动作间空隙', transitionGap:'过渡压缩', povGap:'视角切换' };
      const html = entry.items.map(g =>
        `<div class="tip-type g${g.score}">${typeLabels[g.type] || g.type}</div><div>L${g.line}: ${g.detail}</div>`
      ).join('<hr style="margin:4px 0;border-color:var(--border)">');
      tip.innerHTML = html;
      const rect = e.target.getBoundingClientRect();
      tip.style.left = (rect.right + 8) + 'px';
      tip.style.top = (rect.top - 10) + 'px';
      tip.classList.add('visible');
    });
    dot.addEventListener('mouseleave', () => { $('gap-tooltip').classList.remove('visible'); });

    gutter.appendChild(dot);
  }
}

// ─── 评审报告渲染 ──────────────────────────────────────

function renderReview(result) {
  const cont = $('reviewContent');
  $('statGaps').textContent = result.gaps.length;
  $('dashScore').textContent = result.avgScore + '/100';

  let html = '';

  if (result.gaps.length) {
    html += '<div style="font-size:12px;font-weight:600;margin-bottom:4px">空隙</div>';
    const typeL = { timeJump:'时间跳跃', dialogGap:'对话间隙', actionGap:'动作间空隙', transitionGap:'过渡压缩', povGap:'视角切换' };
    for (const g of result.gaps.slice(0, 10)) {
      const dot = g.score === 3 ? '🟢' : g.score === 2 ? '🟡' : '🔴';
      html += `<div class="gap-item" data-line="${g.line}"><span class="dot">${dot}</span><div><span class="label">${typeL[g.type]||g.type}</span><div class="gap-detail">L${g.line}: ${g.text.slice(0,28)}</div></div></div>`;
    }
    if (result.gaps.length > 10) html += `<div style="font-size:11px;color:var(--text-dim);margin-top:2px">...还有${result.gaps.length-10}处</div>`;
  }

  html += '<div style="font-size:12px;font-weight:600;margin:8px 0 4px">风格</div>';
  for (const s of result.styles) {
    const cls = s.score >= 70 ? 'good' : s.score >= 40 ? 'ok' : 'bad';
    html += `<div class="score-bar"><span style="min-width:100px;flex-shrink:0">${s.name}</span><div class="bar-wrap"><div class="bar-fill ${cls}" style="width:${s.score}%"></div></div><span class="score-val">${s.score}%</span></div>`;
  }

  html += `<div style="font-size:13px;font-weight:600;margin-top:8px">综合: ${result.avgScore}/100</div>`;

  const weak = [...result.styles].sort((a,b) => a.score - b.score)[0];
  if (weak) html += `<div style="font-size:12px;color:var(--text-dim);margin-top:6px;padding:6px;background:var(--surface2);border-radius:4px">优先: ${weak.name} (${weak.score}%) — ${weak.tip}</div>`;

  cont.innerHTML = html;

  // gap-item 点击跳转到编辑器对应行
  cont.querySelectorAll('.gap-item').forEach(el => {
    el.addEventListener('click', () => {
      const line = parseInt(el.dataset.line);
      if (!line) return;
      const textarea = $('editor');
      const lines = textarea.value.split('\n');
      let pos = 0;
      for (let i = 0; i < Math.min(line - 1, lines.length); i++) pos += lines[i].length + 1;
      textarea.focus();
      textarea.setSelectionRange(pos, pos);
    });
  });
}

function renderSituations(gaps) {
  const sit = generateSituations(gaps);
  const el = $('situationText');
  el.innerHTML = sit.length
    ? sit.slice(0, 3).map((s, i) => `<strong>#${i+1}</strong>\n${s}`).join('\n\n——\n\n')
    : '当前未检测到可引导的空隙。';
}

function renderDashboard() {
  $('dashCycle').textContent = state.cycle || 1;
  document.querySelectorAll('#phaseGrid .phase-item').forEach(el => {
    el.classList.toggle('active', el.dataset.phase === state.phase);
  });
  const badge = $('phaseBadge');
  badge.className = 'phase-badge ' + state.phase;
  $('phaseLabel').textContent = state.phase.charAt(0).toUpperCase() + state.phase.slice(1);
  $('cycleLabel').textContent = state.cycle ? `#${state.cycle}` : '—';
}

function updateHistory() {
  const el = $('historyLog');
  if (!state.history.length) { el.innerHTML = '<span style="opacity:.5">暂无记录</span>'; return; }
  el.innerHTML = state.history.map((h,i) => `<div>第${i+1}轮 | ${h.score}/100 | ${h.gaps}空隙 | ${h.duration||'—'}</div>`).join('');
}

let mode = 'edit';

function loadSample() {
  $('editor').value = SAMPLE;

  doPhase('review');
}

function clearText() {
  if (!confirm('清空？')) return;
  $('editor').value = '';
  state = { text:'', gaps:[], styles:[], score:null, cycle:0, phase:PHASES.REVIEW, phaseStart:null, history:[] };
  $('reviewContent').innerHTML = '<div class="empty-state"><div class="icon">📊</div><span>等待评审...</span></div>';
  $('situationText').textContent = '输入文本并点击「评审」查看情境引导。';
  $('statGaps').textContent = '0';
  $('dashScore').textContent = '—';
  $('headerGapCount').textContent = '0';
  renderGutter([]);
  renderDashboard();
  updateHistory();
  updateStats('');
  $('btnReview').classList.remove('btn-done');
  $('btnReflect').classList.remove('btn-done');
  $('btnNextCycle').disabled = true;
  $('btnNextCycle').style.opacity = '.4';
}

// ══════════════════════════════════════════════════════════
//  面板拖动
// ══════════════════════════════════════════════════════════

function initResize(handleId, targetId, isRight) {
  const handle = $(handleId);
  const target = $(targetId);
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = target.offsetWidth;
    handle.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const delta = ev.clientX - startX;
      const newW = isRight ? startW - delta : startW + delta;
      if (newW >= 100 && newW <= 600) {
        target.style.width = newW + 'px';
        // 同步更新 grid
        const grid = $('main');
        if (isRight) grid.style.gridTemplateColumns = 'var(--panel-w) 1fr ' + newW + 'px';
        else grid.style.gridTemplateColumns = newW + 'px 1fr var(--situ-w)';
      }
    }
    function onUp() {
      handle.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

initResize('handleLeft', 'project-panel', false);
initResize('handleRight', 'situation-panel', true);

// ══════════════════════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('write_poc_text');
  if (saved) { $('editor').value = saved; onEdit(); }
  renderDashboard();
  updateHistory();
  $('btnReflect').disabled = true;
  $('btnReflect').style.opacity = '.4';
});
</script>
