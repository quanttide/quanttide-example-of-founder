<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 5: 情境引导</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b1e;--surface:#25262b;--surface2:#2c2e33;--border:#373a40;--text:#c1c2c5;--text-dim:#909296;--accent:#7c9bff}
body{font:14px/1.6 -apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#app{width:420px;background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:24px}
h1{font-size:16px;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
h1 small{font-weight:400;font-size:12px;color:var(--text-dim)}
h2{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px;margin-top:16px}
h2:first-child{margin-top:0}
.situation-card{padding:14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:10px;cursor:pointer;transition:all .15s}
.situation-card:hover{border-left-color:#9bb5ff;background:#323438}
.situation-card .num{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
.situation-card .body{font-size:13px;line-height:1.7;white-space:pre-wrap}
.situation-card .body .hl{color:var(--accent)}
.situation-card.active{border-left-color:#fff;box-shadow:0 0 8px rgba(124,155,255,.2)}
#gapRef{font-size:12px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#gapRef .tag{padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text-dim)}
#gapRef .tag.s3{border-left:2px solid var(--accent)}
#gapRef .tag.s2{border-left:2px solid #ffd43b}
#nav{display:flex;gap:8px;margin-top:8px}
#nav button{flex:1;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer}
#nav button:hover{background:var(--border)}
#nav button:disabled{opacity:.3;cursor:default}
#status{font-size:12px;color:var(--text-dim);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <h1>🎯 创作情境 <small>交互原型</small></h1>
  <div id="gapRef"><span class="tag s3">🟢 高可写性</span><span class="tag s2">🟡 中可写性</span></div>
  <div id="situationContainer"></div>
  <div id="nav">
    <button id="prevBtn" onclick="nav(-1)" disabled>‹ 上一条</button>
    <button id="nextBtn" onclick="nav(1)">下一条 ›</button>
  </div>
  <div id="status">1 / 3</div>
</div>
<script>
// 演示情境引导数据
const SITUATIONS = [
  {
    label: '动作间空隙',
    body: [ 'L7 的两个动作之间缺少过渡。',
      '第一个动作结束时，角色的手在哪？呼吸节奏是怎样的？',
      '半秒钟——够一个人改变主意，也够一个人下定决心。' ]
  },
  {
    label: '对话间隙',
    body: [ 'L12 的对白之间有一段沉默未被写。',
      '说话的人在开口前做了什么？吞咽了一下？看向了别处？',
      '沉默不是空白——它是角色正在处理情绪的物理时间。' ]
  },
  {
    label: '时间跳跃',
    body: [ '在 L3 附近跳过了"第二天清晨"这段时间。',
      '这段时间里——房间里有什么声音？光线有变化吗？',
      '角色即使只是坐着，也有一具身体在时间里。' ]
  },
];

let current = 0;

function render(idx) {
  const container = document.getElementById('situationContainer');
  const s = SITUATIONS[idx];
  const cards = SITUATIONS.map((sit, i) => `
    <div class="situation-card ${i === idx ? 'active' : ''}" onclick="jumpTo(${i})">
      <div class="num">#${i + 1} — ${sit.label}</div>
      <div class="body">${sit.body.join('\n')}</div>
    </div>
  `).join('');
  container.innerHTML = cards;
  document.getElementById('status').textContent = `${idx + 1} / ${SITUATIONS.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === SITUATIONS.length - 1;
}

function nav(dir) {
  const next = Math.max(0, Math.min(SITUATIONS.length - 1, current + dir));
  if (next !== current) { current = next; render(current); }
}

function jumpTo(idx) {
  current = idx;
  render(current);
}

render(0);
</script>
</body>
</html>
