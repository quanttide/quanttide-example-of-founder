<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 5: 情境看板（Reflect）</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b1e;--surface:#25262b;--surface2:#2c2e33;--border:#373a40;--text:#c1c2c5;--text-dim:#909296;--accent:#7c9bff}
body{font:14px/1.6 -apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#card{width:360px;background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden}
#bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px}
#bar .phase{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#2b4a2e;color:#69db7c}
#bar .spacer{flex:1}
#bar .count{color:var(--text-dim)}
#content{padding:16px}
h2{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.8px;margin-bottom:8px}
.situation-text{font-size:13px;line-height:1.7;color:var(--text);padding:12px 14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);white-space:pre-wrap;margin-bottom:12px}
.gap-ref{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gap-ref .tag{padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text-dim);border-left:2px solid}
.gap-ref .tag.s3{border-left-color:var(--accent)}
.gap-ref .tag.s2{border-left-color:#ffd43b}
.action{padding:8px 12px;border-radius:6px;border:1px solid var(--accent);background:none;color:var(--accent);font-size:12px;cursor:pointer;width:100%;text-align:center}
.action:hover{background:var(--surface2)}
#status{font-size:11px;color:var(--text-dim);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="card">
  <div id="bar">
    <span class="phase">Reflect</span>
    <span class="spacer"></span>
    <span class="count">3 个空隙可引导</span>
  </div>
  <div id="content">
    <h2>基于空隙的情境引导</h2>
    <div class="gap-ref">
      <span class="tag s3">🟢 动作空隙</span>
      <span class="tag s3">🟢 时间跳跃</span>
      <span class="tag s2">🟡 对话间隙</span>
    </div>
    <div class="situation-text" id="guideText">点击下方按钮切换演示引导。</div>
    <button class="action" onclick="nextGuide()">进入场景 →</button>
    <div id="status">引导 1 / 3</div>
  </div>
</div>
<script>
const GUIDES = [
  {
    tag: '动作空隙',
    text: 'L7 的两个动作之间缺少过渡。\n第一个动作结束时，角色的手在哪？呼吸节奏是怎样的？\n半秒钟——够一个人改变主意，也够一个人下定决心。',
  },
  {
    tag: '时间跳跃',
    text: '在 L3 附近跳过了"第二天清晨"这段时间。\n房间里有什么声音？光线有变化吗？\n角色即使只是坐着，也有一具身体在时间里。',
  },
  {
    tag: '对话间隙',
    text: 'L12 的对白之间有一段沉默未被写。\n说话的人在开口前做了什么？吞咽了一下？看向了别处？\n沉默不是空白——它是角色正在处理情绪的物理时间。',
  },
];

let idx = 0;

function nextGuide() {
  idx = (idx + 1) % GUIDES.length;
  document.getElementById('guideText').textContent = GUIDES[idx].text;
  document.getElementById('status').textContent = '引导 ' + (idx + 1) + ' / ' + GUIDES.length;
}

document.getElementById('guideText').textContent = GUIDES[0].text;
</script>
</body>
</html>
