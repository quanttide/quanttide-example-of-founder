entries:
  - source: worldbuilding/demo
    text: |
      灰星纪 317 年，第七季风刚过。

      悬空城塞 "鸦巢" 悬浮在碎星群岛最东端的裂谷上空，铁链缆绳被季风吹得猎猎作响。城主埃莉斯站在观星台边缘，俯视下方翻涌的雾海。三百年前，初代城主在此钉下第一根星锚，用祈星术从虚空中拉出这座城塞——如今星锚已经锈蚀，裂纹爬满符文。

      "锚链还能撑两个雨季。"军需官维托低声说，"矿脉快枯竭了。"

      埃莉斯没有回答。她知道问题的根源不在于铁矿——而在于祈星术本身的衰退。这个纪元以来，群星之力逐年衰减，所有依赖星能的城塞都面临崩塌。但鸦巢不能倒。这里是碎星群岛抵御海兽的最后屏障。

      "召会议事团。我要启动'深空观测'。"

      维托脸色一白。"大人，深空观测会消耗三年份的星能储备。如果——"

      "如果不做，我们连三个月都撑不过。"

      当天深夜，议事团的争论声在鸦巢的玄武岩大厅里回荡了一整夜。老学者坚称深空观测是禁忌——上一座试图窥探群星之秘的城塞 "银渊"，在五十年前化为了陨坑。但军需派和渔民派站在城主一边。

      表决结果：七票赞成，四票反对。

      观测仪式在鸦巢最底层的星能核心室举行。埃莉斯割破手掌，让血液滴入核心的符文凹槽。蓝色的星光从凹槽中涌出，沿着墙壁的纹路攀升。整个城塞开始共鸣，铁链震颤，碎石从天花板簌簌落下。

      在星光达到最盛的那一刻，埃莉斯看到了虚空深处的东西。

      那不是星——那是一双眼睛。

      她猛地收回手，符文黯淡下去。大厅恢复了寂静，只剩下她急促的呼吸声。

      "大人？"维托的声音从门外传来，"观测成功了吗？"

      埃莉斯看着自己掌心的伤口，那道痕迹正在以肉眼可见的速度愈合——和群星衰竭的速度一样快，一样不可逆转。

      "成功了。"她说，"但我看到的不是群星。"

      她没有说出后半句：群星从来都不是星——它们是某种巨大存在的鳞片，而那东西正在苏醒。

      三日后，悬空城塞的符文阵图上出现了第一条裂痕。
