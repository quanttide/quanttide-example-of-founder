<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>前传纠缠深度</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, "Microsoft YaHei", sans-serif;
                background: #f8f9fa;
                padding: 40px;
            }
            h1 {
                text-align: center;
                color: #333;
                font-size: 22px;
            }
            .subtitle {
                text-align: center;
                color: #888;
                font-size: 13px;
                margin: 4px 0 24px;
            }
            .nav {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-bottom: 24px;
            }
            .nav a {
                padding: 6px 14px;
                border-radius: 6px;
                font-size: 13px;
                text-decoration: none;
                color: #888;
                background: #eee;
            }
            .nav a.active {
                background: #333;
                color: #fff;
            }
            .chart-wrap {
                background: #fff;
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
                padding: 24px;
                max-width: 1060px;
                margin: 0 auto;
            }
            svg {
                display: block;
                margin: 0 auto;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 12px;
                color: #666;
                margin-top: 16px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .legend-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }
            .tooltip {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                opacity: 0;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <h1>前传纠缠深度</h1>
        <p class="subtitle">每个前传连接哪些现在场景、纠缠深度</p>
        <div class="nav">
            <a href="axes.html">主题轴</a>
            <a href="techniques.html">手法</a>
            <a href="carriers.html">情感载体</a>
            <a href="prequels.html" class="active">前传</a>
        </div>
        <div class="chart-wrap">
            <div id="chart"></div>
            <div class="legend" id="legend"></div>
        </div>
        <div class="tooltip" id="tooltip"></div>

        <script>
            (async function () {
                const r = await fetch("thematic-analysis.json");
                const data = await r.json();

                const sceneIds = data.scenes.map((s) => s.id);
                const sceneNames = {};
                data.scenes.forEach((s) => (sceneNames[s.id] = s.name));

                // Build prequel rows from JSON
                const depthColors = {
                    独白式: "#A29BFE",
                    延迟揭示: "#FDCB6E",
                    回响式: "#E17055",
                    背景式: "#74B9FF",
                };
                const depthLabels = {
                    独白式: "单次引用",
                    延迟揭示: "多次揭示",
                    回响式: "反复回响",
                    背景式: "持续底色",
                };

                const prequelRows = data.prequels.map((p) => ({
                    id: p.id,
                    name: p.name,
                    det: p.name,
                    d: p.depth,
                    c: depthColors[p.depth] || "#A29BFE",
                    targets: p.refBy
                        ? p.refBy
                              .map((id) => sceneIds.indexOf(id))
                              .filter((i) => i >= 0)
                        : [],
                }));
                // Also add entanglement-based targets from scene data
                data.scenes.forEach((sc) => {
                    if (!sc.prequelEntanglement) return;
                    sc.prequelEntanglement.forEach((pe) => {
                        const row = prequelRows.find((r) => r.id === pe.id);
                        if (
                            row &&
                            !row.targets.includes(sceneIds.indexOf(sc.id))
                        ) {
                            row.targets.push(sceneIds.indexOf(sc.id));
                        }
                    });
                });
                // Remove P5 duplicate in 10_1 if needed, and sort
                prequelRows.forEach((r) => {
                    r.targets = [...new Set(r.targets)].sort((a, b) => a - b);
                });

                const W = 1000,
                    H = 340,
                    M = { t: 30, l: 160, r: 30, b: 20 };
                const IW = W - M.l - M.r;
                const sx = sceneIds.map(
                    (_, i) => M.l + (i / (sceneIds.length - 1)) * IW,
                );

                const svg = d3
                    .select("#chart")
                    .append("svg")
                    .attr("width", W)
                    .attr("height", H);
                const tip = d3.select("#tooltip");

                // Scene column headers
                sceneIds.forEach((id, i) => {
                    const x = sx[i];
                    svg.append("line")
                        .attr("x1", x)
                        .attr("y1", M.t - 2)
                        .attr("x2", x)
                        .attr("y2", M.t + prequelRows.length * 40 + 8)
                        .attr("stroke", "#f0f0f0")
                        .attr("stroke-width", 0.5);
                    svg.append("text")
                        .attr("x", x)
                        .attr("y", M.t - 6)
                        .attr("text-anchor", "middle")
                        .attr("font-size", 9)
                        .attr("fill", "#999")
                        .text(id);
                });

                prequelRows.forEach((p, pi) => {
                    const y = M.t + 14 + pi * 40;
                    svg.append("rect")
                        .attr("x", M.l - 12)
                        .attr("y", y - 8)
                        .attr("width", 4)
                        .attr("height", 20)
                        .attr("fill", p.c)
                        .attr("rx", 2);
                    svg.append("text")
                        .attr("x", M.l - 18)
                        .attr("y", y + 4)
                        .attr("text-anchor", "end")
                        .attr("font-size", 12)
                        .attr("fill", "#333")
                        .attr("font-weight", "bold")
                        .text(`${p.id} ${p.name}`);
                    svg.append("text")
                        .attr("x", M.l - 18)
                        .attr("y", y + 18)
                        .attr("text-anchor", "end")
                        .attr("font-size", 9)
                        .attr("fill", "#aaa")
                        .text(depthLabels[p.d]);

                    p.targets.forEach((ti) => {
                        const x = sx[ti];
                        svg.append("line")
                            .attr("x1", M.l - 8)
                            .attr("y1", y)
                            .attr("x2", x)
                            .attr("y2", y)
                            .attr("stroke", p.c)
                            .attr("stroke-width", 1.5)
                            .attr("stroke-dasharray", "4,3")
                            .attr("opacity", 0.4);
                        svg.append("circle")
                            .attr("cx", x)
                            .attr("cy", y)
                            .attr("r", 4)
                            .attr("fill", p.c)
                            .attr("opacity", 0.6);
                    });

                    const ft = p.targets[0];
                    if (ft !== undefined) {
                        svg.append("text")
                            .attr("x", sx[ft] + 8)
                            .attr("y", y + 4)
                            .attr("font-size", 10)
                            .attr("fill", p.c)
                            .text(sceneNames[sceneIds[ft]]);
                    }

                    svg.append("rect")
                        .attr("x", M.l - 20)
                        .attr("y", y - 10)
                        .attr("width", IW + 10)
                        .attr("height", 24)
                        .attr("fill", "transparent")
                        .on("mouseenter", () => {
                            const ts = p.targets
                                .map((t) => sceneIds[t])
                                .join(", ");
                            tip.style("opacity", 1)
                                .html(
                                    `<b>${p.id} ${p.name}</b><br>${depthLabels[p.d]}<br>出现在：${ts}`,
                                )
                                .style("left", d3.event.pageX + 12 + "px")
                                .style("top", d3.event.pageY - 10 + "px");
                        })
                        .on("mouseleave", () => tip.style("opacity", 0));
                });

                d3.select("#legend").html(
                    Object.entries(depthLabels)
                        .map(
                            ([k, v]) =>
                                `<span class="legend-item"><span class="legend-dot" style="background:${depthColors[k]}"></span> ${k}（${v}）</span>`,
                        )
                        .join(""),
                );
            })();
        </script>
    </body>
</html>
