<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景主题分析</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f8f9fa; padding: 32px; }
h1 { text-align: center; color: #333; font-size: 22px; margin-bottom: 4px; }
.subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
.panel { background: #fff; border-radius: 10px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); margin-bottom: 20px; padding: 20px; }
.panel h2 { font-size: 15px; color: #555; margin-bottom: 12px; font-weight: 600; }
.legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #666; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-line { width: 24px; height: 2px; }
</style>
</head>
<body>

<h1>场景主题分析</h1>
<p class="subtitle">创作主题：两个互相暗恋了十年的人，如何从各自孤独的位置走到一起</p>

<div id="panel-axes" class="panel">
  <h2>主题轴推进</h2>
  <div id="chart-axes"></div>
</div>

<div id="panel-techniques" class="panel">
  <h2>手法生命周期</h2>
  <div id="chart-techniques"></div>
</div>

<div id="panel-carrier" class="panel">
  <h2>情感载体流转</h2>
  <div id="chart-carrier"></div>
</div>

<div id="panel-prequel" class="panel">
  <h2>前传纠缠深度</h2>
  <div id="chart-prequel"></div>
</div>

<script>
// ===================== DATA (from thematic-analysis.json) =====================
const themeAxes = [
  { id: "solitude", label: "孤独 → 陪伴", stages: ["独自承受\n无人知晓", "被看见\n不敢回应", "被看见\n得到回应", "共同面对"], colors: ["#74B9FF", "#55E6C1", "#FDCB6E", "#E17055"] },
  { id: "guess", label: "猜测 → 确认", stages: ["完全不知\n对方心意", "隐约有感觉\n不敢信", "细节确认\n蛛丝马迹", "双方明确"], colors: ["#A29BFE", "#6C5CE7", "#FD79A8", "#E17055"] },
  { id: "lookup", label: "仰望 → 并肩", stages: ["对方是\n传说/偶像", "看到对方\n真实一面", "看到对方\n的脆弱", "互相扶持\n平等关系"], colors: ["#81ECEC", "#74B9FF", "#FDCB6E", "#55E6C1"] },
];

const scenes = [
  { id: "1_1", name: "咖啡厅重逢", pos: [0, 1, 0], techSetup: ["物件反复", "伪装巧合"], techRelease: [] },
  { id: "1_2", name: "深夜失眠", pos: [0, 1, 0], techSetup: [], techRelease: [] },
  { id: "2_1", name: "展会再遇", pos: [0, 1, 0], techSetup: [], techRelease: [] },
  { id: "2_3", name: "傍晚小龙虾", pos: [0, 1, 1], techSetup: [], techRelease: [] },
  { id: "4_1", name: "便利店谈心", pos: [1, 1, 1], techSetup: [], techRelease: [] },
  { id: "4_2", name: "夜市约会", pos: [2, 2, 1], techSetup: [], techRelease: ["伪装巧合"] },
  { id: "4_3", name: "互相问早", pos: [2, 2, 1], techSetup: [], techRelease: [] },
  { id: "5_1", name: "家里吃火锅", pos: [2, 2, 1], techSetup: [], techRelease: ["物件反复"] },
  { id: "6_2", name: "海边散步", pos: [1, 2, 1], techSetup: ["场景对照"], techRelease: [] },
  { id: "7_1", name: "酒吧表白", pos: [3, 3, 2], techSetup: [], techRelease: [] },
  { id: "7_2", name: "公园拥抱", pos: [3, 3, 2], techSetup: [], techRelease: [] },
  { id: "8_1", name: "海边再散步", pos: [3, 3, 3], techSetup: [], techRelease: ["场景对照"] },
  { id: "10_1", name: "书房陪伴", pos: [3, 3, 3], techSetup: [], techRelease: ["延迟揭示"] },
  { id: "10_2", name: "客厅看剧", pos: [3, 3, 3], techSetup: [], techRelease: [] },
  { id: "10_3", name: "阳台看星星", pos: [3, 3, 3], techSetup: [], techRelease: [] },
];

const techniques = [
  { name: "物件反复", setup: "1_1", release: "5_1", gap: 5 },
  { name: "伪装巧合", setup: "1_1", release: "4_2", gap: 3 },
  { name: "场景对照", setup: "6_2", release: "8_1", gap: 2 },
  { name: "延迟揭示", setup: "1_1", release: "10_1", gap: 9 },
];

const carriers = [
  { from: "1_1", to: "5_1", label: "Hello Kitty", type: "物件", fromCarrier: "行李箱贴纸", toCarrier: "拖鞋" },
  { from: "1_1", to: "4_2", label: "伪装巧合", type: "信息" },
  { from: "4_1", to: "4_2", label: "勇气", type: "情感" },
  { from: "4_2", to: "4_3", label: "联结仪式", type: "情感" },
  { from: "6_2", to: "8_1", label: "海边记忆", type: "场景对照" },
  { from: "7_1", to: "7_2", label: "坦白→拥抱", type: "情感" },
  { from: "7_2", to: "8_1", label: "牵手", type: "情感" },
  { from: "8_1", to: "10_1", label: "心结解开", type: "情感" },
  { from: "10_1", to: "10_2", label: "日常", type: "情感" },
  { from: "10_2", to: "10_3", label: "日常延续", type: "情感" },
  { from: "1_1", to: "10_1", label: "日记本→信", type: "延迟揭示" },
];

const prequels = [
  { id: "P1", name: "毕业晚会", targets: ["1_2", "6_2"], depth: "独白式", color: "#A29BFE" },
  { id: "P2", name: "公开演讲", targets: ["4_1"], depth: "独白式", color: "#A29BFE" },
  { id: "P3", name: "大四聚餐", targets: ["5_1"], depth: "独白式", color: "#A29BFE" },
  { id: "P4", name: "海边深夜", targets: ["1_1", "6_2", "8_1"], depth: "延迟揭示", color: "#FDCB6E" },
  { id: "P5", name: "醉酒坦白", targets: ["1_1", "7_1", "10_1"], depth: "回响式", color: "#E17055" },
  { id: "P6", name: "朋友圈十年", targets: ["1_1", "4_2"], depth: "背景式", color: "#74B9FF" },
  { id: "P7", name: "读他的代码", targets: ["2_1"], depth: "独白式", color: "#A29BFE" },
];

const sceneIds = scenes.map(s => s.id);
const sceneNames = scenes.map(s => s.name);
const xScale = (i, total, margin, w) => margin + (i / (total - 1)) * (w - 2 * margin);

// ===================== PANEL 1: Theme Axis Progression =====================
(function(){
  const w = 1060, h = 260, m = { top: 30, left: 110, right: 40, bottom: 20 };
  const innerW = w - m.left - m.right;
  const innerH = (h - m.top - m.bottom) / 3;

  const svg = d3.select("#chart-axes").append("svg").attr("width", w).attr("height", h);

  themeAxes.forEach((axis, ai) => {
    const y0 = m.top + ai * innerH;
    const y1 = m.top + (ai + 1) * innerH;
    const midY = (y0 + y1) / 2;

    // Axis label
    svg.append("text").attr("x", m.left - 10).attr("y", midY + 4)
      .attr("text-anchor", "end").attr("font-size", 12).attr("fill", "#555")
      .attr("font-weight", "bold").text(axis.label);

    // Stage bands
    const bandW = innerW / axis.stages.length;
    axis.stages.forEach((stage, si) => {
      const bx = m.left + si * bandW;
      svg.append("rect").attr("x", bx).attr("y", y0 + 6).attr("width", bandW).attr("height", innerH - 12)
        .attr("fill", axis.colors[si]).attr("opacity", 0.08).attr("rx", 4);

      // Stage label (first and last only, to save space)
      if (si === 0 || si === axis.stages.length - 1) {
        const lines = stage.split("\n");
        lines.forEach((line, li) => {
          svg.append("text").attr("x", bx + (si === 0 ? 6 : bandW - 6)).attr("y", y0 + 20 + li * 16)
            .attr("text-anchor", si === 0 ? "start" : "end").attr("font-size", 10).attr("fill", axis.colors[si])
            .attr("font-weight", "500").text(line);
        });
      }
    });

    // Scene position dots
    scenes.forEach((sc, i) => {
      const x = m.left + (i / (scenes.length - 1)) * innerW;
      const stageIdx = sc.pos[ai];
      const dotY = y0 + 6 + (innerH - 12) * ((stageIdx + 0.5) / axis.stages.length);

      svg.append("circle").attr("cx", x).attr("cy", dotY).attr("r", 5)
        .attr("fill", axis.colors[stageIdx]).attr("stroke", "#fff").attr("stroke-width", 1.5)
        .attr("opacity", 0.85);

      // Scene ID label (only for axis 0 to avoid clutter)
      if (ai === 0) {
        svg.append("text").attr("x", x).attr("y", y0 + innerH + 14)
          .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#999")
          .text(sc.id);
      }
    });
  });

  // Tooltip
  const tooltip = d3.select("body").append("div")
    .style("position", "absolute").style("background", "rgba(0,0,0,0.85)").style("color", "#fff")
    .style("padding", "8px 12px").style("border-radius", "6px").style("font-size", "12px")
    .style("line-height", "1.5").style("pointer-events", "none").style("opacity", 0)
    .style("z-index", 100);

  svg.selectAll("circle").on("mouseenter", function() {
    const i = svg.selectAll("circle").nodes().indexOf(this);
    const scIdx = i % scenes.length;
    const axisIdx = Math.floor(i / scenes.length);
    if (axisIdx >= 3) return;
    const sc = scenes[scIdx];
    const ax = themeAxes[axisIdx];
    const stageText = ax.stages[sc.pos[axisIdx]].replace("\n", " ");
    tooltip.html(`<b>${sc.id} ${sc.name}</b><br/>${ax.label}: ${stageText}`)
      .style("left", (d3.event.pageX + 12) + "px").style("top", (d3.event.pageY - 10) + "px")
      .style("opacity", 1);
  }).on("mouseleave", () => tooltip.style("opacity", 0));

  // Legend
  const legendEl = document.querySelector("#panel-axes .legend");
  if (!legendEl) {
    const div = document.createElement("div"); div.className = "legend";
    div.innerHTML = `<span style="font-size:12px;color:#888">每个圆点代表一个场景在主题轴上的位置</span>`;
    document.getElementById("panel-axes").appendChild(div);
  }
})();

// ===================== PANEL 2: Technique Lifecycle =====================
(function(){
  const w = 1060, h = 180, m = { top: 16, left: 100, right: 40, bottom: 30 };
  const innerW = w - m.left - m.right;
  const innerH = h - m.top - m.bottom;

  const svg = d3.select("#chart-techniques").append("svg").attr("width", w).attr("height", h);
  const techNames = techniques.map(t => t.name);

  const sceneX = {};
  scenes.forEach((s, i) => { sceneX[s.id] = m.left + (i / (scenes.length - 1)) * innerW; });

  // Technique rows
  techniques.forEach((t, ti) => {
    const y = m.top + (ti + 0.5) / techniques.length * innerH;
    const setupX = sceneX[t.setup];
    const releaseX = sceneX[t.release];

    // Label
    svg.append("text").attr("x", m.left - 10).attr("y", y + 4)
      .attr("text-anchor", "end").attr("font-size", 12).attr("fill", "#555").text(t.name);

    // Background line
    svg.append("line").attr("x1", setupX).attr("y1", y).attr("x2", releaseX).attr("y2", y)
      .attr("stroke", "#ddd").attr("stroke-width", 2);

    // Arrow from setup to release
    const midX = (setupX + releaseX) / 2;
    svg.append("text").attr("x", midX).attr("y", y - 8)
      .attr("text-anchor", "middle").attr("font-size", 10).attr("fill", "#bbb")
      .text(`相隔 ${t.gap} 个场景`);

    // Setup dot (S)
    svg.append("circle").attr("cx", setupX).attr("cy", y).attr("r", 8)
      .attr("fill", "#F5A623").attr("stroke", "#fff").attr("stroke-width", 2);
    svg.append("text").attr("x", setupX).attr("y", y + 4)
      .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", "#fff")
      .attr("font-weight", "bold").text("S");

    // Release dot (R)
    svg.append("circle").attr("cx", releaseX).attr("cy", y).attr("r", 8)
      .attr("fill", "#50B86C").attr("stroke", "#fff").attr("stroke-width", 2);
    svg.append("text").attr("x", releaseX).attr("y", y + 4)
      .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", "#fff")
      .attr("font-weight", "bold").text("R");

    // Scene labels below
    const labelY = h - 6;
    svg.append("text").attr("x", setupX).attr("y", labelY - 4)
      .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#999").text(t.setup);
    svg.append("text").attr("x", releaseX).attr("y", labelY - 4)
      .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#999").text(t.release);

    // Gap arrow pointers
    svg.append("polygon")
      .attr("points", `${releaseX-5},${y-4} ${releaseX+5},${y-4} ${releaseX},${y+4}`)
      .attr("fill", "#50B86C");
  });

  const legendEl = document.querySelector("#panel-techniques .legend");
  if (!legendEl) {
    const div = document.createElement("div"); div.className = "legend";
    div.innerHTML = `
      <span class="legend-item"><span class="legend-dot" style="background:#F5A623"></span> 设伏 (S)</span>
      <span class="legend-item"><span class="legend-dot" style="background:#50B86C"></span> 释放 (R)</span>
    `;
    document.getElementById("panel-techniques").appendChild(div);
  }
})();

// ===================== PANEL 3: Carrier Lineage =====================
(function(){
  const w = 1060, h = 300, m = { top: 10, left: 30, right: 30, bottom: 30 };
  const innerW = w - m.left - m.right;

  const svg = d3.select("#chart-carrier").append("svg").attr("width", w).attr("height", h);
  const sceneX = {};
  scenes.forEach((s, i) => { sceneX[s.id] = m.left + (i / (scenes.length - 1)) * innerW; });

  const sceneY = m.top + 50;

  // Scene nodes
  scenes.forEach((s, i) => {
    const x = sceneX[s.id];
    svg.append("circle").attr("cx", x).attr("cy", sceneY).attr("r", 5)
      .attr("fill", "#bbb").attr("stroke", "#fff").attr("stroke-width", 1.5);
    svg.append("text").attr("x", x).attr("y", sceneY + 16)
      .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#999").text(s.id);
  });

  // Carrier arcs
  const arcTypes = {
    "物件": "#E67E22",
    "信息": "#2980B9",
    "情感": "#27AE60",
    "场景对照": "#8E44AD",
    "延迟揭示": "#C0392B",
  };

  // Group carriers by their from-to pair to handle vertical spacing
  const carrierLayers = {};
  carriers.forEach((c, ci) => {
    const fromIdx = scenes.findIndex(s => s.id === c.from);
    const toIdx = scenes.findIndex(s => s.id === c.to);
    const key = `${fromIdx}-${toIdx}`;
    if (!carrierLayers[key]) carrierLayers[key] = 0;
    const layer = carrierLayers[key];
    carrierLayers[key]++;

    const x1 = sceneX[c.from], x2 = sceneX[c.to];
    const midX = (x1 + x2) / 2;
    const baseMidY = sceneY - 18;
    const offsetY = layer * 14;
    const midY = baseMidY - offsetY;

    // Curve path
    const path = d3.path();
    path.moveTo(x1, sceneY - 5);
    path.quadraticCurveTo(midX, midY, x2, sceneY - 5);

    const color = arcTypes[c.type] || "#999";
    svg.append("path").attr("d", path.toString()).attr("fill", "none")
      .attr("stroke", color).attr("stroke-width", c.type === "延迟揭示" ? 2.5 : 1.5)
      .attr("stroke-dasharray", c.type === "延迟揭示" ? "6,3" : "none")
      .attr("opacity", 0.7);

    // Label on arc
    svg.append("text").attr("x", midX).attr("y", midY - 2)
      .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", color)
      .text(c.label);

    // Detail annotation for object carriers
    if (c.fromCarrier && c.toCarrier) {
      svg.append("text").attr("x", midX).attr("y", midY + 10)
        .attr("text-anchor", "middle").attr("font-size", 8).attr("fill", "#aaa")
        .text(`${c.fromCarrier} → ${c.toCarrier}`);
    }
  });

  // Legend
  const div = document.createElement("div"); div.className = "legend";
  div.innerHTML = Object.entries(arcTypes).map(([k, v]) =>
    `<span class="legend-item"><span class="legend-line" style="background:${v}"></span> ${k}</span>`
  ).join("") + `<span style="font-size:11px;color:#bbb;margin-left:8px">虚线 = 延迟揭示</span>`;
  document.getElementById("panel-carrier").appendChild(div);
})();

// ===================== PANEL 4: Prequel Entanglement =====================
(function(){
  const w = 1060, h = 320, m = { top: 20, left: 100, right: 40, bottom: 20 };
  const innerW = w - m.left - m.right;

  const svg = d3.select("#chart-prequel").append("svg").attr("width", w).attr("height", h);
  const sceneX = {};
  scenes.forEach((s, i) => { sceneX[s.id] = m.left + (i / (scenes.length - 1)) * innerW; });

  const prequelY = {};
  const depthColors = { "独白式": "#A29BFE", "延迟揭示": "#FDCB6E", "回响式": "#E17055", "背景式": "#74B9FF" };
  const depthLabels = { "独白式": "单次引用", "延迟揭示": "多次揭示", "回响式": "反复回响", "背景式": "持续底色" };

  prequels.forEach((p, pi) => {
    const y = m.top + 24 + pi * 38;
    prequelY[p.id] = y;

    // Prequel node
    svg.append("circle").attr("cx", m.left - 14).attr("cy", y).attr("r", 6)
      .attr("fill", p.color).attr("stroke", "#fff").attr("stroke-width", 2)
      .attr("opacity", 0.8);

    // Prequel label
    svg.append("text").attr("x", m.left - 22).attr("y", y + 4)
      .attr("text-anchor", "end").attr("font-size", 11).attr("fill", p.color)
      .attr("font-weight", "bold").text(`${p.id} ${p.name}`);

    // Depth badge
    svg.append("text").attr("x", m.left - 22).attr("y", y + 18)
      .attr("text-anchor", "end").attr("font-size", 8).attr("fill", "#aaa")
      .text(depthLabels[p.depth]);

    // Connection lines to scenes
    p.targets.forEach(scId => {
      const scIdx = scenes.findIndex(s => s.id === scId);
      if (scIdx === -1) return;
      const x = sceneX[scId];
      svg.append("line").attr("x1", m.left - 8).attr("y1", y).attr("x2", x).attr("y2", y)
        .attr("stroke", p.color).attr("stroke-width", 1.5)
        .attr("stroke-dasharray", "4,3").attr("opacity", 0.3);

      // Connection dot on scene
      svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 3)
        .attr("fill", p.color).attr("opacity", 0.5);
    });
  });

  // Scene column headers
  scenes.forEach((s, i) => {
    const x = sceneX[s.id];
    // Vertical guide line
    const topY = m.top;
    const bottomY = m.top + prequels.length * 38;
    svg.append("line").attr("x1", x).attr("y1", topY).attr("x2", x).attr("y2", bottomY)
      .attr("stroke", "#eee").attr("stroke-width", 0.5);

    svg.append("text").attr("x", x).attr("y", topY - 4)
      .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#999").text(s.id);
  });

  // Legend
  const div = document.createElement("div"); div.className = "legend";
  div.innerHTML = Object.entries(depthLabels).map(([k, v]) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${depthColors[k]}"></span> ${k}（${v}）</span>`
  ).join("");
  document.getElementById("panel-prequel").appendChild(div);
})();

</script>
</body>
</html>
