# 场景关联模型 — 从小说中提取场景之间的引用和依赖关系
# 实验 4.1: CLI 抽取 → 场景图谱
#
# 用法: qtadmin knowl extract --type scene-graph \
#   --input fiction.yaml --model ontology.yaml --output out/

scene_graph:
  description: 场景关联图 — 场景之间的引用、回调、前传依赖关系
  fields:
    - name: scenes
      type: array
      description: 场景清单 — 所有场景的基本信息
      items:
        type: object
        fields:
          - name: id
            type: string
            description: 场景唯一标识
          - name: title
            type: string
            description: 场景标题或概括
          - name: location
            type: string
            description: 场景发生地点
          - name: characters
            type: array
            items: string
            description: 本场景出场角色

    - name: forward_references
      type: array
      description: 前向引用 — 本场景提到了更早发生的事（前文或前传）
      items:
        type: object
        fields:
          - name: from_scene
            type: string
            description: 当前场景 ID
          - name: references
            type: array
            items:
              type: object
              fields:
                - name: target_scene
                  type: string | null
                  description: 被引用场景 ID（若在文本内）
                - name: type
                  type: enum
                  values: [callback, backstory, off_screen]
                  description: 引用类型：callback=前文回调，backstory=角色过往，off_screen=文本未覆盖的前传
                - name: content
                  type: string
                  description: 被引用事件的概括
                - name: excerpt
                  type: string
                  description: 原文中提及该引用的原句（逐字引用原文）

    - name: timeline_relationship
      type: array
      description: 时序关系 — 场景之间的时间先后和间隔
      items:
        type: object
        fields:
          - name: from
            type: string
            description: 前一场景 ID
          - name: to
            type: string
            description: 后一场景 ID
          - name: gap
            type: string
            description: 时间间隔描述（如"连续"、"数小时后"、"三年后"）

    - name: emotional_echoes
      type: array
      description: 情感回响 — 同一地点/物品在不同场景承载的不同情感
      items:
        type: object
        fields:
          - name: anchor
            type: string
            description: 锚点（地点/物品/台词）
          - name: past_emotion
            type: string
            description: 过去的情感记忆
          - name: present_emotion
            type: string
            description: 现在的情感感知
          - name: carried_by
            type: string
            description: 这种对比被谁察觉
          - name: excerpt_past
            type: string
            description: 原文中描述过去情感的句子
          - name: excerpt_present
            type: string
            description: 原文中描述现在情感的句子
