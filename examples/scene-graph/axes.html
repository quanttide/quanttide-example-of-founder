<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>主题轴推进</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, "Microsoft YaHei", sans-serif;
                background: #f8f9fa;
                padding: 40px;
            }
            h1 {
                text-align: center;
                color: #333;
                font-size: 22px;
            }
            .subtitle {
                text-align: center;
                color: #888;
                font-size: 13px;
                margin: 4px 0 24px;
            }
            .nav {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-bottom: 24px;
            }
            .nav a {
                padding: 6px 14px;
                border-radius: 6px;
                font-size: 13px;
                text-decoration: none;
                color: #888;
                background: #eee;
            }
            .nav a.active {
                background: #333;
                color: #fff;
            }
            .chart-wrap {
                background: #fff;
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
                padding: 24px;
                max-width: 1060px;
                margin: 0 auto;
            }
            svg {
                display: block;
                margin: 0 auto;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 12px;
                color: #666;
                margin-top: 16px;
            }
            .tooltip {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                opacity: 0;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <h1>主题轴推进</h1>
        <p class="subtitle">三条情感轴上的场景位置变化</p>
        <div class="nav">
            <a href="axes.html" class="active">主题轴</a>
            <a href="techniques.html">手法</a>
            <a href="carriers.html">情感载体</a>
            <a href="prequels.html">前传</a>
        </div>
        <div class="chart-wrap">
            <div id="chart"></div>
            <div class="legend" id="legend"></div>
        </div>
        <div class="tooltip" id="tooltip"></div>

        <script>
            (async function () {
                const r = await fetch("thematic-analysis.json");
                const data = await r.json();

                // Map JSON data to axes format: simplify stage names and derive scene positions
                const axisMap = data.themeAxes.map((ax) => ({
                    label: ax.name,
                    stages: ax.stages.map((s) => s.replace(/，.*/, "")),
                    colors:
                        ax === data.themeAxes[0]
                            ? ["#74B9FF", "#55E6C1", "#FDCB6E", "#E17055"]
                            : ax === data.themeAxes[1]
                              ? ["#A29BFE", "#6C5CE7", "#FD79A8", "#E17055"]
                              : ax === data.themeAxes[2]
                                ? [
                                      "#B8E994",
                                      "#82CCDD",
                                      "#F8A5C2",
                                      "#E77F67",
                                      "#E17055",
                                  ]
                                : ["#81ECEC", "#74B9FF", "#FDCB6E", "#55E6C1"],
                }));

                const stageKeys = [
                    "孤独→陪伴",
                    "猜测→确认",
                    "疏离→亲密",
                    "仰望→并肩",
                ];
                const scenes = data.scenes.map((s) => ({
                    id: s.id,
                    n: s.name,
                    pos: stageKeys.map((k) => {
                        const txt = s.position[k];
                        const idx = data.themeAxes[
                            stageKeys.indexOf(k)
                        ].stages.findIndex((st) =>
                            txt.includes(st.slice(0, 4)),
                        );
                        return idx >= 0 ? idx : 0;
                    }),
                    sub: s.emotionalCarrier.primary.replace(/[—\-].*/, ""),
                }));

                const W = 1000,
                    H = 420;
                const M = { t: 26, l: 130, r: 40, b: 32 };
                const IW = W - M.l - M.r;
                const IH = (H - M.t - M.b) / 3;
                const svg = d3
                    .select("#chart")
                    .append("svg")
                    .attr("width", W)
                    .attr("height", H);
                const tip = d3.select("#tooltip");

                axisMap.forEach((ax, ai) => {
                    const y0 = M.t + ai * IH,
                        y1 = M.t + (ai + 1) * IH,
                        my = (y0 + y1) / 2;
                    svg.append("text")
                        .attr("x", M.l - 10)
                        .attr("y", my + 4)
                        .attr("text-anchor", "end")
                        .attr("font-size", 13)
                        .attr("fill", "#444")
                        .attr("font-weight", "bold")
                        .text(ax.label);

                    const bw = IW / ax.stages.length;
                    ax.stages.forEach((st, si) => {
                        const bx = M.l + si * bw;
                        svg.append("rect")
                            .attr("x", bx)
                            .attr("y", y0 + 8)
                            .attr("width", bw)
                            .attr("height", IH - 16)
                            .attr("fill", ax.colors[si])
                            .attr("opacity", 0.08)
                            .attr("rx", 4);
                        if (si === 0 || si === ax.stages.length - 1) {
                            svg.append("text")
                                .attr("x", bx + (si === 0 ? 6 : bw - 6))
                                .attr("y", y0 + 24)
                                .attr("text-anchor", si === 0 ? "start" : "end")
                                .attr("font-size", 10)
                                .attr("fill", ax.colors[si])
                                .attr("font-weight", "bold")
                                .text(st);
                        }
                    });

                    scenes.forEach((sc, i) => {
                        const x = M.l + (i / (scenes.length - 1)) * IW;
                        const si = sc.pos[ai];
                        const dy =
                            y0 +
                            8 +
                            (IH - 16) * ((si + 0.5) / ax.stages.length);
                        svg.append("circle")
                            .attr("cx", x)
                            .attr("cy", dy)
                            .attr("r", 5)
                            .attr("fill", ax.colors[si])
                            .attr("stroke", "#fff")
                            .attr("stroke-width", 1.5)
                            .attr("opacity", 0.85)
                            .on("mouseenter", function () {
                                tip.style("opacity", 1)
                                    .html(
                                        `<b>${sc.id} ${sc.n}</b><br>${ax.label}：${ax.stages[si]}<br>${sc.sub}`,
                                    )
                                    .style("left", d3.event.pageX + 12 + "px")
                                    .style("top", d3.event.pageY - 10 + "px");
                            })
                            .on("mouseleave", () => tip.style("opacity", 0));
                        if (ai === 0) {
                            svg.append("text")
                                .attr("x", x)
                                .attr("y", y0 + IH + 12)
                                .attr("text-anchor", "middle")
                                .attr("font-size", 9)
                                .attr("fill", "#999")
                                .text(sc.id);
                        }
                    });
                });
            })();
        </script>
    </body>
</html>
