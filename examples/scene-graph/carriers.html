<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>情感载体流转</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, "Microsoft YaHei", sans-serif;
                background: #f8f9fa;
                padding: 40px;
            }
            h1 {
                text-align: center;
                color: #333;
                font-size: 22px;
            }
            .subtitle {
                text-align: center;
                color: #888;
                font-size: 13px;
                margin: 4px 0 24px;
            }
            .nav {
                display: flex;
                justify-content: center;
                gap: 6px;
                margin-bottom: 24px;
            }
            .nav a {
                padding: 6px 14px;
                border-radius: 6px;
                font-size: 13px;
                text-decoration: none;
                color: #888;
                background: #eee;
            }
            .nav a.active {
                background: #333;
                color: #fff;
            }
            .chart-wrap {
                background: #fff;
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
                padding: 24px;
                max-width: 1060px;
                margin: 0 auto;
            }
            svg {
                display: block;
                margin: 0 auto;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 12px;
                color: #666;
                margin-top: 16px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .legend-line {
                width: 20px;
                height: 3px;
                border-radius: 2px;
            }
            .tooltip {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                opacity: 0;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <h1>情感载体流转</h1>
        <p class="subtitle">
            跨度越高 = 情感记忆越远，圆点越大 = 经过的情感流量越多
        </p>
        <div class="nav">
            <a href="axes.html">主题轴</a>
            <a href="techniques.html">手法</a>
            <a href="carriers.html" class="active">情感载体</a>
            <a href="prequels.html">前传</a>
        </div>
        <div class="chart-wrap">
            <div id="chart"></div>
            <div class="legend" id="legend"></div>
        </div>
        <div class="tooltip" id="tooltip"></div>

        <script>
            (async function () {
                const r = await fetch("thematic-analysis.json");
                const data = await r.json();

                const sceneIds = data.scenes.map((s) => s.id);
                const scenemap = {};
                data.scenes.forEach((s) => (scenemap[s.id] = s));

                // Derive carrier arcs from carrierLineageSummary and scene data
                const carrierSpec = [
                    {
                        label: "Hello Kitty",
                        type: "物件",
                        from: "1_1",
                        to: "5_1",
                        sub: "行李箱贴纸 → 拖鞋",
                        weight: 2,
                    },
                    {
                        label: "伪装巧合",
                        type: "信息",
                        from: "1_1",
                        to: "4_2",
                        sub: "她碰巧来 → 好巧啊",
                        weight: 1.5,
                    },
                    {
                        label: "勇气",
                        type: "情感",
                        from: "4_1",
                        to: "4_2",
                        sub: "捏肩 → 夜市主动",
                        weight: 1.5,
                    },
                    {
                        label: "联结仪式",
                        type: "情感",
                        from: "4_2",
                        to: "4_3",
                        sub: "养小火人 → 问早",
                        weight: 1.5,
                    },
                    {
                        label: "海边记忆",
                        type: "场景对照",
                        from: "6_2",
                        to: "8_1",
                        sub: "她在身后 → 牵手同行",
                        weight: 2.5,
                    },
                    {
                        label: "坦白→拥抱",
                        type: "情感",
                        from: "7_1",
                        to: "7_2",
                        sub: "",
                        weight: 1,
                    },
                    {
                        label: "牵手",
                        type: "情感",
                        from: "7_2",
                        to: "8_1",
                        sub: "",
                        weight: 1,
                    },
                    {
                        label: "心结解开",
                        type: "情感",
                        from: "8_1",
                        to: "10_1",
                        sub: "→ 日常",
                        weight: 1.5,
                    },
                    {
                        label: "日常",
                        type: "情感",
                        from: "10_1",
                        to: "10_2",
                        sub: "书房→客厅",
                        weight: 1,
                    },
                    {
                        label: "日常延续",
                        type: "情感",
                        from: "10_2",
                        to: "10_3",
                        sub: "客厅→阳台",
                        weight: 1,
                    },
                    {
                        label: "日记本→信",
                        type: "延迟揭示",
                        from: "1_1",
                        to: "10_1",
                        sub: "1_1 设伏，10_1 被读",
                        weight: 3,
                    },
                ];

                const colors = {
                    物件: "#E67E22",
                    信息: "#2980B9",
                    情感: "#27AE60",
                    场景对照: "#8E44AD",
                    延迟揭示: "#C0392B",
                };

                const W = 1000,
                    H = 420,
                    M = { t: 40, l: 50, r: 30, b: 50 };
                const IW = W - M.l - M.r,
                    IH = H - M.t - M.b;
                const sx = sceneIds.map(
                    (_, i) => M.l + (i / (sceneIds.length - 1)) * IW,
                );
                const sceneIdx = {};
                sceneIds.forEach((id, i) => (sceneIdx[id] = i));

                carrierSpec.forEach((c) => {
                    c.span = sceneIdx[c.to] - sceneIdx[c.from];
                    c.fromIdx = sceneIdx[c.from];
                    c.toIdx = sceneIdx[c.to];
                });
                const maxSpan = d3.max(carrierSpec, (c) => c.span);
                function spanY(span) {
                    return M.t + IH * (1 - span / (maxSpan + 1));
                }

                const svg = d3
                    .select("#chart")
                    .append("svg")
                    .attr("width", W)
                    .attr("height", H);
                const tip = d3.select("#tooltip");

                svg.append("text")
                    .attr("x", 12)
                    .attr("y", M.t - 8)
                    .attr("font-size", 10)
                    .attr("fill", "#ccc")
                    .text("跨度 →");
                for (let s = 1; s <= maxSpan; s++) {
                    const y = spanY(s);
                    svg.append("line")
                        .attr("x1", M.l)
                        .attr("y1", y)
                        .attr("x2", M.l + IW)
                        .attr("y2", y)
                        .attr("stroke", "#f5f5f5")
                        .attr("stroke-width", 0.5);
                    if (s % 2 === 0)
                        svg.append("text")
                            .attr("x", M.l + IW + 4)
                            .attr("y", y + 3)
                            .attr("font-size", 9)
                            .attr("fill", "#eee")
                            .text(`${s}`);
                }

                // Throughput
                const throughput = sceneIds.map((_, i) => {
                    let c = 0;
                    carrierSpec.forEach((cr) => {
                        if (cr.fromIdx === i || cr.toIdx === i) c += cr.weight;
                    });
                    return c;
                });
                const maxThru = d3.max(throughput);

                sceneIds.forEach((id, i) => {
                    const x = sx[i];
                    const r = 3 + (throughput[i] / maxThru) * 8;
                    svg.append("circle")
                        .attr("cx", x)
                        .attr("cy", M.t + IH + 6)
                        .attr("r", r)
                        .attr("fill", "#4A90D9")
                        .attr("opacity", 0.25);
                    svg.append("circle")
                        .attr("cx", x)
                        .attr("cy", M.t + IH + 6)
                        .attr("r", 3)
                        .attr("fill", "#4A90D9");
                    svg.append("text")
                        .attr("x", x)
                        .attr("y", M.t + IH + 20)
                        .attr("text-anchor", "middle")
                        .attr("font-size", 9)
                        .attr("fill", "#999")
                        .text(id);
                });
                svg.append("text")
                    .attr("x", M.l + IW + 4)
                    .attr("y", M.t + IH + 10)
                    .attr("font-size", 9)
                    .attr("fill", "#ddd")
                    .text("场景 →");

                carrierSpec.forEach((c) => {
                    const x1 = sx[c.fromIdx],
                        x2 = sx[c.toIdx],
                        midX = (x1 + x2) / 2,
                        apex = spanY(c.span);
                    if (c.span >= 7) {
                        svg.append("ellipse")
                            .attr("cx", midX)
                            .attr("cy", (apex + M.t + IH + 6) / 2)
                            .attr("rx", Math.abs(x2 - x1) / 2 + 10)
                            .attr("ry", 40)
                            .attr("fill", colors[c.type])
                            .attr("opacity", 0.03);
                    }
                    const path = d3.path();
                    path.moveTo(x1, M.t + IH + 6);
                    path.quadraticCurveTo(midX, apex, x2, M.t + IH + 6);
                    const color = colors[c.type] || "#999";
                    const isDash = c.type === "延迟揭示";
                    svg.append("path")
                        .attr("d", path)
                        .attr("fill", "none")
                        .attr("stroke", color)
                        .attr("stroke-width", c.weight * 1.2)
                        .attr("stroke-dasharray", isDash ? "6,3" : "none")
                        .attr("opacity", 0.85);
                    svg.append("text")
                        .attr("x", midX)
                        .attr("y", apex - 6)
                        .attr("text-anchor", "middle")
                        .attr("font-size", 10)
                        .attr("fill", color)
                        .attr("font-weight", "bold")
                        .text(c.label);
                    if (c.sub)
                        svg.append("text")
                            .attr("x", midX)
                            .attr("y", apex + 10)
                            .attr("text-anchor", "middle")
                            .attr("font-size", 9)
                            .attr("fill", "#aaa")
                            .text(c.sub);
                    svg.append("rect")
                        .attr("x", midX - 70)
                        .attr("y", apex - 12)
                        .attr("width", 140)
                        .attr("height", 24)
                        .attr("fill", "transparent")
                        .on("mouseenter", () =>
                            tip
                                .style("opacity", 1)
                                .html(
                                    `<b>${c.label}</b><br>${c.type} · 跨度 ${c.span} 个场景<br>${c.from} → ${c.to}${c.sub ? "<br>" + c.sub : ""}`,
                                )
                                .style("left", d3.event.pageX + 12 + "px")
                                .style("top", d3.event.pageY - 10 + "px"),
                        )
                        .on("mouseleave", () => tip.style("opacity", 0));
                });

                d3.select("#legend").html(
                    Object.entries(colors)
                        .map(
                            ([k, v]) =>
                                `<span class="legend-item"><span class="legend-line" style="background:${v}"></span> ${k}</span>`,
                        )
                        .join("") +
                        `<span style="font-size:11px;color:#bbb;margin-left:8px">虚线 = 延迟揭示</span>`,
                );
            })();
        </script>
    </body>
</html>
