entries:
  - id: s001
    source: 场景实验/海边
    text: |
      林远亭站在栈桥尽头，海风把他的衬衫吹得猎猎作响。

      他很久没来过这里了。上一次站在这个位置，是三年前的一个雨夜——那天陆知微在电话里说"我们冷静一段时间"，然后挂了。他在暴雨里站了四个小时，最终没有等来第二条消息。

      那之后他刻意绕开这条海岸线整整三年。

      如今再站在这里，雨夜的记忆像潮水一样涌回来。但他发现，同样的场景，心情已经完全不一样了。他低头看了一眼手机——锁屏壁纸是上周两人在动物园拍的合照，她靠在他肩上，笑得像个孩子。

      "原来同一个地方，可以同时装着最痛的回忆和最暖的现在。"他在心里想。

  - id: s002
    source: 场景实验/动物园
    text: |
      陆知微趴在玻璃前，看企鹅摇摇摆摆地走路。

      "你看那只——它落单了。"她指着角落里一只独自面壁的企鹅，转头对林远亭说，"像不像三年前的你？"

      林远亭愣了一下，然后笑了："你怎么知道我当时在暴雨里站过？"

      "猜的。你说过你做了很多傻事。"她眨眨眼，"以后想做傻事的时候，记得叫我一起。"

      他想起了刚刚完成的那个项目——连续加班三周，昨晚凌晨两点才上线。今天本来应该在家补觉，但她一句"好久没去动物园了"，他就二话不说出了门。他知道这也是在还债，还那三年的空白债。

      "你知道吗，"他说，"上次来动物园是十年前，学校春游。"

      "那这次呢？"

      "这次是约会。"

  - id: s003
    source: 场景实验/咖啡馆
    text: |
      雨毫无征兆地落下来。

      他们躲进路边一家叫"从前慢"的咖啡馆。老板是个戴圆框眼镜的中年人，看到他们进来，笑着说："找地方躲雨？随便坐。"

      林远亭点单的时候，注意到吧台上放着一本翻旧了的《小王子》。

      "说来奇怪，"陆知微捧着热巧克力，看着窗外雨帘，"三年前我从这家店门口经过，透过玻璃看到一个人在角落看书。那个侧脸让我多看了好几秒。"

      林远亭端咖啡的手顿了顿。

      "那个人……不会是我吧？"

      "不知道。"她笑了笑，"那个角度我只看到侧脸。也许是你，也许是别人。"

      林远亭低头喝了一口咖啡，没有追问。但他知道，三年前他确实经常一个人泡在咖啡馆里。那段日子他在躲所有人，包括他自己。

      如果他当时抬起头，隔着玻璃看到了她，故事会不会提前三年开始？

      雨停了。

  - id: s004
    source: 场景实验/家
    text: |
      晚上回到家，陆知微发现书桌上多了一个信封。

      她打开，里面是一张手写的卡片，字迹是林远亭的：

      "十年前春游的动物园，我其实也去了。那只落单的企鹅，我也看到了。当时我在想，如果有一天能和喜欢的人一起来就好了。

      今天实现了。

      P.S. 咖啡馆那个侧脸，应该是我。书不是《小王子》，是《百年孤独》。但谢谢你让它变成了小王子的故事。"

      陆知微把卡片贴在了冰箱上，和那张动物园的合照并排。
