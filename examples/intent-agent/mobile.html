<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>意图澄清工具 · 移动端</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fff; height: 100dvh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; border-left: 1px solid #eee; border-right: 1px solid #eee; }

    /* 顶部标题栏 */
    .topbar { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #eee; text-align: center; font-size: 15px; background: #fafafa; flex-shrink: 0; }

    /* 主内容区 */
    .main { flex: 1; overflow-y: auto; display: none; padding: 12px; }
    .main.active { display: flex; flex-direction: column; }

    /* 对话区 */
    .chat-history { flex: 1; overflow-y: auto; }
    .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 88%; font-size: 14px; line-height: 1.45; }
    .user { background: #e0e7ff; margin-left: auto; }
    .ai { background: #f3f3f3; }
    .proposal-tag { display: inline-block; margin-top: 6px; font-size: 12px; background: #fff; border: 1px solid #aaa; padding: 3px 8px; border-radius: 6px; cursor: pointer; color: #333; }

    .input-row { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid #eee; margin-top: 8px; flex-shrink: 0; }
    .input-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .input-row button { padding: 10px 16px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }

    /* 看板区 */
    .card-controls { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .btn { padding: 8px 14px; border: 1px solid #aaa; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #f0f0f0; }
    .card-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .card { border: 1px solid #ddd; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: flex; align-items: flex-start; gap: 6px; background: #fff; }
    .card.proposed { border-left: 4px solid #f0b400; background: #fffdf0; }
    .card.confirmed { border-left: 4px solid #2e7d32; }
    .card .content { flex: 1; outline: none; word-break: break-word; min-height: 20px; }
    .card .actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; line-height: 1; border-radius: 4px; }
    .icon-btn:active { background: #eee; }
    .drag-handle { color: #aaa; font-size: 14px; padding: 2px 0; }
    .export-area { padding-top: 10px; border-top: 1px solid #eee; flex-shrink: 0; display: flex; gap: 8px; align-items: center; }

    /* 底部导航 */
    .tabbar { display: flex; border-top: 1px solid #eee; flex-shrink: 0; background: #fafafa; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; color: #888; }
    .tab.active { color: #333; border-bottom: 2px solid #333; }

    /* 拖拽态 */
    .card.dragging { opacity: 0.4; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbarTitle">对话</div>

  <!-- 对话视图 -->
  <div class="main active" id="chatView">
    <div class="chat-history" id="chatHistory">
      <div class="msg ai">你好，开始探索吧。我会根据对话自动生成情境卡片提案。</div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="输入你的想法…" onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 看板视图 -->
  <div class="main" id="boardView">
    <div class="card-controls">
      <button class="btn" onclick="addManualCard()">＋ 添加卡片</button>
      <span style="font-size:12px; color:#888; margin-left:auto;">卡片: <span id="cardCount">0</span></span>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="export-area">
      <button class="btn" onclick="exportBRD()">导出 BRD</button>
      <span style="font-size:11px; color:#888;">复制到剪贴板</span>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <button class="tab active" id="tabChat" onclick="switchTab('chat')">💬 对话</button>
    <button class="tab" id="tabBoard" onclick="switchTab('board')">📋 看板</button>
  </div>
</div>

<script>
  let cards = [ { id: 'c1', text: '探索用Streaming封装LLM调用', status: 'confirmed' } ];
  let cardIdCounter = 2;

  function switchTab(tab) {
    const chatView = document.getElementById('chatView');
    const boardView = document.getElementById('boardView');
    const tabChat = document.getElementById('tabChat');
    const tabBoard = document.getElementById('tabBoard');
    const topbar = document.getElementById('topbarTitle');
    if (tab === 'chat') {
      chatView.classList.add('active');
      boardView.classList.remove('active');
      tabChat.classList.add('active');
      tabBoard.classList.remove('active');
      topbar.textContent = '对话';
    } else {
      boardView.classList.add('active');
      chatView.classList.remove('active');
      tabBoard.classList.add('active');
      tabChat.classList.remove('active');
      topbar.textContent = '情境看板';
      renderCards();
    }
  }

  function renderCards() {
    const container = document.getElementById('cardList');
    container.innerHTML = '';
    cards.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = `card ${card.status}`;
      cardEl.dataset.index = index;
      cardEl.dataset.id = card.id;

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';

      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = card.text;
      content.contentEditable = true;
      content.addEventListener('blur', (e) => {
        const newText = e.target.textContent.trim();
        if (newText && newText !== card.text) { card.text = newText; renderCards(); }
        else if (!newText) { e.target.textContent = card.text; }
      });

      const actions = document.createElement('div');
      actions.className = 'actions';

      if (card.status === 'proposed') {
        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'icon-btn'; acceptBtn.innerHTML = '✓'; acceptBtn.title = '接受';
        acceptBtn.onclick = () => { card.status = 'confirmed'; renderCards(); };
        actions.appendChild(acceptBtn);

        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'icon-btn'; rejectBtn.innerHTML = '✗'; rejectBtn.title = '驳回';
        rejectBtn.onclick = () => { cards = cards.filter(c => c.id !== card.id); renderCards(); };
        actions.appendChild(rejectBtn);
      } else {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'icon-btn'; deleteBtn.innerHTML = '🗑'; deleteBtn.title = '删除';
        deleteBtn.onclick = () => { cards = cards.filter(c => c.id !== card.id); renderCards(); };
        actions.appendChild(deleteBtn);
      }

      cardEl.appendChild(handle);
      cardEl.appendChild(content);
      cardEl.appendChild(actions);

      // 触摸拖拽
      cardEl.addEventListener('touchstart', touchStart);
      cardEl.addEventListener('touchmove', touchMove);
      cardEl.addEventListener('touchend', touchEnd);

      container.appendChild(cardEl);
    });
    document.getElementById('cardCount').textContent = cards.length;
  }

  // 简易触摸拖拽
  let dragCard = null;
  let dragStartY = 0;
  function touchStart(e) { dragCard = e.target.closest('.card'); if (dragCard) dragStartY = e.touches[0].clientY; }
  function touchMove(e) { e.preventDefault(); }
  function touchEnd(e) {
    if (!dragCard) return;
    const endY = e.changedTouches[0].clientY;
    const diff = endY - dragStartY;
    const index = parseInt(dragCard.dataset.index);
    if (Math.abs(diff) > 40) {
      const targetIndex = diff > 0 ? Math.min(index + 1, cards.length - 1) : Math.max(index - 1, 0);
      if (targetIndex !== index) {
        const moved = cards.splice(index, 1)[0];
        cards.splice(targetIndex, 0, moved);
        renderCards();
      }
    }
    dragCard = null;
  }

  function addManualCard(text = '新卡片') {
    cards.push({ id: 'c' + cardIdCounter++, text, status: 'confirmed' });
    renderCards();
    setTimeout(() => { const last = document.querySelector('.card:last-child .content'); if (last) last.focus(); }, 100);
  }

  function exportBRD() {
    const brd = cards.filter(c => c.status === 'confirmed').map(c => c.text).join('\n\n');
    const full = '# 情境意识 BRD\n' + new Date().toLocaleString() + '\n\n' + brd;
    navigator.clipboard.writeText(full).then(() => alert('BRD已复制到剪贴板'));
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const history = document.getElementById('chatHistory');
    const userMsg = document.createElement('div');
    userMsg.className = 'msg user'; userMsg.textContent = text;
    history.appendChild(userMsg);

    setTimeout(() => {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      let reply = '收到。';
      let proposalText = null;
      if (text.includes('探索') || text.includes('尝试')) { reply = '我们正在探索新方向。'; proposalText = '尝试方向：' + text.slice(0, 30); }
      else if (text.includes('结论') || text.includes('发现')) { reply = '这个结论很重要。'; proposalText = '结论：' + text.slice(0, 30); }
      else if (text.includes('状态') || text.includes('目前')) { reply = '了解当前状态。'; proposalText = '当前状态：' + text.slice(0, 30); }
      else if (text.includes('下一步')) { reply = '设定下一步。'; proposalText = '下一步：' + text.slice(0, 30); }
      else { reply = '已记录。'; proposalText = '情境节点：' + text.slice(0, 30); }
      aiMsg.innerHTML = reply + (proposalText ? `<br><span class="proposal-tag" onclick="addProposedCard('${proposalText.replace(/'/g, "\\'")}')">📌 生成卡片：${proposalText}</span>` : '');
      history.appendChild(aiMsg);
      history.scrollTop = history.scrollHeight;
      if (proposalText) addProposedCard(proposalText);
    }, 500);
  }

  function addProposedCard(text) {
    cards.push({ id: 'c' + cardIdCounter++, text, status: 'proposed' });
    renderCards();
  }

  renderCards();
</script>
</body>
</html>
