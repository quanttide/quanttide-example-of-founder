<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>意图澄清工具 · 情境看板原型</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .app-container {
      display: flex;
      width: 100%;
      max-width: 1400px;
      height: 90vh;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
      overflow: hidden;
    }

    /* 左右双栏等宽等高 */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-right: 1px solid #e0e0e0;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      padding: 16px 20px;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* 左栏：对话区 */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .user-message {
      align-self: flex-end;
      background: #007aff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      align-self: flex-start;
      background: #f0f0f0;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .ai-message .proposal-hint {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 6px 12px;
      color: #007aff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ai-message .proposal-hint:hover {
      background: #e6f0ff;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-area input:focus {
      border-color: #007aff;
    }

    .input-area button {
      padding: 12px 20px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover {
      background: #005fcc;
    }

    /* 右栏：情境看板 */
    .right-panel .panel-body {
      padding-top: 0;
    }

    .card-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid #d0d0d0;
      background: white;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-primary {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }

    .btn-primary:hover {
      background: #005fcc;
    }

    .btn:hover {
      background: #f5f5f5;
    }

    .btn-primary:hover {
      background: #005fcc;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 12px;
    }

    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 16px;
      position: relative;
      transition: box-shadow 0.2s, border-color 0.2s;
      cursor: grab;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.proposed {
      background: #fdf8e7;
      border-color: #f0d87e;
      border-left: 4px solid #f0b400;
    }

    .card.confirmed {
      background: white;
      border-left: 4px solid #34c759;
    }

    .card .card-content {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      outline: none;
      min-height: 20px;
    }

    .card.confirmed .card-content[contenteditable="true"] {
      background: #f9f9f9;
      border-radius: 6px;
      padding: 4px 6px;
      border: 1px dashed #ccc;
    }

    .card.proposed .card-content[contenteditable="true"] {
      background: #fff9e0;
      border-radius: 6px;
      padding: 4px 6px;
      border: 1px dashed #f0b400;
    }

    .card .card-status {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 12px;
      color: #f0b400;
      background: rgba(240,180,0,0.1);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .card.confirmed .card-status {
      display: none;
    }

    .card .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
      color: #555;
      line-height: 1;
    }

    .icon-btn:hover {
      background: rgba(0,0,0,0.05);
    }

    .icon-btn.accept {
      color: #34c759;
    }
    .icon-btn.reject {
      color: #ff3b30;
    }
    .icon-btn.edit {
      color: #007aff;
    }
    .icon-btn.delete {
      color: #999;
    }

    .card.dragging {
      opacity: 0.4;
      border-style: dashed;
    }

    .export-area {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 10px;
    }

    .empty-state {
      color: #aaa;
      text-align: center;
      margin-top: 30px;
      font-style: italic;
    }

    .highlight {
      animation: highlight 2s ease;
    }

    @keyframes highlight {
      0% { background: #e6f0ff; }
      100% { background: white; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- 左栏：对话区 -->
  <div class="panel left-panel">
    <div class="panel-header">
      <span>💬 对话探索</span>
    </div>
    <div class="panel-body">
      <div class="chat-history" id="chatHistory">
        <div class="message ai-message">
          👋 你好，我们可以开始探索了。你可以告诉我你想解决什么问题，或者想尝试的方向。我会根据对话自动生成情境卡片提案。
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="输入你的想法..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- 右栏：情境看板 -->
  <div class="panel right-panel">
    <div class="panel-header">
      <span>📋 情境看板</span>
      <span style="font-size:13px; font-weight:400; color:#666;">卡片数: <span id="cardCount">0</span></span>
    </div>
    <div class="panel-body">
      <div class="card-controls">
        <button class="btn" onclick="addManualCard()">＋ 手动添加卡片</button>
        <span style="font-size:12px; color:#888; margin-left:auto;">拖拽排序</span
