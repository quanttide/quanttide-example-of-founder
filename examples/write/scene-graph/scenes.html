<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>场景关系图</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, "Microsoft YaHei", sans-serif;
                background: #f8f9fa;
                padding: 40px;
            }
            h1 {
                text-align: center;
                color: #333;
                margin-bottom: 4px;
                font-size: 24px;
            }
            .subtitle {
                text-align: center;
                color: #888;
                margin-bottom: 24px;
                font-size: 14px;
            }
            .controls {
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            .controls button {
                padding: 6px 16px;
                border: 1px solid #ccc;
                border-radius: 6px;
                background: #fff;
                cursor: pointer;
                font-size: 13px;
                color: #555;
                transition: all 0.15s;
            }
            .controls button.active {
                background: #333;
                color: #fff;
                border-color: #333;
            }
            .controls button:hover {
                background: #eee;
            }
            .controls button.active:hover {
                background: #444;
            }
            svg {
                display: block;
                margin: 0 auto;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            }
            .link {
                fill: none;
                stroke-width: 2;
            }
            .link-label {
                font-size: 11px;
                fill: #888;
            }
            .prequel-link {
                fill: none;
                stroke-width: 1.5;
                stroke-dasharray: 4, 3;
            }
            .node circle {
                stroke: #fff;
                stroke-width: 2.5;
                cursor: pointer;
                transition: r 0.15s;
            }
            .node circle:hover {
                r: 22;
            }
            .node text {
                font-size: 12px;
                fill: #333;
                pointer-events: none;
            }
            .node .sub {
                font-size: 10px;
                fill: #888;
            }
            .prequel-node circle {
                stroke-dasharray: 3, 2;
                stroke: #999;
            }
            .prequel-node text {
                fill: #777;
            }
            .legend {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 16px;
                flex-wrap: wrap;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
                color: #555;
            }
            .legend-color {
                width: 14px;
                height: 14px;
                border-radius: 4px;
            }
            .tooltip-box {
                position: absolute;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                padding: 10px 14px;
                border-radius: 8px;
                font-size: 13px;
                line-height: 1.6;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.15s;
                max-width: 320px;
            }
        </style>
    </head>
    <body>
        <h1>场景关系图</h1>
        <p class="subtitle">鼠标悬停节点查看详情</p>
        <div class="controls">
            <button data-mode="phase" class="active">阶段</button>
            <button data-mode="technique">引用手法</button>
            <button data-mode="iceberg">冰山</button>
        </div>
        <div id="chart" style="position: relative">
            <div class="tooltip-box" id="tooltip"></div>
        </div>
        <div class="legend" id="legend"></div>

        <script>
            const techniqueColor = {
                物件反复: "#E67E22",
                伪装巧合: "#2980B9",
                第三方桥接: "#27AE60",
                场景对照: "#8E44AD",
                延迟揭示: "#C0392B",
            };

            const prequelColor = "#1A5276";

            const data = {
                phases: [
                    { name: "初遇期", color: "#4A90D9" },
                    { name: "靠近期", color: "#50B86C" },
                    { name: "升温期", color: "#F5A623" },
                    { name: "转折期", color: "#E8654B" },
                    { name: "日常期", color: "#9B59B6" },
                ],
                prequels: [
                    {
                        id: "P1",
                        name: "毕业晚会",
                        detail: "他看她的古典舞，记了十年",
                    },
                    {
                        id: "P2",
                        name: "公开演讲",
                        detail: "她听他的创业理想，第一次心动",
                    },
                    {
                        id: "P3",
                        name: "大四聚餐",
                        detail: "两桌人，他注意到了她",
                    },
                    {
                        id: "P4",
                        name: "海边深夜",
                        detail: "他写信，她在身后没有打扰",
                    },
                    { id: "P5", name: "醉酒坦白", detail: "被朋友问出心里话" },
                    { id: "P6", name: "朋友圈十年", detail: "屏幕后的十年" },
                    {
                        id: "P7",
                        name: "读他的代码",
                        detail: "干净到每个模块都是教科书",
                    },
                ],
                scenes: [
                    {
                        id: "1_1",
                        name: "咖啡厅重逢",
                        phase: "初遇期",
                        sub: "十年后初遇",
                    },
                    {
                        id: "1_2",
                        name: "深夜失眠",
                        phase: "初遇期",
                        sub: "重逢后失眠",
                    },
                    {
                        id: "2_1",
                        name: "展会再遇",
                        phase: "靠近期",
                        sub: "工作场合重逢",
                    },
                    {
                        id: "2_3",
                        name: "傍晚小龙虾",
                        phase: "靠近期",
                        sub: "展会后晚餐",
                    },
                    {
                        id: "4_1",
                        name: "便利店谈心",
                        phase: "靠近期",
                        sub: "深夜倾诉",
                    },
                    {
                        id: "4_2",
                        name: "夜市约会",
                        phase: "靠近期",
                        sub: "雨夜逛夜市",
                    },
                    {
                        id: "4_3",
                        name: "互相问早",
                        phase: "靠近期",
                        sub: "清晨问候",
                    },
                    {
                        id: "5_1",
                        name: "家里吃火锅",
                        phase: "升温期",
                        sub: "第一次到家里",
                    },
                    {
                        id: "6_2",
                        name: "海边散步",
                        phase: "升温期",
                        sub: "分享过去伤痛",
                    },
                    {
                        id: "7_1",
                        name: "酒吧表白",
                        phase: "转折期",
                        sub: "醉酒告白",
                    },
                    {
                        id: "7_2",
                        name: "公园拥抱",
                        phase: "转折期",
                        sub: "确认关系",
                    },
                    {
                        id: "8_1",
                        name: "海边再散步",
                        phase: "日常期",
                        sub: "在一起后重游",
                    },
                    {
                        id: "10_1",
                        name: "书房陪伴",
                        phase: "日常期",
                        sub: "发现十年书信",
                    },
                    {
                        id: "10_2",
                        name: "客厅看剧",
                        phase: "日常期",
                        sub: "日常窝沙发",
                    },
                    {
                        id: "10_3",
                        name: "阳台看星星",
                        phase: "日常期",
                        sub: "阳台夜话",
                    },
                ],
                edges: [
                    { from: "1_1", to: "1_2", type: "延续" },
                    { from: "1_1", to: "2_1", type: "延续" },
                    { from: "1_1", to: "4_1", type: "延续" },
                    {
                        from: "1_1",
                        to: "5_1",
                        type: "延续",
                        technique: "物件反复",
                        note: "行李箱 Hello Kitty → 拖鞋",
                    },
                    { from: "2_1", to: "2_3", type: "延续" },
                    { from: "4_1", to: "4_2", type: "延续" },
                    { from: "4_2", to: "4_3", type: "延续" },
                    {
                        from: "6_2",
                        to: "8_1",
                        type: "呼应",
                        technique: "场景对照",
                        note: "独自写信 → 牵手同行",
                    },
                    { from: "7_1", to: "7_2", type: "延续" },
                    { from: "7_2", to: "8_1", type: "延续" },
                    {
                        from: "8_1",
                        to: "10_1",
                        type: "延续",
                        technique: "延迟揭示",
                        note: "日记本 → 十年信被发现",
                    },
                    { from: "10_1", to: "10_2", type: "延续" },
                    { from: "10_2", to: "10_3", type: "延续" },
                ],
                prequelEdges: [
                    { from: "P1", to: "1_2" },
                    { from: "P1", to: "6_2" },
                    { from: "P2", to: "4_1" },
                    { from: "P3", to: "5_1" },
                    { from: "P4", to: "6_2" },
                    { from: "P4", to: "1_1" },
                    { from: "P5", to: "1_1" },
                    { from: "P5", to: "7_1" },
                    { from: "P5", to: "10_1" },
                    { from: "P6", to: "1_1" },
                    { from: "P6", to: "4_2" },
                    { from: "P7", to: "2_1" },
                ],
                sceneTechniques: {
                    "1_1": ["伪装巧合", "物件反复"],
                    "4_2": ["伪装巧合"],
                    "5_1": ["物件反复", "第三方桥接"],
                    "6_2": ["场景对照"],
                    "8_1": ["场景对照"],
                    "10_1": ["延迟揭示"],
                },
            };

            const width = 1100,
                height = 700;
            const margin = { top: 60, bottom: 160, left: 80, right: 80 };
            const innerW = width - margin.left - margin.right;
            const innerH = height - margin.top - margin.bottom;

            const phaseNames = data.phases.map((p) => p.name);
            const phaseColor = {};
            data.phases.forEach((p) => (phaseColor[p.name] = p.color));

            let mode = "phase";

            const phaseIndex = {};
            phaseNames.forEach((n, i) => (phaseIndex[n] = i));

            const positions = {};
            data.scenes.forEach((s, i) => {
                positions[s.id] = {
                    x: margin.left + (i / (data.scenes.length - 1)) * innerW,
                    y:
                        margin.top +
                        (phaseIndex[s.phase] / (phaseNames.length - 1)) *
                            innerH *
                            0.65,
                };
            });

            // Prequel positions: evenly spaced below the scenes
            const prequelPositions = {};
            data.prequels.forEach((p, i) => {
                prequelPositions[p.id] = {
                    x:
                        margin.left +
                        ((i + 0.5) / data.prequels.length) * innerW,
                    y: margin.top + innerH * 0.85,
                };
            });

            const svg = d3
                .select("#chart")
                .append("svg")
                .attr("width", width)
                .attr("height", height);
            const tooltip = d3.select("#tooltip");

            // Water line
            const waterY = margin.top + innerH * 0.72;
            svg.append("line")
                .attr("x1", margin.left - 20)
                .attr("y1", waterY)
                .attr("x2", margin.left + innerW + 20)
                .attr("y2", waterY)
                .attr("stroke", "#AED6F1")
                .attr("stroke-width", 2)
                .attr("opacity", 0);

            // Wave text
            svg.append("text")
                .attr("x", margin.left + innerW + 24)
                .attr("y", waterY + 4)
                .attr("font-size", 12)
                .attr("fill", "#AED6F1")
                .attr("opacity", 0)
                .text("水面")
                .attr("class", "water-label");

            // Phase background bands
            phaseNames.forEach((name, pi) => {
                const y0 =
                    margin.top +
                    (pi / (phaseNames.length - 1)) * innerH * 0.65 -
                    28;
                const y1 =
                    margin.top +
                    (pi / (phaseNames.length - 1)) * innerH * 0.65 +
                    28;
                svg.append("rect")
                    .attr("x", margin.left)
                    .attr("y", y0)
                    .attr("width", innerW)
                    .attr("height", y1 - y0)
                    .attr("fill", phaseColor[name])
                    .attr("opacity", 0.06)
                    .attr("rx", 6);
                svg.append("text")
                    .attr("x", margin.left - 10)
                    .attr("y", (y0 + y1) / 2 + 4)
                    .attr("text-anchor", "end")
                    .attr("font-size", 13)
                    .attr("fill", phaseColor[name])
                    .attr("font-weight", "bold")
                    .text(name);
            });

            function getNodeColor(s) {
                if (mode === "technique") {
                    const t = data.sceneTechniques[s.id];
                    if (t && t.length > 0)
                        return techniqueColor[t[0]] || phaseColor[s.phase];
                }
                return phaseColor[s.phase];
            }

            function getNodeTitle(s) {
                const techs = data.sceneTechniques[s.id];
                let extra = "";
                if (techs && techs.length > 0)
                    extra = "\n手法：" + techs.join("、");
                return `${s.id} ${s.name}\n${s.sub}\n阶段：${s.phase}${extra}`;
            }

            // Groups for layering
            const prequelLinkGroup = svg
                .append("g")
                .attr("class", "prequel-link-group");
            const edgeGroup = svg.append("g").attr("class", "edge-group");
            const prequelNodeGroup = svg
                .append("g")
                .attr("class", "prequel-node-group");
            const nodeGroup = svg.append("g").attr("class", "node-group");

            function renderEdges() {
                edgeGroup.selectAll("*").remove();
                data.edges.forEach((e) => {
                    const from = positions[e.from];
                    const to = positions[e.to];
                    if (!from || !to) return;

                    const dx = to.x - from.x,
                        dy = to.y - from.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const r = 18;
                    const nx = dx / dist,
                        ny = dy / dist;
                    const x1 = from.x + nx * r,
                        y1 = from.y + ny * r;
                    const x2 = to.x - nx * r,
                        y2 = to.y - ny * r;
                    const midX = (x1 + x2) / 2,
                        midY = (y1 + y2) / 2;

                    const strokeColor =
                        mode === "technique" && e.technique
                            ? techniqueColor[e.technique]
                            : "#bbb";

                    edgeGroup
                        .append("line")
                        .attr("x1", x1)
                        .attr("y1", y1)
                        .attr("x2", x2)
                        .attr("y2", y2)
                        .attr("class", "link")
                        .attr("stroke", strokeColor)
                        .attr(
                            "stroke-dasharray",
                            e.type === "呼应" ? "6,4" : "none",
                        );

                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    svg.append("polygon")
                        .attr(
                            "points",
                            `${x2},${y2} ${x2 - 10 * Math.cos(angle - 0.35)},${y2 - 10 * Math.sin(angle - 0.35)} ${x2 - 10 * Math.cos(angle + 0.35)},${y2 - 10 * Math.sin(angle + 0.35)}`,
                        )
                        .attr("fill", strokeColor);

                    let label = e.type;
                    if (mode === "technique" && e.technique)
                        label = e.technique;
                    edgeGroup
                        .append("text")
                        .attr("x", midX + 8)
                        .attr("y", midY - 4)
                        .attr("class", "link-label")
                        .attr("fill", strokeColor)
                        .text(label);
                });
            }

            function renderPrequels() {
                const isIceberg = mode === "iceberg";
                prequelLinkGroup.selectAll("*").remove();
                prequelNodeGroup.selectAll("*").remove();

                // Water line
                svg.selectAll(".water-line").remove();
                svg.selectAll(".water-label").remove();

                if (isIceberg) {
                    // "水面" divider
                    const y = margin.top + innerH * 0.72;
                    svg.append("line")
                        .attr("class", "water-line")
                        .attr("x1", margin.left - 20)
                        .attr("y1", y)
                        .attr("x2", margin.left + innerW + 20)
                        .attr("y2", y)
                        .attr("stroke", "#AED6F1")
                        .attr("stroke-width", 2);

                    // Wave label
                    data.prequels.forEach((p, i) => {
                        const px =
                            margin.left +
                            ((i + 0.5) / data.prequels.length) * innerW;
                        svg.append("text")
                            .attr("class", "water-label")
                            .attr("x", px)
                            .attr("y", y - 6)
                            .attr("text-anchor", "middle")
                            .attr("font-size", 11)
                            .attr("fill", "#AED6F1")
                            .text("▔");
                    });

                    // "冰山水下" label
                    svg.append("text")
                        .attr("class", "water-label")
                        .attr("x", margin.left + innerW + 24)
                        .attr("y", y + 4)
                        .attr("font-size", 12)
                        .attr("fill", "#AED6F1")
                        .text("水面");

                    // Prequel links
                    prequelLinkGroup.attr("opacity", 1);
                    data.prequelEdges.forEach((e) => {
                        const from = prequelPositions[e.from];
                        const to = positions[e.to];
                        if (!from || !to) return;
                        prequelLinkGroup
                            .append("line")
                            .attr("x1", from.x)
                            .attr("y1", from.y)
                            .attr("x2", to.x)
                            .attr("y2", to.y)
                            .attr("class", "prequel-link")
                            .attr("stroke", prequelColor)
                            .attr("opacity", 0.3);
                    });

                    // Prequel nodes
                    data.prequels.forEach((p) => {
                        const pos = prequelPositions[p.id];
                        const g = prequelNodeGroup
                            .append("g")
                            .attr("class", "prequel-node")
                            .attr("transform", `translate(${pos.x},${pos.y})`);

                        g.append("circle")
                            .attr("r", 16)
                            .attr("fill", prequelColor)
                            .attr("opacity", 0.3)
                            .attr("stroke", prequelColor)
                            .attr("stroke-width", 1.5)
                            .attr("stroke-dasharray", "3,2")
                            .on("mouseenter", () => {
                                let refs =
                                    (
                                        data.prequels.find(
                                            (q) => q.id === p.id,
                                        ) || {}
                                    ).refBy || [];
                                let refText = refs.length
                                    ? "<br/><b>出现在：</b>" + refs.join(", ")
                                    : "";
                                tooltip
                                    .style("opacity", 1)
                                    .html(
                                        `<b>${p.id} ${p.name}</b><br/>${p.detail}${refText}`,
                                    )
                                    .style("left", pos.x + 22 + "px")
                                    .style("top", pos.y - 10 + "px");
                            })
                            .on("mouseleave", () =>
                                tooltip.style("opacity", 0),
                            );

                        g.append("text")
                            .attr("y", 3)
                            .attr("text-anchor", "middle")
                            .attr("font-size", 11)
                            .attr("fill", prequelColor)
                            .attr("opacity", 0.6)
                            .text(p.id);

                        g.append("text")
                            .attr("y", -18)
                            .attr("text-anchor", "middle")
                            .attr("font-size", 10)
                            .attr("fill", "#777")
                            .text(p.name);
                    });
                } else {
                    prequelLinkGroup.attr("opacity", 0);
                }
            }

            function renderNodes() {
                nodeGroup.selectAll("*").remove();
                data.scenes.forEach((s) => {
                    const p = positions[s.id];
                    const g = nodeGroup
                        .append("g")
                        .attr("class", "node")
                        .attr("transform", `translate(${p.x},${p.y})`);

                    g.append("circle")
                        .attr("r", 18)
                        .attr("fill", getNodeColor(s))
                        .attr("opacity", 0.9)
                        .on("mouseenter", () => {
                            let techInfo = "";
                            const techs = data.sceneTechniques[s.id];
                            if (techs && techs.length > 0)
                                techInfo =
                                    "<br/><b>手法：</b>" + techs.join("、");

                            // Prequel refs
                            const preqRefs = data.prequels.filter(
                                (pq) => pq.refBy && pq.refBy.includes(s.id),
                            );
                            if (preqRefs.length > 0) {
                                techInfo += "<br/><b>前传：</b>";
                                preqRefs.forEach((pq, i) => {
                                    if (i > 0) techInfo += "<br/>";
                                    techInfo += `${pq.id} ${pq.name}`;
                                });
                            }

                            const outEdges = data.edges.filter(
                                (e) => e.from === s.id && e.technique,
                            );
                            if (outEdges.length > 0) {
                                techInfo += "<br/><b>连接：</b>";
                                outEdges.forEach((e, i) => {
                                    if (i > 0) techInfo += "<br/>";
                                    techInfo += `${e.technique} → ${e.to}（${e.note || ""}）`;
                                });
                            }

                            tooltip
                                .style("opacity", 1)
                                .html(
                                    `<b>${s.id} ${s.name}</b><br/>${s.sub}<br/><b>阶段：</b>${s.phase}${techInfo}`,
                                )
                                .style("left", p.x + 24 + "px")
                                .style("top", p.y - 20 + "px");
                        })
                        .on("mouseleave", () => tooltip.style("opacity", 0));

                    g.append("text")
                        .attr("y", -10)
                        .attr("text-anchor", "middle")
                        .attr("class", "sub")
                        .text(s.sub);
                    g.append("text")
                        .attr("y", 4)
                        .attr("text-anchor", "middle")
                        .attr("font-weight", "bold")
                        .attr("font-size", 13)
                        .attr("fill", "#fff")
                        .text(s.id);
                });
            }

            function renderLegend() {
                const legendEl = document.getElementById("legend");
                legendEl.innerHTML = "";
                if (mode === "phase") {
                    data.phases.forEach((p) => {
                        const item = document.createElement("div");
                        item.className = "legend-item";
                        item.innerHTML = `<div class="legend-color" style="background:${p.color}"></div> ${p.name}`;
                        legendEl.appendChild(item);
                    });
                } else if (mode === "technique") {
                    Object.entries(techniqueColor).forEach(([name, color]) => {
                        const item = document.createElement("div");
                        item.className = "legend-item";
                        item.innerHTML = `<div class="legend-color" style="background:${color}"></div> ${name}`;
                        legendEl.appendChild(item);
                    });
                } else {
                    // iceberg
                    const s = document.createElement("div");
                    s.className = "legend-item";
                    s.innerHTML = `<div class="legend-color" style="background:#4A90D9"></div> 水面之上（写出的场景）`;
                    legendEl.appendChild(s);
                    const p = document.createElement("div");
                    p.className = "legend-item";
                    p.innerHTML = `<div class="legend-color" style="background:${prequelColor};opacity:0.4"></div> 水面之下（前传）`;
                    legendEl.appendChild(p);
                }
            }

            function switchMode(newMode) {
                mode = newMode;
                document.querySelectorAll(".controls button").forEach((btn) => {
                    btn.classList.toggle("active", btn.dataset.mode === mode);
                });
                renderNodes();
                renderEdges();
                renderPrequels();
                renderLegend();
            }

            document.querySelectorAll(".controls button").forEach((btn) => {
                btn.addEventListener("click", () =>
                    switchMode(btn.dataset.mode),
                );
            });

            renderNodes();
            renderEdges();
            renderPrequels();
            renderLegend();
        </script>
    </body>
</html>
